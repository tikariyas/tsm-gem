<body class="min-h-screen flex flex-col">

  <!-- MAIN WORKSPACE -->

    <!-- 1B. STUDENT LOBBY (ONLY ONE BUTTON) -->

    <!-- 2. TEACHER ACTIVE CLASSROOM VIEW -->

        <div class="absolute top-3 left-3 px-2.5 py-1 rounded-lg bg-black/70 text-white text-[11px] font-bold backdrop-blur-sm">
          <span id="studentTeacherNameTag">Teacher</span>
        </div>

        <div class="absolute bottom-3 right-3 w-28 sm:w-44 aspect-video rounded-xl overflow-hidden border-2 border-emerald-500/80 bg-[#050810] shadow-xl">

          Flip Camera

  <!-- MODAL FOR INVITE QR -->
  <div id="trialModalBackdrop" onclick="if(event.target===this) closeTrialModal()" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div id="trialModalBox" class="bg-white border border-slate-200 rounded-2xl shadow-xl max-w-md w-full p-5 space-y-4 text-xs"></div>
  </div>

  <!-- TOAST -->
  <div id="vcToast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-[#0F172A] text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg border border-slate-700"></div>

  <script>
    // =========================================================================
    // 1. SHARED CONFIG & FIREBASE SIGNALING (ISOLATED IN master_state)
    // =========================================================================
    const STORAGE_KEY = 'tsm_pwa_state_v8';
    const SESSION_KEY = 'tsm_active_session_v8';
    const CONFIG_KEY = 'tsm_firebase_config_v1';
    const TURN_KEY = 'tsm_video_turn_v1';
    const SIGNAL_COLLECTION = 'tsm_system';
    const MASTER_DOC_ID = 'master_state';
    const MAX_BATCH_STUDENTS = 6;

    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyD6UUHQL7hcWxvnOIFIzVxOPPU0wrSojFQ",
      authDomain: "tikariya-music---foundation.firebaseapp.com",
      projectId: "tikariya-music---foundation",
      storageBucket: "tikariya-music---foundation.firebasestorage.app",
      messagingSenderId: "869254236044",
      appId: "1:869254236044:web:fb6f5fccca9129cc4d78a9",
      measurementId: "G-0HC5PTKZQ3"
    };

    const DEFAULT_STUN_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' }
    ];

    let db = null;
    let localAppState = { batches: [], students: [] };
    const selectedStudentIds = new Set();

    // URL context
    const urlParams = new URLSearchParams(window.location.search);
    const isStudentMode = (urlParams.get('role') || '').toLowerCase() === 'student';
    let urlRoomSlug = (urlParams.get('room') || '').trim();
    let urlStudentId = (urlParams.get('sid') || '').trim();
    let urlStudentRoll = (urlParams.get('roll') || '').trim();
    let urlBatchParam = (urlParams.get('batch') || '').trim();
    let urlNameParam = (urlParams.get('name') || '').trim();

    // Active role & room state
    let currentRole = null; // 'teacher' | 'student' | null
    let activeRoomSlug = '';
    let activeRoomDisplayName = '';
    let teacherSessionId = '';
    let localStream = null;
    let currentFacingMode = 'user';
    let teacherOwnEchoCancel = false;
    let teacherMicEnabled = true;
    let teacherCamEnabled = true;

    // Teacher peers map
    const teacherPeers = new Map();
    let soloPeerId = null;
    let pinnedPeerId = null;
    let unsubTeacherPeers = null;
    let teacherHeartbeatTimer = null;
    let liveTimerInterval = null;
    let classStartedAtMs = 0;

    // Student connection state
    let studentPeerId = '';
    let studentPc = null;
    let studentPendingIce = [];
    let studentCurrentAudioMode = 'music_raw';
    let unsubStudentPeerDoc = null;
    let studentWatchdogInterval = null;
    let studentLastCmdAt = 0;

    // Lobby watcher
    let unsubLobbyRoom = null;
    let matchedStudentRoom = null;

    // Audio meters
    let micTestStream = null;
    let micTestCtx = null;
    let localSelfAudioCtx = null;

    function masterDocRef() {
      return db.collection(SIGNAL_COLLECTION).doc(MASTER_DOC_ID);
    }

    async function updateMasterField(patchObj) {
      try {
        await masterDocRef().update(patchObj);
      } catch (err) {
        if (err && (err.code === 'not-found' || /No document to update/i.test(err.message || ''))) {
          const nested = {};
          for (const [dotPath, val] of Object.entries(patchObj)) {
            if (val && typeof val === 'object' && val.constructor && val.constructor.name === 'DeleteFieldValueImpl') continue;
            const parts = dotPath.split('.');
            let cur = nested;
            for (let i = 0; i < parts.length - 1; i++) {
              if (!cur[parts[i]] || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {};
              cur = cur[parts[i]];
            }
            cur[parts[parts.length - 1]] = val;
          }
          await masterDocRef().set(nested, { merge: true });
        } else {
          throw err;
        }
      }
    }

    // =========================================================================
    // 2. UTILITIES
    // =========================================================================
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('vcToast');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function showLobbyError(msg) {
      const box = document.getElementById(isStudentMode ? 'vcStudentError' : 'vcLobbyError');
      if (!box) return;
      if (!msg) {
        box.classList.add('hidden');
        box.textContent = '';
        return;
      }
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    function slugifyRoom(name) {
      const clean = String(name || 'custom_class')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '')
        .slice(0, 48);
      return clean || 'custom_class';
    }

    function getTeacherRoomSelection() {
      const selVal = (document.getElementById('roomBatchSelect')?.value || '__custom__').trim();
      const customVal = (document.getElementById('customRoomInput')?.value || '').trim();
      const isCustom = (selVal === '__custom__');
      const displayName = isCustom
        ? (customVal || 'Custom Video Class')
        : (customVal || selVal);
      const slug = isCustom
        ? slugifyRoom(displayName) + '_' + String(Date.now()).slice(-4)
        : slugifyRoom(displayName);
      return { displayName, slug, isCustom, batchName: isCustom ? '' : selVal };
    }

    function getIceConfiguration() {
      const servers = [...DEFAULT_STUN_SERVERS];
      try {
        const raw = localStorage.getItem(TURN_KEY);
        if (raw) {
          const t = JSON.parse(raw);
          if (t && t.url) {
            const entry = { urls: t.url.trim() };
            if (t.username) entry.username = t.username.trim();
            if (t.credential) entry.credential = t.credential.trim();
            servers.push(entry);
          }
        }
      } catch (e) {}
      return { iceServers: servers, iceCandidatePoolSize: 6 };
    }

    function startLiveClock() {
      stopLiveClock();
      classStartedAtMs = Date.now();
      const badge = document.getElementById('liveRoomTimer');
      if (badge) {
        badge.classList.remove('hidden');
        badge.textContent = 'LIVE 00:00';
      }
      liveTimerInterval = setInterval(() => {
        const sec = Math.max(0, Math.floor((Date.now() - classStartedAtMs) / 1000));
        const mm = String(Math.floor(sec / 60)).padStart(2, '0');
        const ss = String(sec % 60).padStart(2, '0');
        if (badge) badge.textContent = `LIVE ${mm}:${ss}`;
      }, 1000);
    }

    function stopLiveClock() {
      if (liveTimerInterval) { clearInterval(liveTimerInterval); liveTimerInterval = null; }
      const badge = document.getElementById('liveRoomTimer');
      if (badge) badge.classList.add('hidden');
    }

    // =========================================================================
    // 3. GUITAR & MUSICAL INSTRUMENT AUDIO ENGINE (OPUS 128KBPS + RAW MIC)
    // =========================================================================
    function buildMusicAudioConstraints(mode = 'music_raw') {
      const useEc = (mode === 'music_ec');
      return {
        echoCancellation: useEc,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1,
        sampleRate: 48000,
        sampleSize: 16
      };
    }

    function buildVideoConstraints(facingMode = 'user', isTeacher = false) {
      return {
        facingMode: { ideal: facingMode },
        width: { ideal: isTeacher ? 960 : 640, max: isTeacher ? 1280 : 854 },
        height: { ideal: isTeacher ? 540 : 360, max: isTeacher ? 720 : 480 },
        frameRate: { ideal: 24, max: 30 }
      };
    }

    async function acquireMusicMediaStream({ audioMode = 'music_raw', facingMode = 'user', isTeacher = false } = {}) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Camera & Microphone unavailable (HTTPS required).');
      }
      const attempts = [
        { audio: buildMusicAudioConstraints(audioMode), video: buildVideoConstraints(facingMode, isTeacher) },
        { audio: { echoCancellation: audioMode === 'music_ec', noiseSuppression: false, autoGainControl: false }, video: { facingMode } },
        { audio: true, video: true }
      ];
      let lastErr = null;
      for (const constraints of attempts) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          const vTrack = stream.getVideoTracks()[0];
          const aTrack = stream.getAudioTracks()[0];
          if (!vTrack || !aTrack) {
            stream.getTracks().forEach(t => t.stop());
            throw new Error('Camera and Microphone are both required.');
          }
          try { if ('contentHint' in aTrack) aTrack.contentHint = 'music'; } catch (e) {}
          try { if ('contentHint' in vTrack) vTrack.contentHint = 'motion'; } catch (e) {}
          return stream;
        } catch (err) {
          lastErr = err;
          if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
            throw new Error('Allow Camera & Microphone permission to continue.');
          }
        }
      }
      throw lastErr || new Error('Could not access Camera and Microphone.');
    }

    function tuneSdpForMusicAudio(sdp, bitrateBps = 128000) {
      if (!sdp) return sdp;
      const lines = sdp.split('\r\n');
      let opusPt = null;
      for (const line of lines) {
        const m = line.match(/^a=rtpmap:(\d+)\s+opus\/48000\/2/i);
        if (m) { opusPt = m[1]; break; }
      }
      if (!opusPt) return sdp;

      const musicParams = `minptime=10;useinbandfec=1;usedtx=0;maxaveragebitrate=${bitrateBps};cbr=1;maxplaybackrate=48000;sprop-maxcapturerate=48000`;
      let foundFmtp = false;
      const out = lines.map(line => {
        if (line.startsWith(`a=fmtp:${opusPt} `)) {
          foundFmtp = true;
          return `a=fmtp:${opusPt} ${musicParams}`;
        }
        return line;
      });
      if (!foundFmtp) {
        const rtpmapIdx = out.findIndex(l => l.startsWith(`a=rtpmap:${opusPt} `));
        if (rtpmapIdx !== -1) out.splice(rtpmapIdx + 1, 0, `a=fmtp:${opusPt} ${musicParams}`);
      }
      return out.join('\r\n');
    }

    async function applyTrackBitratePriorities(pc, isTeacher = false) {
      try {
        const senders = pc.getSenders ? pc.getSenders() : [];
        for (const sender of senders) {
          if (!sender.track) continue;
          const params = sender.getParameters ? sender.getParameters() : null;
          if (!params) continue;
          if (!Array.isArray(params.encodings) || !params.encodings.length) {
            params.encodings = [{}];
          }
          if (sender.track.kind === 'audio') {
            params.encodings[0].maxBitrate = 128000;
            try { params.encodings[0].priority = 'high'; } catch (e) {}
          } else if (sender.track.kind === 'video') {
            params.encodings[0].maxBitrate = isTeacher ? 900000 : 420000;
          }
          await sender.setParameters(params).catch(() => {});
        }
      } catch (e) {}
    }

    function attachAudioMeter(stream, barElementId) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx || !stream || !stream.getAudioTracks().length) return null;
        const ctx = new AudioCtx();
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);
        let stopped = false;
        let rafId = 0;

        const tick = () => {
          if (stopped) return;
          analyser.getByteTimeDomainData(data);
          let sumSq = 0;
          for (let i = 0; i < data.length; i++) {
            const v = (data[i] - 128) / 128;
            sumSq += v * v;
          }
          const rms = Math.sqrt(sumSq / data.length);
          const pct = Math.min(100, Math.round(rms * 320));
          const el = document.getElementById(barElementId);
          if (el) el.style.width = pct + '%';
          rafId = requestAnimationFrame(tick);
        };
        tick();

        return {
          stop: () => {
            stopped = true;
            cancelAnimationFrame(rafId);
            try { src.disconnect(); } catch (e) {}
            try { ctx.close(); } catch (e) {}
          }
        };
      } catch (e) {
        return null;
      }
    }

    // =========================================================================
    // 5. LIVE ROOM MATCHING FOR STUDENTS (CUSTOM SELECTED OR BATCH)
    // =========================================================================
    function findMatchingLiveRoomForStudent(roomsMap) {
      const now = Date.now();
      const liveRooms = Object.values(roomsMap || {}).filter(r =>
        r && r.status === 'live' && r.teacherHeartbeat && (now - Number(r.teacherHeartbeat) < 120000)
      );
      if (!liveRooms.length) return null;
      liveRooms.sort((a, b) => Number(b.startedAt || 0) - Number(a.startedAt || 0));

      // 1. Direct invite link (?room=slug)
      if (urlRoomSlug) {
        const direct = liveRooms.find(r => r.roomId === urlRoomSlug);
        if (direct) return direct;
      }

      // 2. Teacher explicitly selected this student (works for ANY custom class at any time)
      if (urlStudentId || urlStudentRoll) {
        const bySelected = liveRooms.find(r => {
          const ids = Array.isArray(r.allowedStudentIds) ? r.allowedStudentIds : [];
          const rolls = Array.isArray(r.allowedRollNos) ? r.allowedRollNos : [];
          if (!ids.length && !rolls.length) return false;
          if (urlStudentId && ids.includes(urlStudentId)) return true;
          if (urlStudentRoll && rolls.some(x => String(x).toUpperCase() === urlStudentRoll.toUpperCase())) return true;
          return false;
        });
        if (bySelected) return bySelected;
      }

      // 3. Whole-batch class (when teacher started a batch without restricting to specific students)
      if (urlBatchParam) {
        const stuBatchSlug = slugifyRoom(urlBatchParam);
        const byBatch = liveRooms.find(r => {
          const hasRestrict = (Array.isArray(r.allowedStudentIds) && r.allowedStudentIds.length > 0) ||
                              (Array.isArray(r.allowedRollNos) && r.allowedRollNos.length > 0);
          if (hasRestrict) return false;
          return r.roomId === stuBatchSlug || slugifyRoom(r.batchName) === stuBatchSlug;
        });
        if (byBatch) return byBatch;
      }

      // 4. Open custom class with no student restriction and no batch restriction
      const openCustom = liveRooms.find(r => {
        const hasRestrict = (Array.isArray(r.allowedStudentIds) && r.allowedStudentIds.length > 0) ||
                            (Array.isArray(r.allowedRollNos) && r.allowedRollNos.length > 0);
        return r.isCustom && !hasRestrict;
      });
      return openCustom || null;
    }

    async function startTeacherClass() {
      showLobbyError('');
      if (!db) {
        showLobbyError('Cloud connection unavailable.');
        return;
      }
      stopLocalGuitarMicTest();

      const btn = document.getElementById('btnStartTeacherClass');
      if (btn) { btn.disabled = true; btn.textContent = 'Starting...'; }

      try {
        const { displayName, slug, isCustom } = getTeacherRoomSelection();
        const defaultAudioMode = document.getElementById('defaultAudioProfile')?.value || 'music_raw';
        teacherOwnEchoCancel = (defaultAudioMode === 'music_ec');

        const selectedIds = [...selectedStudentIds];
        const selectedRolls = selectedIds
          .map(id => (localAppState.students || []).find(s => s.id === id)?.rollNo || '')
          .filter(Boolean);

        localStream = await acquireMusicMediaStream({
          audioMode: defaultAudioMode,
          facingMode: currentFacingMode,
          isTeacher: true
        });

        activeRoomSlug = slug;
        activeRoomDisplayName = displayName;
        teacherSessionId = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        currentRole = 'teacher';
        teacherMicEnabled = true;
        teacherCamEnabled = true;

        if (unsubLobbyRoom) { unsubLobbyRoom(); unsubLobbyRoom = null; }

        await updateMasterField({
          [`videoClassRooms.${slug}`]: {
            roomId: slug,
            batchName: displayName,
            isCustom: Boolean(isCustom),
            allowedStudentIds: selectedIds,
            allowedRollNos: selectedRolls,
            status: 'live',
            teacherSessionId,
            teacherName: 'Teacher',
            defaultAudioMode,
            maxStudents: MAX_BATCH_STUDENTS,
            startedAt: Date.now(),
            teacherHeartbeat: Date.now(),
            peers: {}
          }
        });

        teacherHeartbeatTimer = setInterval(() => {
          if (currentRole === 'teacher' && db && activeRoomSlug) {
            updateMasterField({
              [`videoClassRooms.${activeRoomSlug}.teacherHeartbeat`]: Date.now()
            }).catch(() => {});
          }
        }, 15000);

        document.getElementById('teacherLobbyView').classList.add('hidden');
        document.getElementById('teacherStageView').classList.remove('hidden');
        document.getElementById('teacherRoomTitle').textContent = displayName;
        updateTeacherAudioModeBadge();

        const localVid = document.getElementById('teacherLocalVideo');
        if (localVid) localVid.srcObject = localStream;
        localSelfAudioCtx = attachAudioMeter(localStream, 'teacherSelfAudioBar');

        startLiveClock();
        renderTeacherStudentsGrid();

        unsubTeacherPeers = masterDocRef().onSnapshot((snap) => {
          const master = snap.exists ? (snap.data() || {}) : {};
          const rd = (master.videoClassRooms && master.videoClassRooms[activeRoomSlug]) || null;
          if (!rd || rd.teacherSessionId !== teacherSessionId) return;
          const peersMap = (rd.peers && typeof rd.peers === 'object') ? rd.peers : {};

          Object.entries(peersMap).forEach(([peerId, peerData]) => {
            if (!peerData || peerData.teacherSessionId !== teacherSessionId) return;
            if (peerData.left === true) {
              if (teacherPeers.has(peerId)) cleanupTeacherPeer(peerId);
              updateMasterField({
                [`videoClassRooms.${activeRoomSlug}.peers.${peerId}`]: firebase.firestore.FieldValue.delete()
              }).catch(() => {});
              return;
            }
            if (!teacherPeers.has(peerId)) {
              if (teacherPeers.size >= MAX_BATCH_STUDENTS) {
                updateMasterField({
                  [`videoClassRooms.${activeRoomSlug}.peers.${peerId}.remoteCmd`]: {
                    kicked: true,
                    reason: 'Class full (max 6 students)',
                    cmdAt: Date.now()
                  }
                }).catch(() => {});
                return;
              }
              createTeacherPeerEntry(peerId, peerData);
            }
            syncTeacherPeerFromSnapshot(peerId, peerData);
          });

          [...teacherPeers.keys()].forEach((pid) => {
            if (!peersMap[pid]) cleanupTeacherPeer(pid);
          });
        }, () => {});
      } catch (err) {
        console.error('Start teacher class error:', err);
        const msg = err && err.message ? err.message : 'Could not start Video Class';
        showLobbyError(msg);
        showToast(msg);
        await teardownTeacherResources();
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Start Video Class'; }
      }
    }

    function createTeacherPeerEntry(peerId, peerData) {
      const pc = new RTCPeerConnection(getIceConfiguration());
      const remoteStream = new MediaStream();
      const peerEntry = {
        peerId,
        pc,
        meta: { studentName: peerData.studentName || 'Student', audioMode: peerData.audioMode || 'music_raw', videoLive: true, audioLive: true },
        remoteStream,
        pendingIce: [],
        seenStudentIce: new Set(),
        iceOutQueue: [],
        iceOutTimer: null,
        answered: false,
        localMuted: false,
        connState: 'connecting',
        meter: null,
        lastAvAlert: false,
        lastAudioMode: peerData.audioMode || 'music_raw'
      };
      teacherPeers.set(peerId, peerEntry);

      const flushTeacherIce = () => {
        peerEntry.iceOutTimer = null;
        if (!peerEntry.iceOutQueue.length || !activeRoomSlug) return;
        const batch = peerEntry.iceOutQueue.splice(0, peerEntry.iceOutQueue.length);
        updateMasterField({
          [`videoClassRooms.${activeRoomSlug}.peers.${peerId}.iceTeacher`]: firebase.firestore.FieldValue.arrayUnion(...batch)
        }).catch(() => {});
      };

      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.ontrack = (evt) => {
        if (evt.streams && evt.streams[0]) {
          evt.streams[0].getTracks().forEach(t => {
            if (!remoteStream.getTracks().some(x => x.id === t.id)) remoteStream.addTrack(t);
          });
        } else if (evt.track) {
          if (!remoteStream.getTracks().some(x => x.id === evt.track.id)) remoteStream.addTrack(evt.track);
        }
        bindPeerVideoElement(peerId);
      };

      pc.onicecandidate = (evt) => {
        if (evt.candidate) {
          peerEntry.iceOutQueue.push(JSON.stringify(evt.candidate.toJSON()));
          if (!peerEntry.iceOutTimer) {
            peerEntry.iceOutTimer = setTimeout(flushTeacherIce, 120);
          }
        }
      };

      pc.onconnectionstatechange = () => {
        peerEntry.connState = pc.connectionState || pc.iceConnectionState || 'connecting';
        updateStudentTileStatusBadges(peerId);
        if (pc.connectionState === 'closed') cleanupTeacherPeer(peerId);
      };

      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
          peerEntry.connState = 'connected';
          updateStudentTileStatusBadges(peerId);
        } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
          peerEntry.connState = pc.iceConnectionState;
          updateStudentTileStatusBadges(peerId);
        }
      };

      renderTeacherStudentsGrid();
    }

    async function syncTeacherPeerFromSnapshot(peerId, data) {
      const peerEntry = teacherPeers.get(peerId);
      if (!peerEntry) return;
      const pc = peerEntry.pc;

      peerEntry.meta = { ...peerEntry.meta, ...data };
      updateStudentTileStatusBadges(peerId);

      if (data.offer && !peerEntry.answered) {
        peerEntry.answered = true;
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await pc.createAnswer();
          answer.sdp = tuneSdpForMusicAudio(answer.sdp, 128000);
          await pc.setLocalDescription(answer);
          await applyTrackBitratePriorities(pc, true);

          await updateMasterField({
            [`videoClassRooms.${activeRoomSlug}.peers.${peerId}.answer`]: { type: answer.type, sdp: answer.sdp }
          });

          for (const c of peerEntry.pendingIce) {
            await pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
          }
          peerEntry.pendingIce = [];
        } catch (err) {
          cleanupTeacherPeer(peerId);
          return;
        }
      }

      if (Array.isArray(data.iceStudent)) {
        for (const candStr of data.iceStudent) {
          if (!candStr || peerEntry.seenStudentIce.has(candStr)) continue;
          peerEntry.seenStudentIce.add(candStr);
          try {
            const cand = typeof candStr === 'string' ? JSON.parse(candStr) : candStr;
            if (pc.remoteDescription) {
              pc.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
            } else {
              peerEntry.pendingIce.push(cand);
            }
          } catch (e) {}
        }
      }
    }

    async function joinStudentClass() {
      showLobbyError('');
      if (!db || !matchedStudentRoom) return;

      const btn = document.getElementById('btnJoinStudentClass');
      if (btn) { btn.disabled = true; btn.textContent = 'Connecting...'; }

      try {
        const room = matchedStudentRoom;
        const slug = room.roomId;
        const targetTeacherSession = room.teacherSessionId;
        const studentName = urlNameParam || 'Student';
        studentCurrentAudioMode = room.defaultAudioMode || 'music_raw';

        localStream = await acquireMusicMediaStream({
          audioMode: studentCurrentAudioMode,
          facingMode: currentFacingMode,
          isTeacher: false
        });

        activeRoomSlug = slug;
        activeRoomDisplayName = room.batchName || 'Video Class';
        studentPeerId = 'stu_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        currentRole = 'student';
        studentLastCmdAt = 0;

        if (unsubLobbyRoom) { unsubLobbyRoom(); unsubLobbyRoom = null; }

        document.getElementById('studentLobbyView').classList.add('hidden');
        document.getElementById('studentStageView').classList.remove('hidden');
        document.getElementById('studentTeacherNameTag').textContent = room.teacherName || 'Teacher';
        document.getElementById('studentSelfNameTag').textContent = studentName;

        const selfVid = document.getElementById('studentLocalSelfVideo');
        if (selfVid) selfVid.srcObject = localStream;
        localSelfAudioCtx = attachAudioMeter(localStream, 'studentSelfMicBar');

        startLiveClock();
        await connectStudentPeerConnection(slug, targetTeacherSession, studentName);
        attachStudentTrackWatchdog(slug);
      } catch (err) {
        const msg = err && err.message ? err.message : 'Could not join Video Class';
        showLobbyError(msg);
        await leaveStudentClass(true);
      }
    }

    async function connectStudentPeerConnection(slug, targetTeacherSession, studentName) {
      if (studentPc) { try { studentPc.close(); } catch (e) {} }
      studentPendingIce = [];
      const seenTeacherIce = new Set();
      let iceOutQueue = [];
      let iceOutTimer = null;

      const flushStudentIce = () => {
        iceOutTimer = null;
        if (!iceOutQueue.length || !studentPeerId) return;
        const batch = iceOutQueue.splice(0, iceOutQueue.length);
        updateMasterField({
          [`videoClassRooms.${slug}.peers.${studentPeerId}.iceStudent`]: firebase.firestore.FieldValue.arrayUnion(...batch)
        }).catch(() => {});
      };

      const pc = new RTCPeerConnection(getIceConfiguration());
      studentPc = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const teacherStream = new MediaStream();
      pc.ontrack = (evt) => {
        if (evt.streams && evt.streams[0]) {
          evt.streams[0].getTracks().forEach(t => {
            if (!teacherStream.getTracks().some(x => x.id === t.id)) teacherStream.addTrack(t);
          });
        } else if (evt.track) {
          if (!teacherStream.getTracks().some(x => x.id === evt.track.id)) teacherStream.addTrack(evt.track);
        }
        const remoteVid = document.getElementById('studentRemoteTeacherVideo');
        const overlay = document.getElementById('studentTeacherVideoOverlay');
        if (remoteVid) {
          remoteVid.srcObject = teacherStream;
          const playPromise = remoteVid.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {
              document.getElementById('btnStudentUnblockAudio')?.classList.remove('hidden');
            });
          }
        }
        if (overlay) overlay.classList.add('hidden');
      };

      pc.onicecandidate = (evt) => {
        if (evt.candidate) {
          iceOutQueue.push(JSON.stringify(evt.candidate.toJSON()));
          if (!iceOutTimer) iceOutTimer = setTimeout(flushStudentIce, 120);
        }
      };

      const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
      offer.sdp = tuneSdpForMusicAudio(offer.sdp, 128000);
      await pc.setLocalDescription(offer);
      await applyTrackBitratePriorities(pc, false);

      await updateMasterField({
        [`videoClassRooms.${slug}.peers.${studentPeerId}`]: {
          peerId: studentPeerId,
          studentName,
          teacherSessionId: targetTeacherSession,
          joinedAt: Date.now(),
          lastSeen: Date.now(),
          videoLive: true,
          audioLive: true,
          audioMode: studentCurrentAudioMode,
          left: false,
          offer: { type: offer.type, sdp: offer.sdp },
          iceStudent: [],
          iceTeacher: []
        }
      });

      if (unsubStudentPeerDoc) unsubStudentPeerDoc();
      unsubStudentPeerDoc = masterDocRef().onSnapshot(async (snap) => {
        const master = snap.exists ? (snap.data() || {}) : {};
        const rd = (master.videoClassRooms && master.videoClassRooms[slug]) || null;
        if (!rd || rd.status !== 'live' || rd.teacherSessionId !== targetTeacherSession) {
          leaveStudentClass(true);
          return;
        }
        const d = (rd.peers && rd.peers[studentPeerId]) || null;
        if (!d) return;

        if (d.answer && !pc.currentRemoteDescription) {
          try {
            await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
            for (const c of studentPendingIce) {
              await pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
            }
            studentPendingIce = [];
          } catch (e) {}
        }

        if (Array.isArray(d.iceTeacher)) {
          for (const candStr of d.iceTeacher) {
            if (!candStr || seenTeacherIce.has(candStr)) continue;
            seenTeacherIce.add(candStr);
            try {
              const cand = typeof candStr === 'string' ? JSON.parse(candStr) : candStr;
              if (pc.remoteDescription) {
                pc.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
              } else {
                studentPendingIce.push(cand);
              }
            } catch (e) {}
          }
        }

        if (d.remoteCmd && Number(d.remoteCmd.cmdAt || 0) > studentLastCmdAt) {
          studentLastCmdAt = Number(d.remoteCmd.cmdAt);
          if (d.remoteCmd.kicked) {
            leaveStudentClass(true);
            return;
          }
          if (typeof d.remoteCmd.forceEchoCancel === 'boolean') {
            const desiredMode = d.remoteCmd.forceEchoCancel ? 'music_ec' : 'music_raw';
            if (desiredMode !== studentCurrentAudioMode) {
              studentCurrentAudioMode = desiredMode;
              await swapLocalAudioTrack(desiredMode);
              updateMasterField({
                [`videoClassRooms.${slug}.peers.${studentPeerId}.audioMode`]: desiredMode
              }).catch(() => {});
            }
          }
        }
      });
    }

    function unblockStudentTeacherAudio() {

    function attachStudentTrackWatchdog(slug) {
      if (studentWatchdogInterval) clearInterval(studentWatchdogInterval);
      const checkHealth = () => {
        if (currentRole !== 'student' || !localStream || !studentPeerId) return;
        const vTrack = localStream.getVideoTracks()[0];
        const aTrack = localStream.getAudioTracks()[0];
        if (vTrack && !vTrack.enabled) vTrack.enabled = true;
        if (aTrack && !aTrack.enabled) aTrack.enabled = true;

        const vLive = Boolean(vTrack && vTrack.readyState === 'live' && !vTrack.muted);
        const aLive = Boolean(aTrack && aTrack.readyState === 'live' && !aTrack.muted);
        const banner = document.getElementById('studentAvWarningBanner');
        if (banner) banner.classList.toggle('hidden', vLive && aLive);

        updateMasterField({
          [`videoClassRooms.${slug}.peers.${studentPeerId}.videoLive`]: vLive,
          [`videoClassRooms.${slug}.peers.${studentPeerId}.audioLive`]: aLive,
          [`videoClassRooms.${slug}.peers.${studentPeerId}.lastSeen`]: Date.now()
        }).catch(() => {});
      };

      localStream.getTracks().forEach(t => {
        t.onended = checkHealth;
        t.onmute = checkHealth;
        t.onunmute = checkHealth;
      });
      studentWatchdogInterval = setInterval(checkHealth, 5000);
    }

    async function restoreStudentCameraAndMic() {
      try {
        const fresh = await acquireMusicMediaStream({
          audioMode: studentCurrentAudioMode,
          facingMode: currentFacingMode,
          isTeacher: false
        });
        const newV = fresh.getVideoTracks()[0];
        const newA = fresh.getAudioTracks()[0];
        if (studentPc) {
          const transceivers = studentPc.getTransceivers ? studentPc.getTransceivers() : [];
          if (transceivers.length) {
            for (const tr of transceivers) {
              const kind = tr.sender?.track?.kind || tr.receiver?.track?.kind || '';
              if (kind === 'video' && newV && tr.sender) await tr.sender.replaceTrack(newV).catch(() => {});
              if (kind === 'audio' && newA && tr.sender) await tr.sender.replaceTrack(newA).catch(() => {});
            }
          } else {
            for (const sender of studentPc.getSenders()) {
              if (sender.track?.kind === 'video' && newV) await sender.replaceTrack(newV).catch(() => {});
              if (sender.track?.kind === 'audio' && newA) await sender.replaceTrack(newA).catch(() => {});
            }
          }
        }
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        localStream = fresh;
        const selfVid = document.getElementById('studentLocalSelfVideo');
        if (selfVid) selfVid.srcObject = localStream;
        if (localSelfAudioCtx) localSelfAudioCtx.stop();
        localSelfAudioCtx = attachAudioMeter(localStream, 'studentSelfMicBar');
        document.getElementById('studentAvWarningBanner')?.classList.add('hidden');
        if (activeRoomSlug && studentPeerId) {
          updateMasterField({
            [`videoClassRooms.${activeRoomSlug}.peers.${studentPeerId}.videoLive`]: true,
            [`videoClassRooms.${activeRoomSlug}.peers.${studentPeerId}.audioLive`]: true,
            [`videoClassRooms.${activeRoomSlug}.peers.${studentPeerId}.lastSeen`]: Date.now()
          }).catch(() => {});
          attachStudentTrackWatchdog(activeRoomSlug);
        }
      } catch (e) {
        showToast('Allow Camera & Microphone');
      }
    }

    async function leaveStudentClass(silent = false) {
      if (studentWatchdogInterval) { clearInterval(studentWatchdogInterval); studentWatchdogInterval = null; }
      if (unsubStudentPeerDoc) { unsubStudentPeerDoc(); unsubStudentPeerDoc = null; }
      stopLiveClock();

      if (db && activeRoomSlug && studentPeerId) {
        updateMasterField({
          [`videoClassRooms.${activeRoomSlug}.peers.${studentPeerId}.left`]: true,
          [`videoClassRooms.${activeRoomSlug}.peers.${studentPeerId}.lastSeen`]: Date.now()
        }).catch(() => {});
      }
      if (studentPc) { try { studentPc.close(); } catch (e) {} studentPc = null; }
      if (localSelfAudioCtx) { localSelfAudioCtx.stop(); localSelfAudioCtx = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }

      const remoteVid = document.getElementById('studentRemoteTeacherVideo');
      if (remoteVid) remoteVid.srcObject = null;
      document.getElementById('studentTeacherVideoOverlay')?.classList.remove('hidden');
      document.getElementById('btnStudentUnblockAudio')?.classList.add('hidden');
      document.getElementById('studentAvWarningBanner')?.classList.add('hidden');

      currentRole = null;
      studentPeerId = '';
      document.getElementById('studentStageView').classList.add('hidden');
      document.getElementById('studentLobbyView').classList.remove('hidden');
      watchLobbyRoomStatus();
      if (!silent) showToast('Left class');
    }

    // =========================================================================
    // 8. SHARED CAMERA FLIP & AUDIO MODE SWAP
    // =========================================================================
    async function flipLocalCamera() {
      if (!localStream) return;
      const nextFacing = currentFacingMode === 'user' ? 'environment' : 'user';
      try {
        const camStream = await navigator.mediaDevices.getUserMedia({
          video: buildVideoConstraints(nextFacing, currentRole === 'teacher'),
          audio: false
        });
        const newVideoTrack = camStream.getVideoTracks()[0];
        if (!newVideoTrack) return;

        currentFacingMode = nextFacing;
        const oldVideoTrack = localStream.getVideoTracks()[0];
        if (oldVideoTrack) {
          localStream.removeTrack(oldVideoTrack);
          oldVideoTrack.stop();
        }
        localStream.addTrack(newVideoTrack);

        const pcs = currentRole === 'teacher'
          ? [...teacherPeers.values()].map(p => p.pc)
          : (studentPc ? [studentPc] : []);
        for (const pc of pcs) {
          const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) await sender.replaceTrack(newVideoTrack).catch(() => {});
        }

        const vidEl = document.getElementById(currentRole === 'teacher' ? 'teacherLocalVideo' : 'studentLocalSelfVideo');
        if (vidEl) {
          vidEl.srcObject = localStream;
          vidEl.classList.toggle('mirror-video', currentFacingMode === 'user');
        }
      } catch (e) {
        showToast('Second camera unavailable');
      }
    }

    async function swapLocalAudioTrack(audioMode) {
      if (!localStream) return;
      try {
        const audioOnly = await navigator.mediaDevices.getUserMedia({
          audio: buildMusicAudioConstraints(audioMode),
          video: false
        });
        const newAudioTrack = audioOnly.getAudioTracks()[0];
        if (!newAudioTrack) return;
        try { if ('contentHint' in newAudioTrack) newAudioTrack.contentHint = 'music'; } catch (e) {}

        const oldAudioTrack = localStream.getAudioTracks()[0];
        if (oldAudioTrack) {
          localStream.removeTrack(oldAudioTrack);
          oldAudioTrack.stop();
        }
        localStream.addTrack(newAudioTrack);

        const pcs = currentRole === 'teacher'
          ? [...teacherPeers.values()].map(p => p.pc)
          : (studentPc ? [studentPc] : []);
        for (const pc of pcs) {
          const sender = pc.getSenders().find(s => s.track && s.track.kind === 'audio');
          if (sender) await sender.replaceTrack(newAudioTrack).catch(() => {});
        }

        if (localSelfAudioCtx) localSelfAudioCtx.stop();
        localSelfAudioCtx = attachAudioMeter(localStream, currentRole === 'teacher' ? 'teacherSelfAudioBar' : 'studentSelfMicBar');
        if (currentRole === 'student' && activeRoomSlug) {
          attachStudentTrackWatchdog(activeRoomSlug);
        }
      } catch (e) {}
    }

    // =========================================================================
    // 9. INVITE QR / LINK MODAL
    // =========================================================================
    function getStudentInviteUrl() {
      const isAisPreview = /\.run\.app$/i.test(window.location.hostname || '');
      const base = isAisPreview
        ? 'https://tikariyas.github.io/tsm_gem/video-class.html'
        : `${window.location.origin}${window.location.pathname}`;
      return `${base}?role=student&room=${encodeURIComponent(activeRoomSlug || '')}`;
    }

    function openInviteTrialModal() {
      const inviteUrl = getStudentInviteUrl();
      const box = document.getElementById('trialModalBox');
      box.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-200 pb-2.5">
          <h3 class="text-sm font-extrabold text-[#0F172A]">${escapeHtml(activeRoomDisplayName || 'Video Class')}</h3>
          <button type="button" onclick="closeTrialModal()" class="text-xs font-bold text-slate-500 hover:text-slate-900">Close</button>
        </div>
        <div class="flex justify-center py-2">
          <div id="inviteQrContainer" class="p-3 bg-white border border-slate-200 rounded-xl"></div>
        </div>
        <div class="flex gap-1.5">
          <input id="inviteUrlReadonly" value="${escapeHtml(inviteUrl)}" readonly class="flex-1 h-9 px-2.5 bg-slate-50 border border-slate-300 rounded-lg text-[11px] font-mono text-slate-700" />
          <button type="button" onclick="copyInviteTrialUrl()" class="h-9 px-3 bg-[#0F172A] hover:bg-slate-800 text-white font-bold rounded-lg shrink-0">Copy</button>
        </div>
      `;
      document.getElementById('trialModalBackdrop').classList.remove('hidden');
      setTimeout(() => {
        const qrEl = document.getElementById('inviteQrContainer');
        if (qrEl && typeof QRCode !== 'undefined') {
          new QRCode(qrEl, { text: inviteUrl, width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M });
        }
      }, 30);
    }

    function copyInviteTrialUrl() {
      const url = getStudentInviteUrl();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => showToast('Link copied')).catch(() => {});
      } else {
        const inp = document.getElementById('inviteUrlReadonly');
        if (inp) { inp.select(); document.execCommand('copy'); showToast('Link copied'); }
      }
    }

    function closeTrialModal() {
      document.getElementById('trialModalBackdrop')?.classList.add('hidden');
    }

    // =========================================================================
    // 10. BOOT & CLEANUP
    // =========================================================================
    window.addEventListener('beforeunload', () => {
      if (currentRole === 'teacher' && db && activeRoomSlug) {
        updateMasterField({ [`videoClassRooms.${activeRoomSlug}`]: firebase.firestore.FieldValue.delete() }).catch(() => {});
      } else if (currentRole === 'student' && db && activeRoomSlug && studentPeerId) {
        updateMasterField({
          [`videoClassRooms.${activeRoomSlug}.peers.${studentPeerId}.left`]: true,
          [`videoClassRooms.${activeRoomSlug}.peers.${studentPeerId}.lastSeen`]: Date.now()
        }).catch(() => {});
      }
    });

    (async function bootVideoClass() {
      if (isStudentMode) {
        document.getElementById('teacherLobbyView')?.classList.add('hidden');
        document.getElementById('studentLobbyView')?.classList.remove('hidden');
      } else {
        document.getElementById('teacherLobbyView')?.classList.remove('hidden');
        document.getElementById('studentLobbyView')?.classList.add('hidden');
      }
      loadLocalAcademyRoster();
      await initFirebase();
      watchLobbyRoomStatus();
    })();
  </script>
</body>
