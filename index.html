// ==========================================
// 0. CORE SECURITY, DATE & DOWNLOAD UTILITIES
// ==========================================
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeDataUrl(url, prefix) {
  const s = String(url || '').trim();
  if (!s || !s.startsWith(prefix)) return '';
  return s.replace(/["'<>\\()]/g, '');
}

function formatLocalDate(d = new Date()) {
  const yr = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const dy = String(d.getDate()).padStart(2, '0');
  return `${yr}-${mo}-${dy}`;
}

function parseLocalDate(dateStr) {
  const parts = String(dateStr || '').split('-').map(Number);
  if (parts.length === 3 && !parts.some(isNaN)) {
    return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
  }
  const d = new Date(dateStr);
  return isNaN(d.getTime()) ? new Date() : new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
}

function sanitizePdfText(str) {
  return String(str ?? '')
    .replace(/₹/g, 'INR ')
    .replace(/[—–]/g, '-')
    .replace(/[‘’]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/•/g, '|')
    .replace(/[^\x20-\x7E\xA0-\xFF]/g, '');
}

function dataUrlToUint8Array(dataUrl) {
  const str = String(dataUrl || '').trim();
  const commaIdx = str.indexOf(',');
  const b64 = (commaIdx !== -1 ? str.slice(commaIdx + 1) : str).replace(/\s+/g, '');
  const binStr = atob(b64);
  const len = binStr.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binStr.charCodeAt(i);
  return bytes;
}

function getMimeFromDataUrl(dataUrl, fallback = 'application/pdf') {
  const m = String(dataUrl || '').match(/^data:([^;,]+)/i);
  return m ? m[1] : fallback;
}

function isStudentFeesDay(dateStr, student) {
  if (!student || !dateStr) return false;
  if (student.lastPaymentDate && student.lastPaymentDate !== '-' && dateStr === student.lastPaymentDate) {
    return true;
  }
  const admStr = student.admissionDate || '';
  if (!admStr || dateStr <= admStr) return false;
  const admParts = String(admStr).split('-').map(Number);
  const dtParts = String(dateStr).split('-').map(Number);
  if (admParts.length !== 3 || dtParts.length !== 3 || admParts.some(isNaN) || dtParts.some(isNaN)) return false;
  const daysInThisMonth = new Date(dtParts[0], dtParts[1], 0).getDate();
  const expectedDueDay = Math.min(admParts[2], daysInThisMonth);
  return dtParts[2] === expectedDueDay;
}

function getAttendanceLegendHtml() {
  return `
    <div class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1.5 text-[11px] font-semibold bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
      <span class="inline-flex items-center gap-1"><span class="font-black text-emerald-600 text-sm">P</span><span class="text-slate-600">Present</span></span>
      <span class="inline-flex items-center gap-1"><span class="font-black text-purple-600 text-sm">H</span><span class="text-slate-600">Holiday</span></span>
      <span class="inline-flex items-center gap-1"><span class="font-black text-red-600 text-sm">A</span><span class="text-slate-600">Absent</span></span>
      <span class="inline-flex items-center gap-1"><span class="font-black text-indigo-600 text-sm">AD</span><span class="text-slate-600">Admission</span></span>
      <span class="inline-flex items-center gap-1"><span class="font-black text-amber-600 text-sm">TL</span><span class="text-slate-600">Teacher's Leave</span></span>
      <span class="inline-flex items-center gap-1"><span class="font-black text-teal-700 text-sm">F</span><span class="text-slate-600">Fees Day</span></span>
    </div>
  `;
}

function buildStudentDayCellContent(status, isBeforeAdmission, isHoliday, isAdmissionDay, isFeesDay) {
  if (isBeforeAdmission) {
    return {
      bgCls: 'bg-slate-50 border-slate-100 opacity-45',
      mainHtml: '<span class="text-[9px] text-slate-300">&mdash;</span>',
      tagHtml: ''
    };
  }

  let primaryCode = '';
  let primaryTextCls = '';
  let bgCls = 'bg-white border-slate-200';

  if (isHoliday) {
    primaryCode = 'H';
    primaryTextCls = 'text-purple-600';
    bgCls = 'bg-purple-50/80 border-purple-200';
  } else if (status === 'present') {
    primaryCode = 'P';
    primaryTextCls = 'text-emerald-600';
    bgCls = 'bg-emerald-50/80 border-emerald-200';
  } else if (status === 'absent') {
    primaryCode = 'A';
    primaryTextCls = 'text-red-600';
    bgCls = 'bg-red-50/80 border-red-200';
  } else if (status === 'teacher_leave') {
    primaryCode = 'TL';
    primaryTextCls = 'text-amber-600';
    bgCls = 'bg-amber-50/80 border-amber-200';
  } else if (status === 'bonus_used') {
    primaryCode = 'B';
    primaryTextCls = 'text-sky-600';
    bgCls = 'bg-sky-50/80 border-sky-200';
  } else if (status === 'excused_leave') {
    primaryCode = 'E';
    primaryTextCls = 'text-slate-600';
    bgCls = 'bg-slate-100 border-slate-300';
  }

  let tagHtml = '';
  if (!primaryCode) {
    if (isAdmissionDay) {
      primaryCode = 'AD';
      primaryTextCls = 'text-indigo-600';
      bgCls = 'bg-indigo-50/90 border-indigo-300';
    } else if (isFeesDay) {
      primaryCode = 'F';
      primaryTextCls = 'text-teal-700';
      bgCls = 'bg-teal-50/90 border-teal-300';
    }
  } else {
    const tags = [];
    if (isAdmissionDay) tags.push('<span class="text-[9px] sm:text-[10px] font-black text-indigo-700 leading-none">AD</span>');
    if (isFeesDay) tags.push('<span class="text-[9px] sm:text-[10px] font-black text-teal-700 leading-none">F</span>');
    tagHtml = tags.join(' ');
    if (isAdmissionDay) bgCls += ' ring-1 ring-indigo-500';
    else if (isFeesDay) bgCls += ' ring-1 ring-teal-500';
  }

  const mainHtml = primaryCode
    ? `<span class="text-lg sm:text-2xl font-black leading-none tracking-tight ${primaryTextCls}">${primaryCode}</span>`
    : '<span class="text-[10px] text-slate-300">&middot;</span>';

  return { bgCls, mainHtml, tagHtml };
}

function triggerBlobDownload(blob, fileName) {
  const blobUrl = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = blobUrl;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
}

function formatWhatsAppPhone(raw) {
  const digits = String(raw || '').replace(/\D+/g, '');
  if (!digits) return '';
  if (digits.length === 10) return '91' + digits;
  if (digits.length === 11 && digits.startsWith('0')) return '91' + digits.slice(1);
  return digits;
}

function compressImageDataUrl(dataUrl, maxWidth, maxHeight, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      const ratio = Math.min(maxWidth / Math.max(1, width), maxHeight / Math.max(1, height), 1);
      width = Math.max(1, Math.round(width * ratio));
      height = Math.max(1, Math.round(height * ratio));
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      try {
        resolve(c.toDataURL('image/jpeg', quality));
      } catch (e) {
        resolve(dataUrl);
      }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// ==========================================
// STUDENT MONTHLY CALENDAR MODAL & EDITORS
// ==========================================
function openStudentMonthlyCalendarModal(stuId, monthParam) {
  const s = appState.students.find(x => x.id === stuId);
  if (!s) return;
  const targetMonth = monthParam || calendarMonth || selectedDate.slice(0, 7);
  const [yr, mo] = targetMonth.split('-').map(Number);
  const firstDay = new Date(yr, mo - 1, 1);
  const daysInMonth = new Date(yr, mo, 0).getDate();
  const startWeekday = firstDay.getDay();
  const monthLabel = firstDay.toLocaleString('default', { month: 'long', year: 'numeric' });
  const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const admDateStr = s.admissionDate || '2000-01-01';
  const safeId = escapeHtml(s.id);

  let cells = '';
  for (let i = 0; i < startWeekday; i++) {
    cells += `<div class="h-16 sm:h-20 bg-slate-50/70 border border-slate-100 rounded-lg"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dt = `${yr}-${String(mo).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isBeforeAdmission = dt < admDateStr;
    const isAdmissionDay = dt === admDateStr;
    const isFeesDay = isStudentFeesDay(dt, s);
    const isHoliday = isDateHoliday(dt);
    const isSunday = new Date(yr, mo - 1, day).getDay() === 0;
    const rec = getAttendanceRecord(dt, s.id);
    const status = isBeforeAdmission ? 'pre' : (isHoliday ? 'holiday' : rec.status);

    const cell = buildStudentDayCellContent(status, isBeforeAdmission, isHoliday, isAdmissionDay, isFeesDay);

    cells += `
      <div onclick="${isBeforeAdmission ? '' : `openDayStatusSelector('${safeId}', '${dt}')`}"
           class="h-16 sm:h-20 p-1 sm:p-1.5 border rounded-lg flex flex-col justify-between ${cell.bgCls} ${isBeforeAdmission ? '' : 'cursor-pointer hover:shadow-sm transition'}">
        <div class="flex justify-between items-start gap-0.5">
          <span class="text-[10px] sm:text-xs font-bold leading-none tabular-nums ${isSunday ? 'text-red-600' : 'text-slate-700'}">${day}</span>
          <div class="flex items-center gap-0.5">${cell.tagHtml}</div>
        </div>
        <div class="flex-1 flex items-center justify-center">${cell.mainHtml}</div>
      </div>
    `;
  }

  const prevDate = new Date(yr, mo - 2, 1);
  const nextDate = new Date(yr, mo, 1);
  const prevMonthStr = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;
  const nextMonthStr = `${nextDate.getFullYear()}-${String(nextDate.getMonth() + 1).padStart(2, '0')}`;

  showModal(`
    <div class="space-y-3.5">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <div>
          <h3 class="text-base font-bold text-[#0F172A]">${escapeHtml(s.name)} (${escapeHtml(s.rollNo)})</h3>
          <p class="text-xs text-indigo-700 font-semibold">${escapeHtml(s.grade)} &bull; ${escapeHtml(s.course)} &bull; Genuine: ${Number(s.genuineDays || 0)} Days</p>
        </div>
        <button onclick="closeModal()" class="px-2.5 py-1.5 text-xs font-semibold text-slate-600 border border-slate-200 rounded-lg hover:bg-slate-50">Close</button>
      </div>

      <div class="flex items-center justify-between">
        <button type="button" onclick="openStudentMonthlyCalendarModal('${safeId}', '${prevMonthStr}')" class="px-3 py-1.5 text-xs font-semibold border border-slate-300 rounded-lg hover:bg-slate-50">&larr; Prev</button>
        <h4 class="text-sm font-bold text-[#0F172A] uppercase">${escapeHtml(monthLabel)}</h4>
        <button type="button" onclick="openStudentMonthlyCalendarModal('${safeId}', '${nextMonthStr}')" class="px-3 py-1.5 text-xs font-semibold border border-slate-300 rounded-lg hover:bg-slate-50">Next &rarr;</button>
      </div>

      ${getAttendanceLegendHtml()}

      <div class="grid grid-cols-7 gap-1 text-center text-[10px] sm:text-[11px] font-bold text-slate-500 uppercase">
        ${weekdays.map(w => `<div>${w}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1 sm:gap-1.5">
        ${cells}
      </div>
      <p class="text-[11px] text-slate-500 text-center">Tap any date cell to update attendance status (P, A, TL, B, E)</p>
    </div>
  `);
}

function openDayStatusSelector(stuId, dateStr) {
  const s = appState.students.find(x => x.id === stuId);
  if (!s) return;
  const safeId = escapeHtml(stuId);
  const safeDt = escapeHtml(dateStr);
  showModal(`
    <div class="space-y-4 max-w-sm mx-auto">
      <div class="flex items-center justify-between border-b border-slate-200 pb-2">
        <h3 class="text-sm font-bold text-[#0F172A]">Edit Status: ${safeDt}</h3>
        <button onclick="openStudentMonthlyCalendarModal('${safeId}', '${safeDt.slice(0, 7)}')" class="text-xs text-indigo-700 font-semibold">&larr; Back</button>
      </div>
      <p class="text-xs font-semibold text-slate-700">${escapeHtml(s.name)} (${escapeHtml(s.rollNo)})</p>
      <div class="space-y-2">
        <button onclick="setSpecificDayStatus('${safeId}', '${safeDt}', 'present')" class="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-lg">Present (P)</button>
        <button onclick="setSpecificDayStatus('${safeId}', '${safeDt}', 'absent')" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg">Absent (A)</button>
        <button onclick="setSpecificDayStatus('${safeId}', '${safeDt}', 'teacher_leave')" class="w-full py-2.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-lg">Teacher Leave (L)</button>
        <button onclick="setSpecificDayStatus('${safeId}', '${safeDt}', 'bonus_used')" class="w-full py-2.5 bg-indigo-700 hover:bg-indigo-800 text-white text-xs font-bold rounded-lg">Bonus Used (B)</button>
        <button onclick="setSpecificDayStatus('${safeId}', '${safeDt}', 'excused_leave')" class="w-full py-2.5 bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold rounded-lg">Excused Leave</button>
        <button onclick="setSpecificDayStatus('${safeId}', '${safeDt}', 'unmarked')" class="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold rounded-lg">Clear / Unmark</button>
      </div>
    </div>
  `);
}

function setSpecificDayStatus(stuId, dateStr, status) {
  const key = `${dateStr}_${stuId}`;
  const prev = appState.attendance[key] || { time: '06:30 PM', note: '' };
  if (status === 'unmarked') {
    delete appState.attendance[key];
  } else {
    appState.attendance[key] = {
      ...prev,
      status,
      time: prev.time || '06:30 PM'
    };
  }
  const stu = appState.students.find(x => x.id === stuId);
  if (stu) recalculateStudentAttendanceStats(stu, true);
  saveState();
  renderCurrentTab();
  openStudentMonthlyCalendarModal(stuId, dateStr.slice(0, 7));
  showToast(`Updated attendance for ${dateStr}`);
}

function generateAppIconPng(size) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const r = Math.round(size * 0.22);
  ctx.fillStyle = '#0F172A';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, r);
  ctx.fill();

  ctx.strokeStyle = '#334155';
  ctx.lineWidth = Math.max(2, size * 0.02);
  ctx.beginPath();
  ctx.roundRect(size * 0.04, size * 0.04, size * 0.92, size * 0.92, r * 0.85);
  ctx.stroke();

  const fontSize = Math.round(size * 0.34);
  ctx.font = `900 ${fontSize}px Arial, sans-serif`;
  ctx.textBaseline = 'middle';
  const y = size * 0.52;
  const wTS = ctx.measureText('TS').width;
  const wM = ctx.measureText('M').width;
  const startX = (size - (wTS + wM)) / 2;

  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('TS', startX, y);
  ctx.fillStyle = '#EF4444';
  ctx.fillText('M', startX + wTS, y);

  return c.toDataURL('image/png');
}

async function enableFcmPushForCurrentUser(silent = false) {
  if (!('Notification' in window)) {
    if (!silent) showToast('Notifications not supported in this browser');
    return;
  }
  const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  if (perm !== 'granted') {
    if (!silent) showToast('Notification permission blocked in browser settings');
    return;
  }
  try {
    if (!swRegistration && 'serviceWorker' in navigator) {
      swRegistration = await navigator.serviceWorker.register('./firebase-messaging-sw.js').catch(() => null);
    }
    if (fcmMessaging && swRegistration) {
      const token = await fcmMessaging.getToken({
        vapidKey: FCM_VAPID_KEY,
        serviceWorkerRegistration: swRegistration
      });
      if (token) {

        localStorage.setItem('tsm_fcm_token', token);

        if (!silent) showToast('Background Push Notifications Enabled');

// ==========================================
// 3. GENUINE DAYS & BONUS AUTO-CONVERSION CALCULATOR
// ==========================================
function recalculateStudentAttendanceStats(student, resetIfEmpty = true) {
  const admDate = student.admissionDate || '2000-01-01';
  const entries = [];
  Object.entries(appState.attendance || {}).forEach(([key, rec]) => {
    const idx = key.indexOf('_');
    if (idx === -1) return;
    const dt = key.slice(0, idx);
    const sid = key.slice(idx + 1);
    if (sid === student.id && dt >= admDate) {
      entries.push({ dt, status: rec.status });
    }
  });

  if (!entries.length) {
    if (resetIfEmpty) {
      student.genuineDays = 0;
      student.bonusCredits = 0;
      student.grade = GRADES[0];
    }
    return;
  }
  entries.sort((a, b) => a.dt.localeCompare(b.dt));

  const admTime = parseLocalDate(admDate).getTime();
  const weekBuckets = new Map();
  entries.forEach(item => {
    const dayDiff = Math.max(0, Math.round((parseLocalDate(item.dt).getTime() - admTime) / 86400000));
    const weekIdx = Math.floor(dayDiff / 7);
    if (!weekBuckets.has(weekIdx)) weekBuckets.set(weekIdx, []);
    weekBuckets.get(weekIdx).push(item);
  });

  let totalGenuine = 0;
  let bankedBonus = 0;
  let teacherLeaveMakeupDebt = 0;

  const sortedWeeks = [...weekBuckets.keys()].sort((a, b) => a - b);
  sortedWeeks.forEach(wIdx => {
    const items = weekBuckets.get(wIdx);
    const presentCount = items.filter(x => x.status === 'present').length;
    const bonusUsedCount = items.filter(x => x.status === 'bonus_used').length;
    const teacherLeaveCount = items.filter(x => x.status === 'teacher_leave').length;
    const excusedLeaveCount = items.filter(x => x.status === 'excused_leave').length;

    teacherLeaveMakeupDebt += teacherLeaveCount;

    let weekGenuine = 0;
    let weekNewBonus = 0;

    for (let i = 0; i < presentCount; i++) {
      if (weekGenuine < 3) {
        weekGenuine++;
      } else if (teacherLeaveMakeupDebt > 0) {
        weekGenuine++;
        teacherLeaveMakeupDebt--;
      } else {
        weekNewBonus++;
      }
    }

    bankedBonus += weekNewBonus;

    const explicitConvert = Math.min(bankedBonus, bonusUsedCount);
    weekGenuine += explicitConvert;
    bankedBonus -= explicitConvert;

    const plannedLeaves = teacherLeaveCount + excusedLeaveCount;
    if (plannedLeaves > 0 && weekGenuine < 3 && bankedBonus > 0) {
      const needed = Math.min(3 - weekGenuine, plannedLeaves, bankedBonus);
      weekGenuine += needed;
      bankedBonus -= needed;
      if (teacherLeaveCount > 0) {
        teacherLeaveMakeupDebt = Math.max(0, teacherLeaveMakeupDebt - needed);
      }
    }

    totalGenuine += weekGenuine;
  });

  student.genuineDays = totalGenuine;
  student.bonusCredits = bankedBonus;
  const gradeIdx = Math.min(GRADES.length - 1, Math.floor(totalGenuine / 48));
  student.grade = GRADES[gradeIdx];
}

// UNIFIED INDEXEDDB + FIRESTORE BLOB ENGINE (FOR LARGE PDFs & BROCHURES)
// ==========================================
function openTsmBlobDb() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject('No IndexedDB');
    const req = indexedDB.open('TSM_BlobDB_v1', 1);
    req.onupgradeneeded = (e) => {
      const idb = e.target.result;
      if (!idb.objectStoreNames.contains('blobs')) {
        idb.createObjectStore('blobs');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

let firestoreReadyPromise = null;

async function ensureFirestoreReady() {
  if (db) return db;
  if (firestoreReadyPromise) {
    await firestoreReadyPromise;
    return db;
  }
  firestoreReadyPromise = (async () => {
    try {
      let cfg = DEFAULT_FIREBASE_CONFIG;
      const cfgRaw = localStorage.getItem(CONFIG_KEY);
      if (cfgRaw) {
        const parsed = JSON.parse(cfgRaw);
        if (parsed && parsed.apiKey && parsed.projectId) cfg = parsed;
      }
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      if (firebase.auth && !firebase.auth().currentUser) {
        try { await firebase.auth().signInAnonymously(); } catch (e) {}
      }
      db = firebase.firestore();
    } catch (e) {
      console.warn('Firestore init warning:', e);
    }
  })();
  await firestoreReadyPromise;
  firestoreReadyPromise = null;
  return db;
}

async function tsmSaveBlob(key, dataUrl, meta = {}) {
  if (!dataUrl) return { localOk: false, cloudOk: false };
  let localOk = false;
  let cloudOk = false;

  // 1. Save to IndexedDB (unlimited local capacity)
  try {
    const idb = await openTsmBlobDb();
    await new Promise((res, rej) => {
      const tx = idb.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').put(dataUrl, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
    localOk = true;
  } catch (e) { console.warn('IDB save warning:', e); }

  // 2. Save to Firestore `tsm_blobs` (chunked at 500KB so any PDF size syncs across all devices)
  const fsDb = await ensureFirestoreReady();
  if (fsDb) {
    try {
      const CHUNK_SIZE = 500000;
      const totalChunks = Math.ceil(dataUrl.length / CHUNK_SIZE);
      await fsDb.collection('tsm_blobs').doc(key).set({
        key,
        totalChunks,
        fileName: meta.fileName || '',
        mimeType: meta.mimeType || getMimeFromDataUrl(dataUrl, 'application/pdf'),
        data: dataUrl.slice(0, CHUNK_SIZE),
        updatedAt: Date.now()
      });
      for (let i = 1; i < totalChunks; i++) {
        await fsDb.collection('tsm_blobs').doc(`${key}_part_${i}`).set({
          key,
          part: i,
          data: dataUrl.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE)
        });
      }
      cloudOk = true;
    } catch (e) { console.warn('Cloud blob sync warning:', e); }
  }
  return { localOk, cloudOk };
}

async function tsmLoadBlobWithMeta(key, options = {}) {
  const preferCloud = Boolean(options.preferCloud);
  let localVal = '';

  // 1. Try IndexedDB first (unless cloud is explicitly requested)
  if (!preferCloud) {
    try {
      const idb = await openTsmBlobDb();
      localVal = await new Promise((res, rej) => {
        const tx = idb.transaction('blobs', 'readonly');
        const req = tx.objectStore('blobs').get(key);
        req.onsuccess = () => res(req.result || '');
        req.onerror = () => rej(req.error);
      });
      if (localVal) return { dataUrl: localVal, fileName: '' };
    } catch (e) {}
  }

  // 2. Fallback to Firestore `tsm_blobs`
  const fsDb = await ensureFirestoreReady();
  if (fsDb) {
    try {
      const snap = await fsDb.collection('tsm_blobs').doc(key).get();
      if (snap.exists) {
        const meta = snap.data() || {};
        let fullData = meta.data || '';
        const totalChunks = Number(meta.totalChunks || 1);
        let allChunksLoaded = Boolean(fullData);
        for (let i = 1; i < totalChunks; i++) {
          const partSnap = await fsDb.collection('tsm_blobs').doc(`${key}_part_${i}`).get();
          if (partSnap.exists && partSnap.data().data) {
            fullData += partSnap.data().data;
          } else {
            allChunksLoaded = false;
            break;
          }
        }
        if (allChunksLoaded && fullData) {
          // Cache in IndexedDB for instant subsequent loads
          try {
            const idb = await openTsmBlobDb();
            const tx = idb.transaction('blobs', 'readwrite');
            tx.objectStore('blobs').put(fullData, key);
          } catch (e) {}
          return { dataUrl: fullData, fileName: meta.fileName || '' };
        }
      }
    } catch (e) { console.warn('Cloud blob read warning:', e); }
  }

  if (preferCloud) {
    try {
      const idb = await openTsmBlobDb();
      localVal = await new Promise((res, rej) => {
        const tx = idb.transaction('blobs', 'readonly');
        const req = tx.objectStore('blobs').get(key);
        req.onsuccess = () => res(req.result || '');
        req.onerror = () => rej(req.error);
      });
      if (localVal) return { dataUrl: localVal, fileName: '' };
    } catch (e) {}
  }

  return { dataUrl: '', fileName: '' };
}

async function tsmLoadBlob(key) {
  const res = await tsmLoadBlobWithMeta(key);
  return res.dataUrl || '';
}

async function tsmDeleteBlob(key) {
  if (!key) return;
  try {
    const idb = await openTsmBlobDb();
    await new Promise((res) => {
      const tx = idb.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').delete(key);
      tx.oncomplete = () => res();
      tx.onerror = () => res();
    });
  } catch (e) {}
  const fsDb = await ensureFirestoreReady();
  if (fsDb) {
    try {
      const docRef = fsDb.collection('tsm_blobs').doc(key);
      const snap = await docRef.get();
      const totalChunks = snap.exists ? Number(snap.data().totalChunks || 1) : 1;
      await docRef.delete().catch(() => {});
      for (let i = 1; i < totalChunks; i++) {
        await fsDb.collection('tsm_blobs').doc(`${key}_part_${i}`).delete().catch(() => {});
      }
    } catch (e) {}
  }
}

async function triggerSafeDownloadFromDataUrl(dataUrl, fileName) {
  try {
    const bytes = dataUrlToUint8Array(dataUrl);
    const mime = getMimeFromDataUrl(dataUrl, 'application/pdf');
    const blob = new Blob([bytes], { type: mime });
    triggerBlobDownload(blob, fileName);
  } catch (e) {
    try {
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      triggerBlobDownload(blob, fileName);
    } catch (err) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  }
}

function buildSlimState(stateObj) {
  return {
    ...stateObj,
    customBrochureDataUrl: (stateObj.customBrochureDataUrl && stateObj.customBrochureDataUrl.length < 150000) ? stateObj.customBrochureDataUrl : '',
    vaultItems: (stateObj.vaultItems || []).map(v => ({
      ...v,
      pdfDataUrl: (v.pdfDataUrl && v.pdfDataUrl.length < 150000) ? v.pdfDataUrl : ''
    }))
  };
}

function saveState() {
  purgeExpiredAudioData(appState);
  // Create a lightweight state copy for localStorage & Firestore master_state (large PDFs live in IndexedDB + tsm_blobs)
  const slimState = buildSlimState(appState);
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(slimState));
  } catch (e) {
    console.warn('localStorage slim write note:', e);
  }
  if (db) {
    db.collection('tsm_system').doc('master_state').set({
      ...slimState,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(err => console.warn('Cloud sync error:', err));
  }
}

function dispatchPushAlert(targetRoll, title, body) {
  const alertObj = {
    id: 'push_' + Date.now(),
    targetRoll: targetRoll || 'ALL',
    title,
    body,
    ts: Date.now()
  };
  if (!Array.isArray(appState.pushAlerts)) appState.pushAlerts = [];
  appState.pushAlerts = [alertObj, ...appState.pushAlerts.slice(0, 19)];
  saveState();

  const tokensMap = appState.fcmTokens || {};
  let targetTokens = [];

  if (targetRoll === 'ALL') {
    Object.values(tokensMap).forEach(arr => { if (Array.isArray(arr)) targetTokens.push(...arr); });
  } else if (String(targetRoll).startsWith('BATCH:')) {
    const bName = targetRoll.slice(6);
    appState.students.filter(s => s.batch === bName).forEach(s => {
      if (Array.isArray(tokensMap[s.rollNo])) targetTokens.push(...tokensMap[s.rollNo]);
    });
  } else if (String(targetRoll).startsWith('COURSE:')) {
    const cName = targetRoll.slice(7).toLowerCase();
    appState.students.filter(s => (s.courses || [s.course]).some(c => String(c).toLowerCase() === cName)).forEach(s => {
      if (Array.isArray(tokensMap[s.rollNo])) targetTokens.push(...tokensMap[s.rollNo]);
    });
  } else if (Array.isArray(tokensMap[targetRoll])) {
    targetTokens = [...tokensMap[targetRoll]];
  }
  targetTokens = [...new Set(targetTokens)];

  if (appState.pushRelayUrl && targetTokens.length > 0) {
    fetch(appState.pushRelayUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tokens: targetTokens, title, body, url: '/tsm-gem/' })
    }).catch(() => {});
  }
}

function checkIncomingPushAlerts() {
  if (!currentUser || !Array.isArray(appState.pushAlerts) || !appState.pushAlerts.length) return;
  const latest = appState.pushAlerts[0];
  if (!latest || latest.id === lastSeenPushId) return;

  const stuObj = currentUser.role === 'admin' ? null : appState.students.find(x => x.id === currentUser.studentId);
  const myRoll = currentUser.role === 'admin' ? 'ADMIN' : (stuObj?.rollNo || '');

  let isMatch = false;
  if (latest.targetRoll === 'ALL' || latest.targetRoll === myRoll) {
    isMatch = true;
  } else if (stuObj && String(latest.targetRoll).startsWith('BATCH:')) {
    isMatch = stuObj.batch === latest.targetRoll.slice(6);
  } else if (stuObj && String(latest.targetRoll).startsWith('COURSE:')) {
    const cTarget = latest.targetRoll.slice(7).toLowerCase();
    isMatch = (stuObj.courses || [stuObj.course]).some(c => String(c).toLowerCase() === cTarget);
  }

  if (isMatch) {
    lastSeenPushId = latest.id;
    localStorage.setItem('tsm_last_push_id', latest.id);
    if (Notification.permission === 'granted') {
      if (swRegistration && swRegistration.showNotification) {
        swRegistration.showNotification(latest.title, { body: latest.body, icon: generateAppIconPng(192), tag: 'tsm-alert' });
      } else {
        new Notification(latest.title, { body: latest.body, icon: generateAppIconPng(192) });
      }
    }
  }
}

async function initFirebaseAuto(forceReinit = false) {
  try {
    let cfg = DEFAULT_FIREBASE_CONFIG;
    const cfgRaw = localStorage.getItem(CONFIG_KEY);
    if (cfgRaw) {
      const parsed = JSON.parse(cfgRaw);
      if (parsed && parsed.apiKey && parsed.projectId) cfg = parsed;
    } else {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(DEFAULT_FIREBASE_CONFIG));
    }

    if (masterStateUnsubscribe) {
      try { masterStateUnsubscribe(); } catch (e) {}
      masterStateUnsubscribe = null;
    }

    if (forceReinit && firebase.apps.length) {
      try { await firebase.app().delete(); } catch (e) {}
      db = null;
    }
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    if (firebase.auth && !firebase.auth().currentUser) {
      try { await firebase.auth().signInAnonymously(); } catch (e) {}
    }

    db = firebase.firestore();
    initBackgroundFcmServiceWorker().catch(() => {});
    masterStateUnsubscribe = db.collection('tsm_system').doc('master_state').onSnapshot(doc => {
      cloudSyncStatus = 'Cloud Synced (tikariya-music---foundation)';
      if (doc.exists) {
        const remote = doc.data();
        if (remote && Array.isArray(remote.students)) {
          if (!remote.adminRollNo) remote.adminRollNo = 'MUSICSNSOUNDS';
          if (!remote.courses || !remote.courses.length) remote.courses = DEFAULT_COURSES;
          if (!remote.batches || !remote.batches.length) remote.batches = DEFAULT_BATCHES;
          if (!remote.audioClips) remote.audioClips = [];
          if (!remote.holidays) remote.holidays = {};
          if (!remote.certs) remote.certs = [];
          if (!remote.pushAlerts) remote.pushAlerts = [];
          if (!remote.fcmTokens) remote.fcmTokens = {};
          if (!remote.messages) remote.messages = [];
          if (!remote.campaigns) remote.campaigns = [];
          if (!remote.vaultItems) remote.vaultItems = [];
          if (!remote.attendance) remote.attendance = {};
          remote.students = purgeTestStudent(remote.students.map(normalizeStudent));

          const didPurge = purgeExpiredAudioData(remote);
          appState = remote;
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(buildSlimState(appState)));
          } catch (e) {
            console.warn('localStorage cache write skipped:', e);
          }
          if (didPurge) saveState();
          checkIncomingPushAlerts();
          if (currentUser) {
            if (currentDeviceFcmToken) saveDeviceTokenToState(currentDeviceFcmToken);
            renderCurrentTab();
          }
          checkPublicQrVerify();
        }
      } else {
        saveState();
      }
    }, () => {
      cloudSyncStatus = 'Local Cache (Check Firestore Rules)';
    });
  } catch (e) {
    cloudSyncStatus = 'Local Cache Mode';
  }
}

}

function exportBackupJson() {
  const todayStr = formatLocalDate(new Date());
  const nosMap = {};
  const attMap = {};
  const payMap = {};

  appState.students.forEach((s, idx) => {
    nosMap[s.id] = s.rollNo || `TSM-${String(idx + 1).padStart(4, '0')}`;
    if (s.feeStatus === 'Paid') {
      const admMonth = String(s.admissionDate || todayStr).slice(0, 7);
      payMap[s.id] = { [admMonth]: { d: s.lastPaymentDate || todayStr, m: s.lastPaymentMode || 'UPI' } };
    }
  });

  Object.entries(appState.attendance || {}).forEach(([key, rec]) => {
    const idx = key.indexOf('_');
    if (idx === -1) return;
    const dt = key.slice(0, idx);
    const sid = key.slice(idx + 1);
    if (!attMap[dt]) attMap[dt] = {};
    attMap[dt][sid] = rec.status === 'present' ? 'P' : rec.status === 'absent' ? 'A' : rec.status === 'teacher_leave' ? 'L' : rec.status;
  });

  const feeCfg = {};
  appState.courses.forEach(c => { feeCfg[c.name] = c.fee; });

  const backupPayload = {
    app: "tsm-attendance",
    saved: todayStr,
    schemaVersion: 3,
    data: {
      students: appState.students.map(s => ({
        id: s.id,
        gid: s.id,
        name: s.name,
        course: s.courses && s.courses.length > 1 ? s.courses.join('/') : (s.courses?.[0] || s.course),
        batch: s.batch,
        adm: s.admissionDate,
        fee: s.monthlyFee,
        dob: s.dob || '',
        phone: s.phone || '',
        parent: s.guardian || '',
        pphone: s.parentPhone || s.phone || '',
        email: s.email || '',
        addr: s.addr || '',
        notes: s.pickupNote || '',
        photo: s.photoDataUrl || '',
        pin: s.pin || '1234',
        genuineDays: s.genuineDays || 0,
        bonusCredits: s.bonusCredits || 0,
        concession: s.concession || 0,
        concessionMonths: s.concessionMonths || 0,
        idCardFee: s.idCardFee || 0,
        certFee: s.certFee || 0,
        feeStatus: s.feeStatus || 'Unpaid'
      })),
      att: attMap,
      pay: payMap,
      hol: appState.holidays || {},
      cfg: {
        batches: appState.batches,
        fee: feeCfg
      },
      nos: nosMap,
      certs: appState.certs || [],
      audioClips: appState.audioClips || [],
      messages: appState.messages || [],
      campaigns: appState.campaigns || [],
      vaultItems: appState.vaultItems || [],
      adminRollNo: appState.adminRollNo,
      adminPin: appState.adminPin
    }
  };

  const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json' });
  triggerBlobDownload(blob, `Tikariya_Backup_${todayStr}.json`);
  showToast(`Exported Tikariya_Backup_${todayStr}.json`);
}

function handleRestoreBackupFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const raw = JSON.parse(ev.target.result);
      const d = raw.data ? raw.data : raw;
      if (!d || !Array.isArray(d.students)) {
        showToast('Invalid backup JSON format');
        return;
      }

      const nosMap = d.nos || {};
      const attMap = d.att || {};
      const payMap = d.pay || {};
      const cfg = d.cfg || {};

      const restoredAttendance = {};
      Object.entries(attMap).forEach(([dateStr, dayObj]) => {
        if (!dayObj || typeof dayObj !== 'object') return;
        Object.entries(dayObj).forEach(([sid, code]) => {
          let mappedStatus = 'present';
          if (code === 'P' || code === 'present') mappedStatus = 'present';
          else if (code === 'A' || code === 'absent') mappedStatus = 'absent';
          else if (code === 'L' || code === 'teacher_leave') mappedStatus = 'teacher_leave';
          else if (code === 'bonus_used' || code === 'excused_leave') mappedStatus = code;
          restoredAttendance[`${dateStr}_${sid}`] = {
            status: mappedStatus,
            time: '',
            note: ''
          };
        });
      });

      if (cfg.fee && typeof cfg.fee === 'object') {
        Object.entries(cfg.fee).forEach(([cName, cFee]) => {
          const exists = appState.courses.find(x => x.name.toLowerCase() === cName.toLowerCase());
          if (exists) exists.fee = Number(cFee);
          else appState.courses.push({ id: 'crs_' + Date.now() + Math.random().toString(36).slice(2, 5), name: cName, category: 'Instrument', fee: Number(cFee), discount: 0, feature: '' });
        });
      }

      if (Array.isArray(cfg.batches) && cfg.batches.length) {
        appState.batches = cfg.batches;
      }

      appState.attendance = restoredAttendance;

      const restoredStudents = d.students.map((st, idx) => {
        const sid = st.id || ('stu_' + Date.now() + '_' + idx);
        const courseArr = Array.isArray(st.courses) && st.courses.length
          ? st.courses.map(x => String(x).trim()).filter(Boolean)
          : String(st.course || 'Piano').split(/[,/]/).map(x => x.trim()).filter(Boolean);
        let baseFee = Number(st.base || st.fee || 1000);
        let concAmt = 0;
        if (st.disc && typeof st.disc === 'object') {
          if (st.disc.t === '%') concAmt = Math.round(baseFee * (Number(st.disc.v || 0) / 100));
          else concAmt = Number(st.disc.v || 0);
        } else if (typeof st.concession === 'number') {
          concAmt = st.concession;
        }

        const stuPays = payMap[sid] || {};
        const payKeys = Object.keys(stuPays);
        const latestPayKey = payKeys.sort().pop();
        const latestPay = latestPayKey ? stuPays[latestPayKey] : null;
        const isPaid = st.feeStatus === 'Paid' || Boolean(latestPay);
        const payMode = (latestPay && typeof latestPay === 'object' && latestPay.m) ? latestPay.m : 'UPI';
        const payDate = (latestPay && typeof latestPay === 'object' && latestPay.d) ? latestPay.d : (latestPayKey || '-');

        const stuObj = normalizeStudent({
          id: sid,
          rollNo: (nosMap[sid] || st.rollNo || `TSM-${String(idx + 1).padStart(4, '0')}`).toUpperCase(),
          pin: st.pin || '1234',
          name: st.name || 'Student',
          courses: courseArr,
          course: courseArr.join(', '),
          grade: st.grade || 'Elementary Grade 1',
          batch: st.batch || appState.batches[0] || '5:00 PM',
          dob: st.dob || '',
          phone: String(st.phone || st.pphone || '').replace(/\s+/g, ''),
          parentPhone: String(st.pphone || st.phone || '').replace(/\s+/g, ''),
          email: st.email || '',
          addr: st.addr || '',
          isMinor: true,
          guardian: st.parent || st.guardian || 'Guardian',
          pickupNote: st.notes || st.pickupNote || '',
          admissionDate: st.adm || st.admissionDate || selectedDate,
          genuineDays: Number(st.genuineDays || 0),
          bonusCredits: Number(st.bonusCredits || 0),
          monthlyFee: baseFee,
          concession: concAmt,
          concessionMonths: Number(st.concessionMonths || 0),
          idCardFee: Number(st.idCardFee || 0),
          certFee: Number(st.certFee || 0),
          feeStatus: isPaid ? 'Paid' : 'Unpaid',
          lastPaymentMode: payMode,
          lastPaymentDate: payDate,
          photoDataUrl: st.photo || st.photoDataUrl || ''
        });
        recalculateStudentAttendanceStats(stuObj, false);
        return stuObj;
      });

      appState.students = restoredStudents;
      appState.holidays = d.hol || appState.holidays || {};
      appState.certs = d.certs || appState.certs || [];
      if (Array.isArray(d.audioClips)) appState.audioClips = d.audioClips;
      if (Array.isArray(d.messages)) appState.messages = d.messages;
      if (Array.isArray(d.campaigns)) appState.campaigns = d.campaigns;
      if (Array.isArray(d.vaultItems)) appState.vaultItems = d.vaultItems;
      if (d.adminRollNo) appState.adminRollNo = d.adminRollNo;
      if (d.adminPin) appState.adminPin = d.adminPin;

      saveState();
      renderCurrentTab();
      showToast(`Restored ${restoredStudents.length} students & recalculated genuine/bonus days`);
    } catch (err) {
      console.error(err);
      showToast('Failed to parse backup file');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ==========================================
// 6. WEEKLY STATS, CERTIFICATE ELIGIBILITY & BILLING ENGINE
// ==========================================
function getAdmissionWeekRange(dateStr, admissionDateStr) {
  const d = parseLocalDate(dateStr);
  if (!admissionDateStr) {
    const dayOfWeek = d.getDay();
    const diffToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
    const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diffToMon, 12, 0, 0);
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6, 12, 0, 0);
    return { startStr: formatLocalDate(mon), endStr: formatLocalDate(sun), start: mon };
  }
  const adm = parseLocalDate(admissionDateStr);
  const diffDays = Math.max(0, Math.round((d.getTime() - adm.getTime()) / 86400000));
  const weekOffset = Math.floor(diffDays / 7) * 7;
  const start = new Date(adm.getFullYear(), adm.getMonth(), adm.getDate() + weekOffset, 12, 0, 0);
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6, 12, 0, 0);
  return {
    startStr: formatLocalDate(start),
    endStr: formatLocalDate(end),
    start
  };
}

function getWeeklyStats(dateStr, student) {
  const { start } = getAdmissionWeekRange(dateStr, student.admissionDate);
  let genuineWeekDays = 0;
  let bonusUsedCount = 0;
  let teacherLeaveCount = 0;
  let excusedLeaveCount = 0;
  let absentCount = 0;

  for (let i = 0; i < 7; i++) {
    const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12, 0, 0);
    const key = `${formatLocalDate(cur)}_${student.id}`;
    const rec = appState.attendance[key];
    if (rec) {
      if (rec.status === 'present') genuineWeekDays++;
      else if (rec.status === 'bonus_used') bonusUsedCount++;
      else if (rec.status === 'teacher_leave') teacherLeaveCount++;
      else if (rec.status === 'excused_leave') excusedLeaveCount++;
      else if (rec.status === 'absent') absentCount++;
    }
  }
  const totalWeekSessions = genuineWeekDays + bonusUsedCount;
  const hasShortFlag = absentCount > 0 && totalWeekSessions < 3;
  return { genuineWeekDays, bonusUsedCount, totalWeekSessions, teacherLeaveCount, excusedLeaveCount, absentCount, hasShortFlag };
}

function evaluateCertificateEligibility(student, refDateStr) {
  const genuineDays = Number(student.genuineDays || 0);
  const has48Genuine = genuineDays >= 48;
  const wk = getWeeklyStats(refDateStr, student);
  const { startStr, endStr } = getAdmissionWeekRange(refDateStr, student.admissionDate);
  const targetRoll = String(student.rollNo || '').toUpperCase();
  const stuClips = (appState.audioClips || []).filter(c => String(c.rollNo || '').toUpperCase() === targetRoll);
  const weeklyClips = stuClips.filter(c => c.date >= startStr && c.date <= endStr);
  const hasWeeklyAudio = weeklyClips.length >= 2 || stuClips.length >= 2;
  const hasWeeklyAttendance = wk.totalWeekSessions >= 3 || genuineDays >= 48;
  const eligible = has48Genuine && hasWeeklyAudio && hasWeeklyAttendance;
  return {
    eligible,
    genuineDays,
    has48Genuine,
    weeklyAudioCount: weeklyClips.length,
    totalAudioCount: stuClips.length,
    hasWeeklyAudio,
    weekSessions: wk.totalWeekSessions
  };
}

function getMonthsEnrolled(admissionDateStr) {
  if (!admissionDateStr) return 1;
  const start = parseLocalDate(admissionDateStr);
  const now = new Date();
  if (isNaN(start.getTime())) return 1;
  let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  if (now.getDate() >= start.getDate()) months += 1;
  return Math.max(1, months);
}

function getEffectiveConcession(student) {
  const months = getMonthsEnrolled(student.admissionDate);
  const period = Number(student.concessionMonths || 0);
  if (period > 0 && months > period) return 0;
  return Number(student.concession || 0);
}

function getStudentNetPayable(student) {
  const effConc = getEffectiveConcession(student);
  return Math.max(0, Number(student.monthlyFee || 0) - effConc + Number(student.idCardFee || 0) + Number(student.certFee || 0));
}

function getFamilySiblings(student) {
  const pPhone = (student.parentPhone || student.phone || '').replace(/\s+/g, '').trim();
  const pName = (student.guardian || '').trim().toLowerCase();
  return appState.students.filter(other => {
    const oPhone = (other.parentPhone || other.phone || '').replace(/\s+/g, '').trim();
    const oName = (other.guardian || '').trim().toLowerCase();
    if (pPhone && oPhone && pPhone === oPhone) return true;
    if (pName && oName && pName !== 'guardian' && pName !== 'guardian verified' && pName !== 'self / verified' && pName === oName) return true;
    return other.id === student.id;
  });
}

function getNextBillingDate(admissionDateStr) {
  if (!admissionDateStr) return '-';
  const start = parseLocalDate(admissionDateStr);
  if (isNaN(start.getTime())) return '-';
  const day = start.getDate();
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
  const next = new Date(now.getFullYear(), now.getMonth(), day, 12, 0, 0);
  if (next < todayMid) next.setMonth(next.getMonth() + 1);
  return formatLocalDate(next);
}

function getAttendanceRecord(dateStr, studentId) {
  const key = `${dateStr}_${studentId}`;
  return appState.attendance[key] || { status: 'unmarked', time: '', note: '' };
}

function setStudentAttendanceStatus(studentId, newStatus) {
  const key = `${selectedDate}_${studentId}`;
  const prev = getAttendanceRecord(selectedDate, studentId);
  const stu = appState.students.find(s => s.id === studentId);

  appState.attendance[key] = {
    ...prev,
    status: newStatus,
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  };

  if (stu) {
    recalculateStudentAttendanceStats(stu);
  }

  saveState();
  renderCurrentTab();
}

function updateAttendanceField(studentId, field, value) {
  const key = `${selectedDate}_${studentId}`;
  const prev = getAttendanceRecord(selectedDate, studentId);
  appState.attendance[key] = { ...prev, [field]: value };
  saveState();
}

function parseBatchMinutes(batchStr) {
  if (!batchStr) return 9999;
  const idx = (appState.batches || []).indexOf(batchStr);
  if (idx !== -1) return idx * 10;
  const m = String(batchStr).match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (!m) return 9999;
  let hr = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  const ampm = m[3].toUpperCase();
  if (ampm === 'PM' && hr !== 12) hr += 12;
  if (ampm === 'AM' && hr === 12) hr = 0;
  return hr * 60 + min;
}

function sortStudentsByBatch(list) {
  return [...(list || [])].sort((a, b) => {
    const diff = parseBatchMinutes(a.batch) - parseBatchMinutes(b.batch);
    if (diff !== 0) return diff;
    return String(a.rollNo || '').localeCompare(String(b.rollNo || ''));
  });
}

function getFilteredStudents() {
  const filtered = appState.students.filter(s => filterBatch === 'ALL' || s.batch === filterBatch);
  return sortStudentsByBatch(filtered);
}

function applyBatchStatus(status) {

function buildMonthlyCalendarHtml(studentFilterObj) {
  const [yr, mo] = calendarMonth.split('-').map(Number);

  const daysInMonth = new Date(yr, mo, 0).getDate();
  const startWeekday = firstDay.getDay();
  const monthLabel = firstDay.toLocaleString('default', { month: 'long', year: 'numeric' });
  const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const admDateStr = studentFilterObj ? (studentFilterObj.admissionDate || '2000-01-01') : null;

  let cells = '';
  for (let i = 0; i < startWeekday; i++) {
    cells += `<div class="${studentFilterObj ? 'h-16 sm:h-20' : 'h-24'} bg-slate-50/60 border border-slate-100 rounded-lg"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dt = `${yr}-${String(mo).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isHoliday = isDateHoliday(dt);
    const isSelected = dt === selectedDate;
    const isSunday = new Date(yr, mo - 1, day).getDay() === 0;

    if (studentFilterObj) {
      const isBeforeAdmission = dt < admDateStr;
      const isAdmissionDay = dt === admDateStr;
      const isFeesDay = isStudentFeesDay(dt, studentFilterObj);
      const rec = appState.attendance[`${dt}_${studentFilterObj.id}`];
      const status = isBeforeAdmission ? 'pre' : (isHoliday ? 'holiday' : (rec ? rec.status : 'unmarked'));

      const cell = buildStudentDayCellContent(status, isBeforeAdmission, isHoliday, isAdmissionDay, isFeesDay);

      cells += `
        <div class="h-16 sm:h-20 p-1 sm:p-1.5 border rounded-lg flex flex-col justify-between ${cell.bgCls} ${isSelected && !isBeforeAdmission ? 'ring-1 ring-[#0F172A]' : ''}">
          <div class="flex justify-between items-start gap-0.5">
            <span class="text-[10px] sm:text-xs font-bold leading-none tabular-nums ${isSunday ? 'text-red-600' : 'text-slate-700'}">${day}</span>
            <div class="flex items-center gap-0.5">${cell.tagHtml}</div>
          </div>
          <div class="flex-1 flex items-center justify-center">${cell.mainHtml}</div>
        </div>
      `;
    } else {
      let pCount = 0, aCount = 0, lCount = 0;
      appState.students.forEach(s => {
        if (s.admissionDate && dt < s.admissionDate) return;
        const rec = appState.attendance[`${dt}_${s.id}`];
        if (rec) {
          if (rec.status === 'present' || rec.status === 'bonus_used') pCount++;
          else if (rec.status === 'absent') aCount++;
          else if (rec.status === 'teacher_leave') lCount++;
        }
      });
      const hasMarks = (pCount + aCount + lCount) > 0;
      cells += `
        <div onclick="selectDateFromCalendar('${dt}')" class="h-24 p-1.5 border rounded-lg flex flex-col justify-between cursor-pointer transition hover:border-[#0F172A] ${isSelected ? 'border-2 border-[#0F172A] bg-indigo-50/30' : isHoliday ? 'border-purple-200 bg-purple-50/40' : 'border-slate-200 bg-white'}">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold ${isSunday ? 'text-red-600' : 'text-slate-800'}">${day}</span>
            <button type="button" onclick="event.stopPropagation(); toggleHolidayDate('${dt}')" title="Toggle Holiday" class="text-[9px] px-1 rounded ${isHoliday ? 'bg-purple-700 text-white font-bold' : 'text-slate-400 hover:bg-slate-100'}">
              ${isHoliday ? 'H' : 'H'}
            </button>
          </div>
          <div class="space-y-0.5 text-[9px] font-semibold tabular-nums">
            ${isHoliday ? '<div class="text-purple-700 font-black text-base text-center leading-none">H</div>' : ''}
            ${hasMarks ? `
              <div class="flex justify-between text-emerald-700"><span>P:</span><span>${pCount}</span></div>
              ${aCount > 0 ? `<div class="flex justify-between text-red-600"><span>A:</span><span>${aCount}</span></div>` : ''}
              ${lCount > 0 ? `<div class="flex justify-between text-amber-700"><span>TL:</span><span>${lCount}</span></div>` : ''}
            ` : (!isHoliday ? '<div class="text-slate-300 text-center">&mdash;</div>' : '')}
          </div>
        </div>
      `;
    }
  }

  return `
    <div class="bg-white p-3.5 sm:p-4 rounded-xl border border-slate-200 space-y-3">
      <div class="flex items-center justify-between gap-2">
        <button type="button" onclick="shiftCalendarMonth(-1)" class="min-h-[36px] px-3 py-1.5 text-xs font-semibold border border-slate-300 rounded-lg hover:bg-slate-50">&larr; Prev</button>
        <div class="text-center">
          <h3 class="text-sm font-bold text-[#0F172A] uppercase tracking-wide">${escapeHtml(monthLabel)}</h3>
          ${studentFilterObj ? `<p class="text-[10px] text-slate-500">Admission: <b>${escapeHtml(studentFilterObj.admissionDate)}</b></p>` : ''}
        </div>
        <button type="button" onclick="shiftCalendarMonth(1)" class="min-h-[36px] px-3 py-1.5 text-xs font-semibold border border-slate-300 rounded-lg hover:bg-slate-50">Next &rarr;</button>
      </div>
      ${studentFilterObj ? getAttendanceLegendHtml() : ''}

        ${weekdays.map(w => `<div>${w}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1 sm:gap-1.5">
        ${cells}
      </div>

function processQrPayload(rawText) {
  if (!rawText) return false;
  let clean = rawText.trim().toUpperCase();
  if (clean.includes('VERIFY=')) {
    clean = clean.split('VERIFY=')[1].split('&')[0];
  } else if (clean.includes('/')) {
    clean = clean.split('/').pop();
  }
  const stu = appState.students.find(s =>
    s.rollNo.toUpperCase() === clean ||
    s.rollNo.toUpperCase().endsWith('-' + clean)
  );
  if (stu) {
    setStudentAttendanceStatus(stu.id, 'present');
    showToast(`Checked In: ${stu.name} (${stu.rollNo})`);
    return true;
  }
  showToast(`Roll not found: ${clean}`);
  return false;
}

    </div>
  `);
  setTimeout(() => {
    try {
      html5QrScanner = new Html5Qrcode("qrReaderBox");
      html5QrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          if (processQrPayload(decodedText)) {
            stopQrCamera();
            closeModal();
          }
        },
        () => {}
      ).catch(() => {
        showToast('Camera permission denied or unavailable on this device');
      });
    } catch (err) {
      showToast('Scanner unavailable');
    }
  }, 150);
}

function stopQrCamera() {
  if (html5QrScanner) {
    try { html5QrScanner.stop().catch(() => {}); } catch (e) {}
    html5QrScanner = null;
  }
}

function isDateHoliday(dateStr) {
  if (appState.holidays && Object.prototype.hasOwnProperty.call(appState.holidays, dateStr)) {
    return Boolean(appState.holidays[dateStr]);
  }
  // Automatically mark Sunday as Holiday unless explicitly marked as a Special Class (false)
  const parts = String(dateStr).split('-').map(Number);
  if (parts.length === 3) {
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    if (d.getDay() === 0) return true;
  }
  return false;
}

function toggleHolidayForSelectedDate() {
  if (!appState.holidays) appState.holidays = {};
  const currentlyHol = isDateHoliday(selectedDate);
  appState.holidays[selectedDate] = !currentlyHol;
  saveState();
  renderCurrentTab();
  showToast(!currentlyHol ? `Marked ${selectedDate} as Holiday` : `Enabled Classes / Special Class on ${selectedDate}`);
}

function saveCourse(e, courseId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const obj = {
    id: courseId || 'crs_' + Date.now(),
    name: fd.get('name').trim(),
    category: fd.get('category'),
    fee: Number(fd.get('fee') || 0),
    discount: Number(fd.get('discount') || 0),
    feature: fd.get('feature').trim()
  };
  if (courseId) {
    const idx = appState.courses.findIndex(x => x.id === courseId);
    if (idx > -1) appState.courses[idx] = obj;
  } else {
    appState.courses.push(obj);
  }
  saveState();
  closeModal();
  renderCurrentTab();
}

function deleteCourse(courseId) {
  if (!confirm('Remove this course?')) return;
  appState.courses = appState.courses.filter(x => x.id !== courseId);
  saveState();
  renderCurrentTab();
}

function addBatchTiming(e) {
  e.preventDefault();
  const inp = document.getElementById('newBatchInput');
  appState.batches.push(inp.value.trim());
  inp.value = '';
  saveState();
  renderCurrentTab();
}

function editBatchTiming(idx) {
  const updated = prompt('Edit Batch Timing:', appState.batches[idx]);
  if (updated && updated.trim()) {
    appState.batches[idx] = updated.trim();
    saveState();
    renderCurrentTab();
  }
}

function deleteBatchTiming(idx) {
  if (!confirm('Remove this batch timing?')) return;
  appState.batches.splice(idx, 1);
  saveState();
  renderCurrentTab();
}

function uploadTemplateImage(e, stateField) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    appState[stateField] = ev.target.result;
    saveState();
    renderCurrentTab();
    showToast('Custom template saved');
  };
  reader.readAsDataURL(file);
}

function recalcMultiCourseFee(container) {
  const checked = [...container.querySelectorAll('input[name="selectedCourses"]:checked')];
  let totalFee = 0;
  let totalDisc = 0;
  checked.forEach(cb => {
    const crs = appState.courses.find(x => x.name === cb.value);
    if (crs) {
      totalFee += Number(crs.fee || 0);
      totalDisc += Number(crs.discount || 0);
    }
  });
  const feeInp = container.querySelector('[name="monthlyFee"]');
  const discInp = container.querySelector('[name="concession"]');
  if (feeInp && checked.length > 0) feeInp.value = totalFee;
  if (discInp && checked.length > 0) discInp.value = totalDisc;
}

    id: 'stu_' + Date.now(),

    certFee: Number(fd.get('certFee') || 0),

    dob: '',
    email: '',
    addr: '',
    gender: '',
    schoolOrOccupation: '',

  dispatchPushAlert(newStu.rollNo, "TIKARIYA'S SCHOOL OF MUSIC", `Welcome ${newStu.name} (${newStu.rollNo})! Admission confirmed for ${newStu.course}.`);

function saveEditedStudent(e, stuId) {
  e.preventDefault();
  const form = e.target;
  const s = appState.students.find(x => x.id === stuId);
  const fd = new FormData(form);
  const selectedCourses = [...form.querySelectorAll('input[name="selectedCourses"]:checked')].map(cb => cb.value);
  s.courses = selectedCourses.length ? selectedCourses : s.courses;
  s.course = s.courses.join(', ');
  s.name = fd.get('name').trim();
  s.phone = fd.get('phone').trim();
  s.parentPhone = (fd.get('parentPhone') || s.phone).trim();
  s.guardian = (fd.get('guardian') || s.guardian).trim();
  if (fd.get('batch')) s.batch = fd.get('batch');
  s.grade = fd.get('grade');
  s.genuineDays = Number(fd.get('genuineDays') || 0);
  s.monthlyFee = Number(fd.get('monthlyFee') || 0);

  s.concessionMonths = Number(fd.get('concessionMonths') || 0);
  s.idCardFee = Number(fd.get('idCardFee') || 0);
  s.certFee = Number(fd.get('certFee') || 0);
  saveState();
  closeModal();
  renderCurrentTab();
}

function uploadCustomBrochure(e) {
  const file = e.target.files[0];
  if (!file) return;
  showToast('Uploading custom brochure to cloud...');
  const reader = new FileReader();
  reader.onload = async function(ev) {
    const dataUrl = ev.target.result;
    appState.customBrochureDataUrl = dataUrl.length < 150000 ? dataUrl : '';
    appState.customBrochureName = file.name;
    appState.hasCustomBrochure = true;
    const res = await tsmSaveBlob('custom_brochure', dataUrl, { fileName: file.name, mimeType: file.type || 'application/pdf' });
    saveState();
    renderCurrentTab();
    if (res.cloudOk) {
      showToast(`Uploaded & cloud-synced brochure: ${file.name}`);
    } else {
      showToast(`Saved brochure locally (${file.name}), cloud sync failed — check internet/rules`);
    }
  };
  reader.readAsDataURL(file);
}

async function downloadActiveBrochure() {
  showToast('Preparing academy brochure...');
  let brochureData = appState.customBrochureDataUrl || '';
  let brochureName = appState.customBrochureName || '';

  // 1. Always check fresh cloud `tsm_blobs/custom_brochure` (with IndexedDB fallback) so newly uploaded brochures sync across devices
  if (!brochureData) {
    const loaded = await tsmLoadBlobWithMeta('custom_brochure', { preferCloud: true });
    if (loaded.dataUrl) {
      brochureData = loaded.dataUrl;
      if (loaded.fileName && !brochureName) brochureName = loaded.fileName;
    }
  }

  // 2. If still not found, check cloud master_state directly (handles fresh login screen before snapshot arrives)
  if (!brochureData) {
    const fsDb = await ensureFirestoreReady();
    if (fsDb) {
      try {
        const ms = await fsDb.collection('tsm_system').doc('master_state').get();
        if (ms.exists) {
          const d = ms.data() || {};
          if (d.customBrochureName && !brochureName) brochureName = d.customBrochureName;
          if (d.customBrochureDataUrl) brochureData = d.customBrochureDataUrl;
          if (!brochureData && Array.isArray(d.vaultItems)) {
            const brochureVault = d.vaultItems.find(x => String(x.category || '').toLowerCase() === 'brochure');
            if (brochureVault) {
              brochureData = brochureVault.pdfDataUrl || (await tsmLoadBlob(brochureVault.id)) || '';
              if (brochureData && !brochureName) brochureName = `${String(brochureVault.title || 'TSM_Brochure').replace(/\s+/g, '_')}.pdf`;
            }
          }
        }
      } catch (e) { console.warn('Brochure cloud lookup warning:', e); }
    }
  }

  // 3. Also check local vaultItems for a Brochure category upload if custom_brochure wasn't set
  if (!brochureData && Array.isArray(appState.vaultItems)) {
    const brochureVault = appState.vaultItems.find(x => String(x.category || '').toLowerCase() === 'brochure');
    if (brochureVault) {
      brochureData = brochureVault.pdfDataUrl || (await tsmLoadBlob(brochureVault.id)) || '';
      if (brochureData && !brochureName) brochureName = `${String(brochureVault.title || 'TSM_Brochure').replace(/\s+/g, '_')}.pdf`;
    }
  }

  if (brochureData) {
    await triggerSafeDownloadFromDataUrl(brochureData, brochureName || 'TSM_Brochure.pdf');
    showToast(`Downloaded ${brochureName || 'Academy Brochure'}`);
    return;
  }

  // Fallback: generate standard academy brochure only when no custom PDF has been uploaded
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
  const fontReg = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const p = pdfDoc.addPage([298, 420]);

  p.drawRectangle({ x: 14, y: 14, width: 270, height: 392, borderColor: rgb(0.8, 0.83, 0.88), borderWidth: 1 });
  p.drawText('B. S. TIKARIYA CULTURAL FOUNDATION', { x: 52, y: 382, size: 7, font: fontBold, color: rgb(0.28, 0.33, 0.41) });
  p.drawText('CIN: U88900MH2025NPL454435', { x: 85, y: 372, size: 6.5, font: fontReg, color: rgb(0.39, 0.45, 0.55) });
  drawStyledAcademyTitlePdf(p, 42, 354, 11.5, fontBold);

  let y = 328;
  appState.courses.forEach(c => {
    p.drawText(sanitizePdfText(`${c.name} (${c.category}) - INR ${c.fee}`), { x: 24, y, size: 7, font: fontBold, color: rgb(0.06, 0.09, 0.16) });
    y -= 14;

function sendWhatsAppFeeAlert(stuId) {
  const s = appState.students.find(x => x.id === stuId);
  const siblings = getFamilySiblings(s);
  const totalFamily = siblings.reduce((acc, item) => acc + getStudentNetPayable(item), 0);
  const targetPhone = s.phone || s.parentPhone;
  const namesStr = siblings.map(x => `${x.name} (${x.rollNo} - ${x.course})`).join(', ');
  const msg = s.feeStatus === 'Paid'
    ? `Dear ${namesStr}, B. S. TIKARIYA CULTURAL FOUNDATION - TIKARIYA'S SCHOOL OF MUSIC confirms receipt of INR ${totalFamily} via ${s.lastPaymentMode}. Thank you.`
    : `Dear ${namesStr}, gentle fee reminder from B. S. TIKARIYA CULTURAL FOUNDATION - TIKARIYA'S SCHOOL OF MUSIC. Amount INR ${totalFamily} is due. Kindly pay via UPI or Cash.`;
  dispatchPushAlert(s.rollNo, "TIKARIYA'S SCHOOL OF MUSIC", msg);
  window.open(`https://wa.me/91${targetPhone}?text=${encodeURIComponent(msg)}`, '_blank');
}

function generateAutoAudioClipName(stu) {

async function toggleInAppAudioRecord(stuId) {
  const stu = appState.students.find(x => x.id === stuId);
  if (!stu) return;

  if (isRecordingAudio) {
    stopAudioRecording(false);
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        sampleRate: 16000,
        echoCancellation: true,
        noiseSuppression: true
      }
    });

    recordedChunks = [];
    recordedAudioDataUrl = '';
    recordedDurationSec = 0;

    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
    const options = mimeType ? { mimeType, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 };
    mediaRecorder = new MediaRecorder(stream, options);

    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const reader = new FileReader();
      reader.onload = ev => {
        recordedAudioDataUrl = ev.target.result;
        const sizeKb = Math.round(blob.size / 1024);
        showToast(`Recorded ${recordedDurationSec}s (${sizeKb} KB)`);
        renderCurrentTab();
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start();
    isRecordingAudio = true;
    renderCurrentTab();

    recordingTimerInterval = setInterval(() => {
      recordedDurationSec++;
      const timerEl = document.getElementById('recTimerText');
      if (timerEl) timerEl.textContent = `${recordedDurationSec}s / 45s`;
      if (recordedDurationSec >= 45) {
        stopAudioRecording(false);
      }
    }, 1000);
  } catch (err) {
    showToast('Microphone access denied or unavailable');
  }
}

function stopAudioRecording(discard) {
  if (recordingTimerInterval) {
    clearInterval(recordingTimerInterval);
    recordingTimerInterval = null;
  }
  isRecordingAudio = false;
  if (discard) {
    recordedChunks = [];
    recordedAudioDataUrl = '';
    recordedDurationSec = 0;
  }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch (e) {}
  }
}

// ==========================================
async function downloadStudentWatermarkedVaultPdf(vaultId, stuId) {
  const s = appState.students.find(x => x.id === stuId) || appState.students[0];
  const v = (appState.vaultItems || []).find(x => x.id === vaultId);
  if (!v || !s) return;

  const safeFileName = `TSM_${String(v.title || 'Material').replace(/[^a-zA-Z0-9_-]+/g, '_')}_${s.rollNo}.pdf`;
  showToast('Fetching study material PDF...');

  // 1. Load actual uploaded PDF from all available stores (inline -> IndexedDB/Firestore tsm_blobs -> localStorage -> tsm_vault_files)
  let pdfDataUrl = v.pdfDataUrl || '';
  if (!pdfDataUrl) {
    pdfDataUrl = await tsmLoadBlob(vaultId);
  }
  if (!pdfDataUrl) {
    try { pdfDataUrl = localStorage.getItem('tsm_pdf_' + vaultId) || ''; } catch (e) {}
  }
  if (!pdfDataUrl) {
    const fsDb = await ensureFirestoreReady();
    if (fsDb) {
      try {
        const doc = await fsDb.collection('tsm_vault_files').doc(vaultId).get();
        if (doc.exists && doc.data().pdfDataUrl) pdfDataUrl = doc.data().pdfDataUrl;
      } catch (e) {}
    }
  }

  if (!pdfDataUrl) {
    showToast('PDF file not synced to cloud yet. Please ask your instructor to re-upload it in Studio.');
    return;
  }

  let rawBytes = null;
  try {
    rawBytes = dataUrlToUint8Array(pdfDataUrl);
  } catch (e) {
    console.warn('Base64 decode warning:', e);
    await triggerSafeDownloadFromDataUrl(pdfDataUrl, safeFileName);
    showToast('Downloaded study material PDF');
    return;
  }

  // 2. Try merging cover page + student watermark on every uploaded page; if PDF cannot be rewritten, download the real uploaded PDF directly
  try {
    showToast('Applying student watermark to study material...');
    const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
    const srcDoc = await PDFDocument.load(rawBytes, { ignoreEncryption: true });
    const pageIndices = srcDoc.getPageIndices();
    if (!pageIndices.length) {
      throw new Error('Source PDF has zero readable pages');
    }

    const outDoc = await PDFDocument.create();
    const fontBold = await outDoc.embedFont(StandardFonts.HelveticaBold);
    const fontReg = await outDoc.embedFont(StandardFonts.Helvetica);

    // Official Personalized Cover Page
    const cover = outDoc.addPage([595.28, 841.89]);
    cover.drawRectangle({ x: 36, y: 36, width: 523.28, height: 769.89, borderColor: rgb(0.06, 0.09, 0.16), borderWidth: 1.5 });
    cover.drawRectangle({ x: 36, y: 799.89, width: 523.28, height: 6, color: rgb(0.06, 0.09, 0.16) });
    cover.drawText('B. S. TIKARIYA CULTURAL FOUNDATION', { x: 185, y: 755, size: 10, font: fontBold, color: rgb(0.28, 0.33, 0.41) });
    cover.drawText('CIN: U88900MH2025NPL454435', { x: 225, y: 740, size: 8.5, font: fontReg, color: rgb(0.39, 0.45, 0.55) });
    drawStyledAcademyTitlePdf(cover, 148, 710, 18, fontBold);
    cover.drawText(sanitizePdfText((v.category || 'OFFICIAL STUDY MATERIAL').toUpperCase()), { x: 215, y: 675, size: 9.5, font: fontBold, color: rgb(0.26, 0.22, 0.79) });
    cover.drawText(sanitizePdfText(v.title || 'Study Material'), { x: 64, y: 615, size: 18, font: fontBold, color: rgb(0.06, 0.09, 0.16) });
    cover.drawText(sanitizePdfText(`Course: ${v.targetCourse || v.course || 'All Courses'}`), { x: 64, y: 585, size: 11, font: fontBold, color: rgb(0.26, 0.22, 0.79) });
    cover.drawText(sanitizePdfText(`Issued To Student: ${s.name} (Roll No: ${s.rollNo})`), { x: 64, y: 550, size: 12, font: fontBold, color: rgb(0.06, 0.09, 0.16) });
    cover.drawText(sanitizePdfText(`Grade: ${s.grade} - ${s.course} | Batch: ${s.batch}`), { x: 64, y: 530, size: 10, font: fontReg, color: rgb(0.28, 0.33, 0.41) });
    cover.drawText(sanitizePdfText(`${s.name} (${s.rollNo}) - TIKARIYA'S SCHOOL OF MUSIC`), {
      x: 95, y: 320, size: 15, font: fontBold, color: rgb(0.75, 0.78, 0.82), opacity: 0.32, rotate: degrees(35)
    });

    const copiedPages = await outDoc.copyPages(srcDoc, pageIndices);
    const wmText = sanitizePdfText(`${s.name} (${s.rollNo}) - TIKARIYA'S SCHOOL OF MUSIC`);
    copiedPages.forEach(cp => {
      try {
        const { width, height } = cp.getSize();
        cp.drawText(wmText, {
          x: Math.max(36, width * 0.14),
          y: Math.max(120, height * 0.42),
          size: Math.min(16, Math.max(11, width / 38)),
          font: fontBold,
          color: rgb(0.72, 0.75, 0.80),
          opacity: 0.28,
          rotate: degrees(35)
        });
      } catch (wmErr) {
        console.warn('Watermark draw skipped on page:', wmErr);
      }
      outDoc.addPage(cp);
    });

    const bytes = await outDoc.save();
    triggerBlobDownload(new Blob([bytes], { type: 'application/pdf' }), safeFileName);
    showToast(`Downloaded ${v.title} (${copiedPages.length} pages + cover)`);
  } catch (mergeErr) {
    console.warn('PDF merge fallback to original uploaded PDF:', mergeErr);
    // CRITICAL: Never hand the student only an empty wrapper — download the real uploaded PDF directly!
    triggerBlobDownload(new Blob([rawBytes], { type: 'application/pdf' }), safeFileName);
    showToast(`Downloaded ${v.title}`);
  }
}

function saveStudentSecurityPin(e, stuId) {
  e.preventDefault();
  const s = appState.students.find(x => x.id === stuId);
  if (!s) return;
  const fd = new FormData(e.target);
  const newPin = String(fd.get('newPin') || '').trim();
  const confirmPin = String(fd.get('confirmPin') || '').trim();
  const errEl = document.getElementById('secPinError');

  if (newPin.length < 4) {
    if (errEl) { errEl.textContent = 'PIN must be at least 4 characters.'; errEl.classList.remove('hidden'); }
    return;
  }
  if (newPin === '1234') {
    if (errEl) { errEl.textContent = 'Please choose a new PIN different from 1234.'; errEl.classList.remove('hidden'); }
    return;
  }
  if (newPin !== confirmPin) {
    if (errEl) { errEl.textContent = 'PINs do not match. Please re-enter.'; errEl.classList.remove('hidden'); }
    return;
  }

  s.pin = newPin;
  s.pinChanged = true;
  saveState();
  showToast('Access PIN updated successfully');
  openStudentSecurityPopup(stuId);
}

    if (newPin.length < 4) {
      showToast('PIN must be at least 4 characters');
      return;
    }
    if (newPin === '1234') {
      showToast('Please choose a PIN different from 1234');
      return;
    }
    if (newPin !== confirmPin) {
      showToast('New PIN and Confirm PIN do not match');
      return;
    }
    s.pin = newPin;
    s.pinChanged = true;
  }

  s.dob = String(fd.get('dob') || '').trim();
  s.gender = String(fd.get('gender') || '').trim();
  s.email = String(fd.get('email') || '').trim();
  s.schoolOrOccupation = String(fd.get('schoolOrOccupation') || '').trim();
  s.addr = String(fd.get('addr') || '').trim();
  s.phone = String(fd.get('phone') || s.phone || '').trim();
  s.guardian = String(fd.get('guardian') || '').trim();
  s.parentPhone = String(fd.get('parentPhone') || s.phone || '').trim();
  s.pickupNote = String(fd.get('pickupNote') || '').trim();
  s.musicGoal = String(fd.get('musicGoal') || '').trim();

  saveState();
  closeModal();
  renderCurrentTab();
  showToast('Profile saved successfully');
}

function uploadStudentPhoto(e, stuId, keepModalOpen = false) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(ev) {
    const s = appState.students.find(x => x.id === stuId);
    if (!s) return;
    s.photoDataUrl = await compressImageDataUrl(ev.target.result, 360, 440, 0.82);
    saveState();
    renderCurrentTab();
    if (keepModalOpen) {
      const preview = document.getElementById('profilePhotoPreview');
      if (preview) {
        preview.innerHTML = `<img src="${safeDataUrl(s.photoDataUrl, 'data:image/')}" class="w-full h-full object-cover" />`;
      }
    }
    showToast('Photo updated');
  };
  reader.readAsDataURL(file);
}

function updateStudentField(stuId, field, val) {
  const s = appState.students.find(x => x.id === stuId);
  if (!s) return;
  if (field === 'pin') {
    const trimmed = val.trim();
    if (trimmed.length < 4) return;
    s.pin = trimmed;
    if (trimmed !== '1234') s.pinChanged = true;
  } else {
    s[field] = val.trim();
  }
  saveState();
  showToast('Profile updated');
}

function sendStudentMessage(e, rollNo) {
  e.preventDefault();
  const inp = document.getElementById('stuMsgInput');
  const txt = inp.value.trim();
  const s = appState.students.find(x => x.rollNo === rollNo);
  appState.messages.push({
    id: 'm_' + Date.now(),
    rollNo,
    sender: 'Student',
    text: txt,
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });
  dispatchPushAlert('ADMIN', "TIKARIYA'S SCHOOL OF MUSIC", `Message from ${s ? s.name : rollNo}: ${txt}`);
  inp.value = '';
  saveState();
  renderCurrentTab();
}

async function exportDailyAttendancePdf() {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
  const fontReg = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const page = pdfDoc.addPage([595.28, 841.89]);

  page.drawText('B. S. TIKARIYA CULTURAL FOUNDATION (CIN: U88900MH2025NPL454435)', { x: 50, y: 790, size: 9, font: fontBold, color: rgb(0.3, 0.35, 0.45) });
  drawStyledAcademyTitlePdf(page, 50, 768, 15, fontBold);
  page.drawText(`Daily Attendance Register (${selectedDate})`, { x: 50, y: 750, size: 10.5, font: fontBold, color: rgb(0.28, 0.33, 0.41) });

  let y = 720;
  getFilteredStudents().forEach(s => {
    const rec = getAttendanceRecord(selectedDate, s.id);
    const wk = getWeeklyStats(selectedDate, s);
    page.drawText(`${s.rollNo} | ${s.name} | ${s.course} | ${rec.status.toUpperCase()} | Wk:${wk.totalWeekSessions}/3${wk.hasShortFlag?'*':''} | Gen:${s.genuineDays % 48}/48`, {
      x: 50, y, size: 9, font: fontReg, color: rgb(0.1, 0.12, 0.18)
    });
    y -= 20;
  });

  const bytes = await pdfDoc.save();
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `TSM_Attendance_${selectedDate}.pdf`;
  link.click();
}
