function generateAppIconPng(size) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const r = Math.round(size * 0.22);
  ctx.fillStyle = '#0F172A';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, r);
  ctx.fill();

  ctx.strokeStyle = '#334155';
  ctx.lineWidth = Math.max(2, size * 0.02);
  ctx.beginPath();
  ctx.roundRect(size * 0.04, size * 0.04, size * 0.92, size * 0.92, r * 0.85);
  ctx.stroke();

  const fontSize = Math.round(size * 0.34);
  ctx.font = `900 ${fontSize}px Arial, sans-serif`;
  ctx.textBaseline = 'middle';
  const y = size * 0.52;
  const wTS = ctx.measureText('TS').width;
  const wM = ctx.measureText('M').width;
  const startX = (size - (wTS + wM)) / 2;

  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('TS', startX, y);
  ctx.fillStyle = '#EF4444';
  ctx.fillText('M', startX + wTS, y);

  return c.toDataURL('image/png');
}

const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;

function normalizeStudent(s) {
  if (!Array.isArray(s.courses) || !s.courses.length) {
    s.courses = s.course ? s.course.split(/[,/]/).map(x => x.trim()).filter(Boolean) : ['Piano'];
  }
  s.course = s.courses.join(', ');
  if (s.genuineDays === undefined) s.genuineDays = s.attendedDays || 0;
  if (s.concessionMonths === undefined) s.concessionMonths = 0;
  if (!s.parentPhone) s.parentPhone = s.phone || '';
  if (!s.pin) s.pin = '1234';
  if (!s.grade) {
    const gradeIdx = Math.min(GRADES.length - 1, Math.floor((s.genuineDays || 0) / 48));
    s.grade = GRADES[gradeIdx];
  }
  return s;
}

function purgeExpiredAudioData(stateObj) {
  if (!Array.isArray(stateObj.audioClips)) return false;
  let purgedAny = false;
  const now = Date.now();
  stateObj.audioClips.forEach(c => {
    if (c.status === 'Verified' && c.approvedAt && c.dataUrl) {
      if (now - Number(c.approvedAt) >= THREE_DAYS_MS) {
        c.dataUrl = '';
        c.purgedAt = now;
        purgedAny = true;
      }
    }
  });
  return purgedAny;
}

function loadState() {
  try {

    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.students) {
        if (!parsed.adminRollNo) parsed.adminRollNo = 'MUSICSNSOUNDS';
        if (!parsed.courses) parsed.courses = DEFAULT_COURSES;
        if (!parsed.batches) parsed.batches = DEFAULT_BATCHES;
        if (!parsed.audioClips) parsed.audioClips = [];
        if (!parsed.holidays) parsed.holidays = {};
        if (!parsed.certs) parsed.certs = [];
        parsed.students = parsed.students.map(normalizeStudent);
        purgeExpiredAudioData(parsed);
        return parsed;
      }
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function saveState() {

}

function exportBackupJson() {
  const todayStr = new Date().toISOString().split('T')[0];
  const nosMap = {};
  const attMap = {};
  const payMap = {};

  appState.students.forEach((s, idx) => {
    nosMap[s.id] = s.rollNo || `TSM-${String(idx + 1).padStart(4, '0')}`;
    if (s.feeStatus === 'Paid') {
      payMap[s.id] = { [s.admissionDate.slice(0, 7)]: { d: s.lastPaymentDate || todayStr, m: s.lastPaymentMode || 'UPI' } };
    }
  });

  Object.entries(appState.attendance || {}).forEach(([key, rec]) => {
    const idx = key.indexOf('_');
    if (idx === -1) return;
    const dt = key.slice(0, idx);
    const sid = key.slice(idx + 1);
    if (!attMap[dt]) attMap[dt] = {};
    attMap[dt][sid] = rec.status === 'present' ? 'P' : rec.status === 'absent' ? 'A' : rec.status === 'teacher_leave' ? 'L' : rec.status;
  });

  const feeCfg = {};
  appState.courses.forEach(c => { feeCfg[c.name] = c.fee; });

  const backupPayload = {
    app: "tsm-attendance",
    saved: todayStr,
    schemaVersion: 3,
    data: {
      students: appState.students.map(s => ({
        id: s.id,
        gid: s.id,
        name: s.name,
        course: s.courses && s.courses.length > 1 ? s.courses.join('/') : (s.courses?.[0] || s.course),
        batch: s.batch,
        adm: s.admissionDate,
        fee: s.monthlyFee,
        dob: s.dob || '',
        phone: s.phone || '',
        parent: s.guardian || '',
        pphone: s.parentPhone || s.phone || '',
        email: s.email || '',
        addr: s.addr || '',
        notes: s.pickupNote || '',
        photo: s.photoDataUrl || '',
        pin: s.pin || '1234',
        genuineDays: s.genuineDays || 0,
        bonusCredits: s.bonusCredits || 0,
        concession: s.concession || 0,
        concessionMonths: s.concessionMonths || 0,
        idCardFee: s.idCardFee || 0,
        certFee: s.certFee || 0,
        feeStatus: s.feeStatus || 'Unpaid'
      })),
      att: attMap,
      pay: payMap,
      hol: appState.holidays || {},
      cfg: {
        batches: appState.batches,
        fee: feeCfg
      },
      nos: nosMap,

function handleRestoreBackupFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const raw = JSON.parse(ev.target.result);
      const d = raw.data ? raw.data : raw;
      if (!d || !Array.isArray(d.students)) {
        showToast('Invalid backup JSON format');
        return;
      }

      const nosMap = d.nos || {};
      const attMap = d.att || {};
      const payMap = d.pay || {};
      const cfg = d.cfg || {};

      // Count genuine 'P' days from att history for each student
      const genuineCountBySid = {};
      const restoredAttendance = {};
      Object.entries(attMap).forEach(([dateStr, dayObj]) => {
        if (!dayObj || typeof dayObj !== 'object') return;
        Object.entries(dayObj).forEach(([sid, code]) => {
          let mappedStatus = 'present';
          if (code === 'P' || code === 'present') {
            mappedStatus = 'present';
            genuineCountBySid[sid] = (genuineCountBySid[sid] || 0) + 1;
          } else if (code === 'A' || code === 'absent') {
            mappedStatus = 'absent';
          } else if (code === 'L' || code === 'teacher_leave') {
            mappedStatus = 'teacher_leave';
          } else if (code === 'bonus_used' || code === 'excused_leave') {
            mappedStatus = code;
          }
          restoredAttendance[`${dateStr}_${sid}`] = {
            status: mappedStatus,
            time: '',
            note: ''
          };
        });
      });

      // Merge courses from cfg.fee
      if (cfg.fee && typeof cfg.fee === 'object') {
        Object.entries(cfg.fee).forEach(([cName, cFee]) => {
          const exists = appState.courses.find(x => x.name.toLowerCase() === cName.toLowerCase());
          if (exists) exists.fee = Number(cFee);
          else appState.courses.push({ id: 'crs_' + Date.now() + Math.random().toString(36).slice(2, 5), name: cName, category: 'Instrument', fee: Number(cFee), discount: 0, feature: '' });
        });
      }

      if (Array.isArray(cfg.batches) && cfg.batches.length) {
        appState.batches = cfg.batches;
      }

      const restoredStudents = d.students.map((st, idx) => {
        const courseArr = String(st.course || 'Piano').split(/[,/]/).map(x => x.trim()).filter(Boolean);
        let baseFee = Number(st.base || st.fee || 1000);
        let concAmt = 0;
        if (st.disc && typeof st.disc === 'object') {
          if (st.disc.t === '%') concAmt = Math.round(baseFee * (Number(st.disc.v || 0) / 100));
          else concAmt = Number(st.disc.v || 0);
        } else if (typeof st.concession === 'number') {
          concAmt = st.concession;
        }

        const stuPays = payMap[st.id] || {};
        const payKeys = Object.keys(stuPays);
        const latestPayKey = payKeys.sort().pop();
        const latestPay = latestPayKey ? stuPays[latestPayKey] : null;
        const isPaid = st.feeStatus === 'Paid' || Boolean(latestPay);
        const payMode = (latestPay && typeof latestPay === 'object' && latestPay.m) ? latestPay.m : 'UPI';
        const payDate = (latestPay && typeof latestPay === 'object' && latestPay.d) ? latestPay.d : (latestPayKey || '-');

        const genuineTotal = st.genuineDays !== undefined ? Number(st.genuineDays) : (genuineCountBySid[st.id] || 0);
        const gradeIdx = Math.min(GRADES.length - 1, Math.floor(genuineTotal / 48));

        return normalizeStudent({
          id: st.id,
          rollNo: (nosMap[st.id] || st.rollNo || `TSM-${String(idx + 1).padStart(4, '0')}`).toUpperCase(),
          pin: st.pin || '1234',
          name: st.name,
          courses: courseArr,
          course: courseArr.join(', '),
          grade: st.grade || GRADES[gradeIdx],
          batch: st.batch || appState.batches[0] || '5:00 PM',
          dob: st.dob || '',
          phone: (st.phone || st.pphone || '').replace(/\s+/g, ''),
          parentPhone: (st.pphone || st.phone || '').replace(/\s+/g, ''),
          email: st.email || '',
          addr: st.addr || '',
          isMinor: true,
          guardian: st.parent || st.guardian || 'Guardian',
          pickupNote: st.notes || st.pickupNote || '',
          admissionDate: st.adm || st.admissionDate || selectedDate,
          genuineDays: genuineTotal,
          bonusCredits: Number(st.bonusCredits || 0),
          monthlyFee: baseFee,
          concession: concAmt,
          concessionMonths: Number(st.concessionMonths || 0),
          idCardFee: Number(st.idCardFee || 0),
          certFee: Number(st.certFee || 0),
          feeStatus: isPaid ? 'Paid' : 'Unpaid',
          lastPaymentMode: payMode,
          lastPaymentDate: payDate,
          photoDataUrl: st.photo || st.photoDataUrl || ''
        });
      });

      appState.students = restoredStudents;
      appState.attendance = restoredAttendance;
      appState.holidays = d.hol || appState.holidays || {};
      appState.certs = d.certs || appState.certs || [];
      if (Array.isArray(d.audioClips)) appState.audioClips = d.audioClips;
      if (Array.isArray(d.messages)) appState.messages = d.messages;
      if (Array.isArray(d.campaigns)) appState.campaigns = d.campaigns;
      if (Array.isArray(d.vaultItems)) appState.vaultItems = d.vaultItems;
      if (d.adminRollNo) appState.adminRollNo = d.adminRollNo;
      if (d.adminPin) appState.adminPin = d.adminPin;

      saveState();
      renderCurrentTab();
      showToast(`Restored ${restoredStudents.length} students & attendance history`);
    } catch (err) {
      console.error(err);
      showToast('Failed to parse backup file');
    }
  };
  reader.readAsText(file);
}

// ==========================================
// 5. CERTIFICATE ELIGIBILITY, FAMILY GROUPING & BILLING ENGINE
// ==========================================
function getWeekRange(dateStr) {
  const d = new Date(dateStr);
  const dayOfWeek = d.getDay();
  const diffToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
  const mon = new Date(d);
  mon.setDate(d.getDate() + diffToMon);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  return {
    monStr: mon.toISOString().split('T')[0],
    sunStr: sun.toISOString().split('T')[0],
    mon
  };
}

function getWeeklyStats(dateStr, studentId) {
  const { mon } = getWeekRange(dateStr);
  let genuineWeekDays = 0;
  let bonusUsedCount = 0;
  let teacherLeaveCount = 0;
  let absentCount = 0;

  for (let i = 0; i < 7; i++) {
    const cur = new Date(mon);
    cur.setDate(mon.getDate() + i);
    const key = `${cur.toISOString().split('T')[0]}_${studentId}`;
    const rec = appState.attendance[key];
    if (rec) {
      if (rec.status === 'present') genuineWeekDays++;
      else if (rec.status === 'bonus_used') bonusUsedCount++;
      else if (rec.status === 'teacher_leave') teacherLeaveCount++;
      else if (rec.status === 'absent') absentCount++;
    }
  }
  const totalWeekSessions = genuineWeekDays + bonusUsedCount;
  const hasShortFlag = absentCount > 0 && totalWeekSessions < 3;
  return { genuineWeekDays, bonusUsedCount, totalWeekSessions, teacherLeaveCount, absentCount, hasShortFlag };
}

function evaluateCertificateEligibility(student, refDateStr) {
  const genuineDays = Number(student.genuineDays || 0);
  const has48Genuine = genuineDays >= 48;
  const wk = getWeeklyStats(refDateStr, student.id);
  const { monStr, sunStr } = getWeekRange(refDateStr);
  const stuClips = (appState.audioClips || []).filter(c => c.rollNo.toUpperCase() === student.rollNo.toUpperCase());
  const weeklyClips = stuClips.filter(c => c.date >= monStr && c.date <= sunStr);
  const hasWeeklyAudio = weeklyClips.length >= 2 || stuClips.length >= 2;
  const hasWeeklyAttendance = wk.totalWeekSessions >= 3 || genuineDays >= 48;
  const eligible = has48Genuine && hasWeeklyAudio && hasWeeklyAttendance;
  return {
    eligible,
    genuineDays,
    has48Genuine,
    weeklyAudioCount: weeklyClips.length,
    totalAudioCount: stuClips.length,
    hasWeeklyAudio,
    weekSessions: wk.totalWeekSessions
  };
}

function getMonthsEnrolled(admissionDateStr) {
  if (!admissionDateStr) return 1;
  const start = new Date(admissionDateStr);
  const now = new Date();
  if (isNaN(start.getTime())) return 1;
  let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  if (now.getDate() >= start.getDate()) months += 1;
  return Math.max(1, months);
}

function getEffectiveConcession(student) {
  const months = getMonthsEnrolled(student.admissionDate);
  const period = Number(student.concessionMonths || 0);
  if (period > 0 && months > period) return 0;
  return Number(student.concession || 0);
}

function getStudentNetPayable(student) {
  const effConc = getEffectiveConcession(student);
  return Math.max(0, Number(student.monthlyFee || 0) - effConc + Number(student.idCardFee || 0) + Number(student.certFee || 0));
}

function getFamilySiblings(student) {
  const pPhone = (student.parentPhone || student.phone || '').replace(/\s+/g, '').trim();
  const pName = (student.guardian || '').trim().toLowerCase();
  return appState.students.filter(other => {
    const oPhone = (other.parentPhone || other.phone || '').replace(/\s+/g, '').trim();
    const oName = (other.guardian || '').trim().toLowerCase();
    if (pPhone && oPhone && pPhone === oPhone) return true;
    if (pName && oName && pName !== 'guardian' && pName !== 'guardian verified' && pName !== 'self / verified' && pName === oName) return true;
    return other.id === student.id;
  });
}

function getNextBillingDate(admissionDateStr) {
  if (!admissionDateStr) return '-';
  const start = new Date(admissionDateStr);
  if (isNaN(start.getTime())) return '-';
  const day = start.getDate();
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), day);
  if (next < now) next.setMonth(next.getMonth() + 1);
  return next.toISOString().split('T')[0];
}

function handleUnifiedLogin(e) {
  e.preventDefault();
  const roll = document.getElementById('loginRollInput').value.trim().toUpperCase();
  const pin = document.getElementById('loginPinInput').value.trim();

  const expectedAdminRoll = String(appState.adminRollNo || 'MUSICSNSOUNDS').trim().toUpperCase();
  const expectedAdminPin = String(appState.adminPin || '1995').trim();

  if (roll === expectedAdminRoll && pin === expectedAdminPin) {
    currentUser = { role: 'admin' };
    saveSession(currentUser);
    activeTab = 'dashboard';
    enterApp();
    return;
  }

  const stu = appState.students.find(s => s.rollNo.toUpperCase() === roll && String(s.pin) === pin);
  if (stu) {
    currentUser = { role: 'student', studentId: stu.id };
    saveSession(currentUser);
    activeTab = 'student_home';
    enterApp();
  } else {
    showLoginError('Invalid Roll Number or Access PIN.');
  }
}

function getAttendanceRecord(dateStr, studentId) {
  const key = `${dateStr}_${studentId}`;
  return appState.attendance[key] || { status: 'present', time: '06:30 PM', note: '' };
}

function setStudentAttendanceStatus(studentId, newStatus) {
  const key = `${selectedDate}_${studentId}`;
  const prev = getAttendanceRecord(selectedDate, studentId);
  const stu = appState.students.find(s => s.id === studentId);

  if (stu) {
    if (prev.status === 'present') stu.genuineDays = Math.max(0, (stu.genuineDays || 0) - 1);
    if (prev.status === 'teacher_leave') stu.bonusCredits = Math.max(0, (stu.bonusCredits || 0) - 1);
    if (prev.status === 'bonus_used') stu.bonusCredits = (stu.bonusCredits || 0) + 1;

    if (newStatus === 'present') stu.genuineDays = (stu.genuineDays || 0) + 1;
    if (newStatus === 'teacher_leave') stu.bonusCredits = (stu.bonusCredits || 0) + 1;
    if (newStatus === 'bonus_used') stu.bonusCredits = Math.max(0, (stu.bonusCredits || 0) - 1);

    const gradeIdx = Math.min(GRADES.length - 1, Math.floor(stu.genuineDays / 48));
    stu.grade = GRADES[gradeIdx];
  }

  appState.attendance[key] = {
    ...prev,
    status: newStatus,
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  };
  saveState();
  renderCurrentTab();
}

function updateAttendanceField(studentId, field, value) {
  const key = `${selectedDate}_${studentId}`;
  const prev = getAttendanceRecord(selectedDate, studentId);
  appState.attendance[key] = { ...prev, [field]: value };
  saveState();
}

function getFilteredStudents() {
  return appState.students.filter(s => filterBatch === 'ALL' || s.batch === filterBatch);
}

function applyBatchStatus(status) {
  getFilteredStudents().forEach(s => setStudentAttendanceStatus(s.id, status));
}

function toggleHolidayDate(dateStr) {
  if (!appState.holidays) appState.holidays = {};
  if (appState.holidays[dateStr]) delete appState.holidays[dateStr];
  else appState.holidays[dateStr] = true;
  saveState();
  renderCurrentTab();
  showToast(appState.holidays[dateStr] ? `Marked ${dateStr} as Holiday` : `Removed Holiday on ${dateStr}`);
}

function shiftCalendarMonth(delta) {
  const [y, m] = calendarMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  calendarMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  renderCurrentTab();
}

function selectDateFromCalendar(dateStr) {
  selectedDate = dateStr;
  attendanceSubView = 'register';
  renderCurrentTab();
}

function buildMonthlyCalendarHtml(studentFilterObj) {
  const [yr, mo] = calendarMonth.split('-').map(Number);
  const firstDay = new Date(yr, mo - 1, 1);
  const daysInMonth = new Date(yr, mo, 0).getDate();
  const startWeekday = firstDay.getDay(); // 0 Sun .. 6 Sat
  const monthLabel = firstDay.toLocaleString('default', { month: 'long', year: 'numeric' });
  const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  let cells = '';
  for (let i = 0; i < startWeekday; i++) {
    cells += `<div class="h-20 bg-slate-50/60 border border-slate-100 rounded-lg"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dt = `${yr}-${String(mo).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isHoliday = Boolean(appState.holidays && appState.holidays[dt]);
    const isSelected = dt === selectedDate;
    const isSunday = new Date(yr, mo - 1, day).getDay() === 0;

    if (studentFilterObj) {
      // Single Student Calendar View
      const rec = appState.attendance[`${dt}_${studentFilterObj.id}`];
      let badge = '';
      if (isHoliday) badge = `<span class="px-1.5 py-0.5 text-[9px] font-bold bg-purple-100 text-purple-800 rounded">HOLIDAY</span>`;
      else if (rec) {
        const map = {
          present: 'bg-emerald-100 text-emerald-800 border-emerald-200|PRESENT',
          absent: 'bg-red-100 text-red-800 border-red-200|ABSENT',
          teacher_leave: 'bg-amber-100 text-amber-800 border-amber-200|T-LEAVE',
          bonus_used: 'bg-indigo-100 text-indigo-800 border-indigo-200|BONUS',
          excused_leave: 'bg-slate-200 text-slate-800 border-slate-300|EXCUSED'
        };
        const [cls, lbl] = (map[rec.status] || 'bg-slate-100 text-slate-700|MARKED').split('|');
        badge = `<span class="px-1.5 py-0.5 text-[9px] font-bold border rounded ${cls}">${lbl}</span>`;
      }
      cells += `
        <div class="h-20 p-1.5 border rounded-lg flex flex-col justify-between ${isSelected ? 'border-[#0F172A] bg-slate-50' : 'border-slate-200 bg-white'}">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold ${isSunday ? 'text-red-600' : 'text-slate-700'}">${day}</span>
          </div>
          <div class="text-center">${badge}</div>
        </div>
      `;
    } else {
      // Admin Academy-Wide Calendar View
      let pCount = 0, aCount = 0, lCount = 0;
      appState.students.forEach(s => {
        const rec = appState.attendance[`${dt}_${s.id}`];
        if (rec) {
          if (rec.status === 'present' || rec.status === 'bonus_used') pCount++;
          else if (rec.status === 'absent') aCount++;
          else if (rec.status === 'teacher_leave') lCount++;
        }
      });
      const hasMarks = (pCount + aCount + lCount) > 0;
      cells += `
        <div onclick="selectDateFromCalendar('${dt}')" class="h-24 p-1.5 border rounded-lg flex flex-col justify-between cursor-pointer transition hover:border-[#0F172A] ${isSelected ? 'border-2 border-[#0F172A] bg-indigo-50/30' : isHoliday ? 'border-purple-200 bg-purple-50/40' : 'border-slate-200 bg-white'}">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold ${isSunday ? 'text-red-600' : 'text-slate-800'}">${day}</span>
            <button type="button" onclick="event.stopPropagation(); toggleHolidayDate('${dt}')" title="Toggle Holiday" class="text-[9px] px-1 rounded ${isHoliday ? 'bg-purple-700 text-white font-bold' : 'text-slate-400 hover:bg-slate-100'}">
              ${isHoliday ? 'HOL' : 'H'}
            </button>
          </div>
          <div class="space-y-0.5 text-[9px] font-semibold tabular-nums">
            ${isHoliday ? '<div class="text-purple-700 font-bold text-center">Holiday</div>' : ''}
            ${hasMarks ? `
              <div class="flex justify-between text-emerald-700"><span>Present:</span><span>${pCount}</span></div>
              ${aCount > 0 ? `<div class="flex justify-between text-red-600"><span>Absent:</span><span>${aCount}</span></div>` : ''}
              ${lCount > 0 ? `<div class="flex justify-between text-amber-700"><span>T-Leave:</span><span>${lCount}</span></div>` : ''}
            ` : (!isHoliday ? '<div class="text-slate-300 text-center">&mdash;</div>' : '')}
          </div>
        </div>
      `;
    }
  }

  return `
    <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3">
      <div class="flex items-center justify-between">
        <button type="button" onclick="shiftCalendarMonth(-1)" class="px-3 py-1.5 text-xs font-semibold border border-slate-300 rounded-lg hover:bg-slate-50">&larr; Prev</button>
        <h3 class="text-sm font-bold text-[#0F172A] uppercase tracking-wide">${monthLabel}</h3>
        <button type="button" onclick="shiftCalendarMonth(1)" class="px-3 py-1.5 text-xs font-semibold border border-slate-300 rounded-lg hover:bg-slate-50">Next &rarr;</button>
      </div>
      <div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-bold text-slate-500 uppercase">
        ${weekdays.map(w => `<div>${w}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1.5">
        ${cells}
      </div>
    </div>
  `;
}

function processQrPayload(rawText) {
  if (!rawText) return false;
  let clean = rawText.trim().toUpperCase();
  if (clean.includes('VERIFY=')) {
    clean = clean.split('VERIFY=')[1].split('&')[0];
  } else if (clean.includes('/')) {
    clean = clean.split('/').pop();
  }
  const stu = appState.students.find(s =>
    s.rollNo.toUpperCase() === clean ||
    s.rollNo.toUpperCase().endsWith('-' + clean)
  );
  if (stu) {
    setStudentAttendanceStatus(stu.id, 'present');
    showToast(`Checked In: ${stu.name} (${stu.rollNo})`);
    return true;
  }
  showToast(`Roll not found: ${clean}`);
  return false;
}

function handleQuickQrCheckIn(e) {
  e.preventDefault();
  const inp = document.getElementById('qrQuickScanInput');
  if (processQrPayload(inp.value)) inp.value = '';
}

function openCameraQrScanner() {
  showModal(`
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-[#0F172A]">Camera QR Attendance Scanner</h3>
        <button onclick="stopQrCamera(); closeModal();" class="text-xs font-semibold text-slate-500 hover:text-slate-900">Close</button>
      </div>
      <div id="qrReaderBox" class="w-full rounded-lg overflow-hidden border border-slate-300 bg-slate-900 min-h-[260px]"></div>
      <p class="text-[11px] text-slate-500 text-center">Point camera at Student ID Card QR Code</p>
    </div>
  `);
  setTimeout(() => {
    try {
      html5QrScanner = new Html5Qrcode("qrReaderBox");
      html5QrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          if (processQrPayload(decodedText)) {
            stopQrCamera();
            closeModal();
          }
        },
        () => {}
      ).catch(() => {
        showToast('Camera permission denied or unavailable on this device');
      });
    } catch (err) {
      showToast('Scanner unavailable');
    }
  }, 150);
}

function stopQrCamera() {
  if (html5QrScanner) {
    try { html5QrScanner.stop().catch(() => {}); } catch (e) {}
    html5QrScanner = null;
  }
}

function uploadTemplateImage(e, stateField) {
  const file = e.target.files[0];

  reader.onload = function(ev) {
    appState[stateField] = ev.target.result;
    saveState();

  reader.readAsDataURL(file);
}

function recalcMultiCourseFee(container) {
  const checked = [...container.querySelectorAll('input[name="selectedCourses"]:checked')];
  let totalFee = 0;
  let totalDisc = 0;
  checked.forEach(cb => {
    const crs = appState.courses.find(x => x.name === cb.value);
    if (crs) {
      totalFee += Number(crs.fee || 0);
      totalDisc += Number(crs.discount || 0);
    }
  });
  const feeInp = container.querySelector('[name="monthlyFee"]');
  const discInp = container.querySelector('[name="concession"]');
  if (feeInp && checked.length > 0) feeInp.value = totalFee;
  if (discInp && checked.length > 0) discInp.value = totalDisc;
}

function uploadCustomBrochure(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    appState.customBrochureDataUrl = ev.target.result;
    appState.customBrochureName = file.name;
    saveState();
    renderCurrentTab();
    showToast(`Uploaded brochure: ${file.name}`);
  };
  reader.readAsDataURL(file);
}

async function downloadCombinedStandardReceiptPdf(studentIds) {
  const targets = appState.students.filter(x => studentIds.includes(x.id));
  if (!targets.length) return;

  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
  const fontReg = await pdfDoc.embedFont(StandardFonts.Helvetica);

  const p = pdfDoc.addPage([420, 595]);
  p.drawRectangle({ x: 18, y: 18, width: 384, height: 559, borderColor: rgb(0.75, 0.78, 0.84), borderWidth: 1 });
  p.drawRectangle({ x: 18, y: 572, width: 384, height: 5, color: rgb(0.06, 0.09, 0.16) });

  p.drawText('B. S. TIKARIYA CULTURAL FOUNDATION', { x: 105, y: 548, size: 8.5, font: fontBold, color: rgb(0.28, 0.33, 0.41) });

  drawStyledAcademyTitlePdf(p, 85, 515, 14.5, fontBold);

  const isFamily = targets.length > 1;
  const receiptNo = `TSM-RCP-${Date.now().toString().slice(-6)}`;
  p.drawText(isFamily ? 'CONSOLIDATED FAMILY FEE RECEIPT' : 'OFFICIAL FEE RECEIPT', {
    x: isFamily ? 120 : 155, y: 496, size: 8.5, font: fontBold, color: rgb(0.28, 0.33, 0.41)
  });

  const primary = targets[0];
  p.drawText(`Receipt No: ${receiptNo}`, { x: 32, y: 476, size: 8, font: fontBold, color: rgb(0.06, 0.09, 0.16) });
  p.drawText(`Date: ${selectedDate}`, { x: 310, y: 476, size: 8, font: fontReg, color: rgb(0.28, 0.33, 0.41) });
  p.drawText(`Parent / Guardian: ${primary.guardian} (${primary.parentPhone || primary.phone})`, {
    x: 32, y: 462, size: 8.5, font: fontBold, color: rgb(0.06, 0.09, 0.16)
  });

  p.drawLine({ start: { x: 32, y: 452 }, end: { x: 388, y: 452 }, thickness: 0.7, color: rgb(0.75, 0.78, 0.84) });

  let y = 436;
  let grandTotal = 0;

  targets.forEach((stu, index) => {
    const effConc = getEffectiveConcession(stu);
    const subTotal = getStudentNetPayable(stu);

    p.drawText(`${index + 1}. ${stu.name} (${stu.rollNo}) — ${stu.grade}`, {
      x: 32, y, size: 8.5, font: fontBold, color: rgb(0.06, 0.09, 0.16)

    const courseList = Array.isArray(stu.courses) && stu.courses.length ? stu.courses : [stu.course];
    p.drawText(`   Courses: ${courseList.join(' + ')}`, {
      x: 32, y, size: 8, font: fontReg, color: rgb(0.26, 0.22, 0.79)
    });
    y -= 13;

    p.drawText(`   Fee: INR ${stu.monthlyFee} | Conc: -INR ${effConc} | ID/Cert: INR ${stu.idCardFee + stu.certFee} | ${stu.feeStatus} (${stu.lastPaymentMode})`, {
      x: 32, y, size: 7.5, font: fontReg, color: rgb(0.28, 0.33, 0.41)
    });
    p.drawText(`INR ${subTotal}`, { x: 342, y, size: 8.5, font: fontBold, color: rgb(0.06, 0.09, 0.16) });
    y -= 18;
  });

  p.drawLine({ start: { x: 32, y: y + 4 }, end: { x: 388, y: y + 4 }, thickness: 0.8, color: rgb(0.06, 0.09, 0.16) });
  y -= 12;
  p.drawText('GRAND TOTAL:', { x: 32, y, size: 9.5, font: fontBold, color: rgb(0.06, 0.09, 0.16) });
  p.drawText(`INR ${grandTotal}`, { x: 332, y, size: 10, font: fontBold, color: rgb(0.72, 0.11, 0.11) });

  y -= 24;
  targets.forEach(stu => {
    p.drawText(`${stu.rollNo}: ${stu.genuineDays} Genuine Days (${stu.genuineDays % 48}/48) | Bonus Credits: ${stu.bonusCredits}`, {
      x: 32, y, size: 7.5, font: fontReg, color: rgb(0.35, 0.4, 0.48)
    });
    y -= 12;
  });

  p.drawText("Authorized Signatory — TIKARIYA'S SCHOOL OF MUSIC", { x: 185, y: 34, size: 7.5, font: fontBold, color: rgb(0.28, 0.33, 0.41) });

  const bytes = await pdfDoc.save({ useObjectStreams: true });
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = isFamily ? `TSM_Family_Receipt_${primary.guardian.replace(/\s+/g, '_')}.pdf` : `TSM_Receipt_${primary.rollNo}.pdf`;
  link.click();
}

function sendWhatsAppFeeAlert(stuId) {
  const s = appState.students.find(x => x.id === stuId);
  const siblings = getFamilySiblings(s);
  const totalFamily = siblings.reduce((acc, item) => acc + getStudentNetPayable(item), 0);
  const targetPhone = s.parentPhone || s.phone;
  const namesStr = siblings.map(x => `${x.name} (${x.course})`).join(', ');

function generateAutoAudioClipName(stu) {
  const sameDayCount = (appState.audioClips || []).filter(c => c.rollNo === stu.rollNo && c.date === selectedDate).length + 1;
  const safeName = stu.name.trim().replace(/\s+/g, '_');
  const safeCourse = (stu.courses?.[0] || stu.course || 'Practice').trim().replace(/[^a-zA-Z0-9]+/g, '_');
  return `${stu.rollNo}_${safeName}_${safeCourse}_${selectedDate}_Clip${sameDayCount}`;
}

async function toggleInAppAudioRecord(stuId) {
  const stu = appState.students.find(x => x.id === stuId);
  if (!stu) return;

  if (isRecordingAudio) {
    stopAudioRecording(false);
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        sampleRate: 16000,
        echoCancellation: true,
        noiseSuppression: true
      }
    });

    recordedChunks = [];
    recordedAudioDataUrl = '';
    recordedDurationSec = 0;

    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
    const options = mimeType ? { mimeType, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 };
    mediaRecorder = new MediaRecorder(stream, options);

    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const reader = new FileReader();
      reader.onload = ev => {
        recordedAudioDataUrl = ev.target.result;
        const sizeKb = Math.round(blob.size / 1024);
        showToast(`Recorded ${recordedDurationSec}s (${sizeKb} KB)`);
        renderCurrentTab();
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start();
    isRecordingAudio = true;
    renderCurrentTab();

    recordingTimerInterval = setInterval(() => {
      recordedDurationSec++;
      const timerEl = document.getElementById('recTimerText');
      if (timerEl) timerEl.textContent = `${recordedDurationSec}s / 45s`;
      if (recordedDurationSec >= 45) {
        stopAudioRecording(false);
      }
    }, 1000);
  } catch (err) {
    showToast('Microphone access denied or unavailable');
  }
}

function stopAudioRecording(discard) {
  if (recordingTimerInterval) {
    clearInterval(recordingTimerInterval);
    recordingTimerInterval = null;
  }
  isRecordingAudio = false;
  if (discard) {
    recordedChunks = [];
    recordedAudioDataUrl = '';
    recordedDurationSec = 0;
  }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch (e) {}
  }
}

function submitRecordedAudioClip(stuId) {
  const stu = appState.students.find(x => x.id === stuId);
  if (!stu || !recordedAudioDataUrl) return;
  const titleInp = document.getElementById('autoAudioTitleInput');

  appState.audioClips.unshift({

  });

  recordedAudioDataUrl = '';

}

function renderSargamCanvasPreview() {
  const canvas = document.getElementById('sargamPreviewCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = 'bold 11px Inter, sans-serif';
  ctx.fillStyle = '#0F172A';
  const p1 = "TIKARIYA'S SCHOOL OF ";
  ctx.fillText(p1, 16, 22);
  const w1 = ctx.measureText(p1).width;
  ctx.fillStyle = '#B91C1C';
  ctx.fillText("M", 16 + w1, 22);
  const w2 = ctx.measureText("M").width;
  ctx.fillStyle = '#0F172A';
  ctx.fillText("USIC", 16 + w1 + w2, 22);

  ctx.strokeStyle = '#CBD5E1';
  ctx.beginPath();
  ctx.moveTo(16, 30);
  ctx.lineTo(424, 30);
  ctx.stroke();

  const text = (document.getElementById('sargamTextArea')?.value || '').split('\n');
  let y = 62;
  text.forEach(line => {
    if (loadedCustomFont) {
      const path = loadedCustomFont.getPath(line, 18, y, 22);
      path.fill = '#0F172A';
      path.draw(ctx);
    } else {
      ctx.fillStyle = '#0F172A';
      ctx.font = '16px monospace';
      ctx.fillText(line, 18, y);
    }
    y += 30;
  });

  if (attachedDiagrams.length > 0) {
    const kx = 18, ky = y + 2, kw = 18, kh = 50;
    for (let i = 0; i < 14; i++) {
      ctx.strokeStyle = '#0F172A';
      ctx.strokeRect(kx + i * kw, ky, kw, kh);
    }
    const blackOffsets = [0, 1, 3, 4, 5, 7, 8, 10, 11, 12];
    blackOffsets.forEach(idx => {
      ctx.fillStyle = '#0F172A';
      ctx.fillRect(kx + idx * kw + 12, ky, 11, 30);
    });
  }

  if (attachedImageDataUrl) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 290, 130, 130, 95);
    img.src = attachedImageDataUrl;
  }
}

function uploadStudentPhoto(e, stuId) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const s = appState.students.find(x => x.id === stuId);
    s.photoDataUrl = ev.target.result;
    saveState();
    renderCurrentTab();
    showToast('Photo updated');
  };
  reader.readAsDataURL(file);
}

function updateStudentField(stuId, field, val) {
  const s = appState.students.find(x => x.id === stuId);
  if (!s) return;
  if (field === 'pin' && val.trim().length < 4) return;
  s[field] = val.trim();
  saveState();
  showToast('Profile updated');
}

function sendStudentMessage(e, rollNo) {
  e.preventDefault();
  const inp = document.getElementById('stuMsgInput');
  appState.messages.push({
    id: 'm_' + Date.now(),
    rollNo,
    sender: 'Student',
    text: inp.value.trim(),
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });
  inp.value = '';
  saveState();
  renderCurrentTab();
}

async function exportDailyAttendancePdf() {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
  const fontReg = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const page = pdfDoc.addPage([595.28, 841.89]);

  page.drawText('B. S. TIKARIYA CULTURAL FOUNDATION (CIN: U88900MH2025NPL454435)', { x: 50, y: 790, size: 9, font: fontBold, color: rgb(0.3, 0.35, 0.45) });
  drawStyledAcademyTitlePdf(page, 50, 768, 15, fontBold);
  page.drawText(`Daily Attendance Register (${selectedDate})`, { x: 50, y: 750, size: 10.5, font: fontBold, color: rgb(0.28, 0.33, 0.41) });

  let y = 720;
  getFilteredStudents().forEach(s => {
    const rec = getAttendanceRecord(selectedDate, s.id);
    const wk = getWeeklyStats(selectedDate, s.id);
    page.drawText(`${s.rollNo} | ${s.name} | ${s.course} | ${rec.status.toUpperCase()} | Wk:${wk.totalWeekSessions}/3${wk.hasShortFlag?'*':''} | Gen:${s.genuineDays % 48}/48`, {
      x: 50, y, size: 9, font: fontReg, color: rgb(0.1, 0.12, 0.18)
    });
    y -= 20;
  });

  const bytes = await pdfDoc.save();
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `TSM_Attendance_${selectedDate}.pdf`;
  link.click();
}

  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBackdrop').classList.remove('hidden');
}

function closeModal() {
  stopQrCamera();
  document.getElementById('modalBackdrop').classList.add('hidden');
}

initPwaIconsAndManifest();
checkPublicQrVerify();
if (currentUser && !window.location.search.includes('verify=') && !window.location.search.includes('cert=')) {
  enterApp();
}
initFirebaseAuto();
</script>
