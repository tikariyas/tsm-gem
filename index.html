function stopRecLevelMeter() {
  if (recMeterRafId) {
    cancelAnimationFrame(recMeterRafId);
    recMeterRafId = null;
  }
  recAnalyserNode = null;
  if (recMeterAudioCtx) {
    try { recMeterAudioCtx.close(); } catch (_) {}
    recMeterAudioCtx = null;
  }
  const bar = document.getElementById('recLevelBarFill');
  if (bar) bar.style.width = '0%';
}

function startRecLevelMeterLoop() {
  if (!recAnalyserNode) return;
  const data = new Uint8Array(recAnalyserNode.fftSize);
  const tick = () => {
    if (!isRecordingAudio || !recAnalyserNode) {
      recMeterRafId = null;
      return;
    }
    recAnalyserNode.getByteTimeDomainData(data);
    let sumSq = 0;
    for (let i = 0; i < data.length; i++) {
      const v = (data[i] - 128) / 128;
      sumSq += v * v;
    }
    const rms = Math.sqrt(sumSq / data.length);
    const pct = Math.min(100, Math.max(4, Math.round(rms * 320)));
    const bar = document.getElementById('recLevelBarFill');
    if (bar) {
      bar.style.width = pct + '%';
      bar.style.backgroundColor = pct > 82 ? '#EF4444' : pct > 45 ? '#22C55E' : '#3B82F6';
    }
    recMeterRafId = requestAnimationFrame(tick);
  };
  recMeterRafId = requestAnimationFrame(tick);
}

function cleanupRecAudioMix() {
  stopRecLevelMeter();
  if (typeof recMixCleanup === 'function') {
    try { recMixCleanup(); } catch (_) {}
    recMixCleanup = null;
  }
}

function getPreferredAudioRecorderMime() {
  if (typeof MediaRecorder === 'undefined' || typeof MediaRecorder.isTypeSupported !== 'function') return '';
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4',
    'audio/ogg;codecs=opus'
  ];
  for (const m of candidates) {
    try {
      if (MediaRecorder.isTypeSupported(m)) return m;
    } catch (_) {}
  }
  return '';
}

function createSafeMediaRecorder(primaryStream, fallbackStream) {
  const mimeType = getPreferredAudioRecorderMime();
  const attempts = [];
  if (mimeType) attempts.push([primaryStream, { mimeType, audioBitsPerSecond: 24000 }]);
  if (mimeType) attempts.push([primaryStream, { mimeType }]);
  attempts.push([primaryStream, { audioBitsPerSecond: 24000 }]);
  attempts.push([primaryStream, null]);
  if (fallbackStream && fallbackStream !== primaryStream) {
    if (mimeType) attempts.push([fallbackStream, { mimeType }]);
    attempts.push([fallbackStream, null]);
  }
  let lastErr = null;
  for (const [s, opts] of attempts) {
    try {
      return opts ? new MediaRecorder(s, opts) : new MediaRecorder(s);
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('MediaRecorder unavailable');
}

async function acquireMicrophoneStream() {
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    const err = new Error('Microphone API unavailable');
    err.name = 'UnsupportedContextError';
    throw err;
  }
  try {
    return await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: false,
        autoGainControl: false
      }
    });
  } catch (err) {
    if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError' || err.name === 'SecurityError')) {
      throw err;
    }
    return await navigator.mediaDevices.getUserMedia({ audio: true });
  }
}

function formatMicErrorMessage(err) {
  const name = err && err.name ? err.name : '';
  if (name === 'UnsupportedContextError') {
    return 'In-app microphone requires HTTPS or a modern browser. You can still use Upload Audio Clip below.';
  }
  if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
    return 'Microphone permission was blocked. Allow microphone access in browser/app permissions and tap Start Recording again, or use Upload Audio Clip.';
  }
  if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
    return 'No microphone was found on this device. Connect a mic or use Upload Audio Clip.';
  }
  if (name === 'NotReadableError' || name === 'TrackStartError') {
    return 'Microphone is currently busy in another app. Close other audio apps and retry.';
  }
  return 'Could not start microphone recording on this browser. Please retry or use Upload Audio Clip.';
}

async function toggleInAppAudioRecord(stuId) {
  const stu = appState.students.find(x => x.id === stuId);
  if (!stu) return;

  if (isRecordingAudio) {
    stopAudioRecording(false);
    return;
  }

  recErrorMessage = '';
  let micStream = null;
  try {
    micStream = await acquireMicrophoneStream();

    recordedChunks = [];
    recordedAudioDataUrl = '';
    recordedDurationSec = 0;
    discardAudioOnStop = false;
    metronomeAutoStartedByRec = false;

    // Auto-start metronome if student enabled sync and metronome isn't already running
    const metroWasPlaying = typeof metronomeState !== 'undefined' && metronomeState.isPlaying;
    if (recordAutoStartMetronome && !metroWasPlaying && typeof startMetronome === 'function') {
      await startMetronome();
      metronomeAutoStartedByRec = true;
    }

    const metroNowPlaying = typeof metronomeState !== 'undefined' && metronomeState.isPlaying;
    recordedMetronomeMeta = metroNowPlaying
      ? `${metronomeState.beatsPerBar}/${metronomeState.beatUnit} · ${metronomeState.bpm} BPM`
      : '';

    // Build recording stream: mix live Web Audio metronome click with mic if enabled, plus drive VU level meter
    let recordStream = micStream;
    cleanupRecAudioMix();
    try {
      const audioCtx = typeof ensureMetronomeAudio === 'function' ? ensureMetronomeAudio() : null;
      if (audioCtx) {
        const micSource = audioCtx.createMediaStreamSource(micStream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        micSource.connect(analyser);
        recAnalyserNode = analyser;

        let micGain = null;
        let metroTapGain = null;
        if (recordMixMetronome && typeof audioCtx.createMediaStreamDestination === 'function' && metronomeMakeupGain) {
          const mixDest = audioCtx.createMediaStreamDestination();
          micGain = audioCtx.createGain();
          micGain.gain.setValueAtTime(1.15, audioCtx.currentTime);
          micSource.connect(micGain);
          micGain.connect(mixDest);

          metroTapGain = audioCtx.createGain();
          metroTapGain.gain.setValueAtTime(0.42, audioCtx.currentTime);
          metronomeMakeupGain.connect(metroTapGain);
          metroTapGain.connect(mixDest);

          recordStream = mixDest.stream;
        }
        recMixCleanup = () => {
          try { micSource.disconnect(); } catch (_) {}
          try { if (micGain) micGain.disconnect(); } catch (_) {}
          try { if (metroTapGain && metronomeMakeupGain) metronomeMakeupGain.disconnect(metroTapGain); } catch (_) {}
          try { if (metroTapGain) metroTapGain.disconnect(); } catch (_) {}
        };
      }
    } catch (mixErr) {
      console.warn('Metronome-mic mix fallback to mic only:', mixErr);
      recordStream = micStream;
    }

    mediaRecorder = createSafeMediaRecorder(recordStream, micStream);

    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      cleanupRecAudioMix();
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (metronomeAutoStartedByRec && typeof stopMetronome === 'function') {
        stopMetronome();
      }
      metronomeAutoStartedByRec = false;

      if (discardAudioOnStop) {
        discardAudioOnStop = false;
        recordedChunks = [];
        recordedAudioDataUrl = '';
        recordedDurationSec = 0;
        recordedMetronomeMeta = '';
        if (typeof refreshStudentAudioPanels === 'function') refreshStudentAudioPanels(stuId);
        return;
      }

      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const reader = new FileReader();
      reader.onload = ev => {
        recordedAudioDataUrl = ev.target.result;
        const sizeKb = Math.round(blob.size / 1024);
        showToast(`Recorded ${recordedDurationSec}s (${sizeKb} KB)`);
        if (typeof refreshStudentAudioPanels === 'function') refreshStudentAudioPanels(stuId);
        else renderCurrentTab();
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start(250);
    isRecordingAudio = true;
    if (typeof refreshStudentAudioPanels === 'function') refreshStudentAudioPanels(stuId);
    else renderCurrentTab();
    startRecLevelMeterLoop();

    recordingTimerInterval = setInterval(() => {
      recordedDurationSec++;
      const timerEl = document.getElementById('recTimerText');
      if (timerEl) timerEl.textContent = `${recordedDurationSec}s / 45s`;
      const recHdrEl = document.getElementById('recHeaderStatusText');
      if (recHdrEl) recHdrEl.textContent = `REC · ${recordedDurationSec}s / 45s`;
      const progEl = document.getElementById('recProgressFill');
      if (progEl) progEl.style.width = `${Math.min(100, Math.round((recordedDurationSec / 45) * 100))}%`;
      if (recordedDurationSec >= 45) {
        stopAudioRecording(false);
      }
    }, 1000);
  } catch (err) {
    console.warn('In-app audio recording error:', err);
    if (micStream) {
      try { micStream.getTracks().forEach(t => t.stop()); } catch (_) {}
    }
    cleanupRecAudioMix();
    if (metronomeAutoStartedByRec && typeof stopMetronome === 'function') {
      stopMetronome();
      metronomeAutoStartedByRec = false;
    }
    recErrorMessage = formatMicErrorMessage(err);
    showToast(recErrorMessage);
    if (typeof refreshStudentAudioPanels === 'function') refreshStudentAudioPanels(stuId);
  }
}

function uploadStudentPracticeAudioFile(e, stuId) {
  const input = e.target;
  const file = input && input.files && input.files[0];
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) {
    showToast('Audio file is too large (max 4 MB). Please record or trim a shorter clip.');
    input.value = '';
    return;
  }
  recErrorMessage = '';
  const reader = new FileReader();
  reader.onload = ev => {
    recordedAudioDataUrl = ev.target.result;
    recordedDurationSec = 0;
    recordedMetronomeMeta = (typeof metronomeState !== 'undefined')
      ? `${metronomeState.beatsPerBar}/${metronomeState.beatUnit} · ${metronomeState.bpm} BPM`
      : '';
    showToast(`Loaded audio clip (${Math.round(file.size / 1024)} KB)`);
    if (typeof refreshStudentAudioPanels === 'function') refreshStudentAudioPanels(stuId);
    else renderCurrentTab();
    input.value = '';
  };
  reader.onerror = () => {
    showToast('Could not read audio file.');
    input.value = '';
  };
  reader.readAsDataURL(file);
}

function stopAudioRecording(discard) {
  if (recordingTimerInterval) {
    clearInterval(recordingTimerInterval);
    recordingTimerInterval = null;
  }
  isRecordingAudio = false;
  if (discard) {
    discardAudioOnStop = true;
    recordedChunks = [];
    recordedAudioDataUrl = '';
    recordedDurationSec = 0;
    recordedMetronomeMeta = '';
  }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch (e) {}
  } else {
    cleanupRecAudioMix();
    if (metronomeAutoStartedByRec && typeof stopMetronome === 'function') {
      stopMetronome();
      metronomeAutoStartedByRec = false;
    }
  }
}

function discardStudentRecordedClip(stuId) {
  recErrorMessage = '';
  stopAudioRecording(true);
  if (typeof refreshStudentAudioPanels === 'function') refreshStudentAudioPanels(stuId);
  else renderCurrentTab();
}

function submitRecordedAudioClip(stuId) {
  const stu = appState.students.find(x => x.id === stuId);
  if (!stu || !recordedAudioDataUrl) return;
  const titleInp = document.getElementById('autoAudioTitleInput');
  const autoTitle = titleInp ? titleInp.value.trim() : generateAutoAudioClipName(stu);

  appState.audioClips.unshift({
    id: 'aud_' + Date.now(),
    rollNo: stu.rollNo,
    studentName: stu.name,
    title: autoTitle || generateAutoAudioClipName(stu),
    date: selectedDate,
    dataUrl: recordedAudioDataUrl,
    metronomeMeta: recordedMetronomeMeta || '',
    status: 'Submitted',
    approvedAt: null,
    feedback: ''
  });

  recordedAudioDataUrl = '';
  recordedChunks = [];
  recordedDurationSec = 0;
  recordedMetronomeMeta = '';
  dispatchPushAlert('ADMIN', "TIKARIYA'S SCHOOL OF MUSIC", `${stu.name} (${stu.rollNo}) submitted a practice audio clip.`);
  saveState();
  if (typeof refreshStudentAudioPanels === 'function') refreshStudentAudioPanels(stuId, true);
  else renderCurrentTab();
  showToast('Practice recording submitted');
}

async function downloadStudentWatermarkedVaultPdf(vaultId, stuId) {
  const s = appState.students.find(x => x.id === stuId) || appState.students[0];
  const v = (appState.vaultItems || []).find(x => x.id === vaultId);
  if (!v || !s) return;

  const safeFileName = `TSM_${String(v.title || 'Material').replace(/[^a-zA-Z0-9_-]+/g, '_')}_${s.rollNo}.pdf`;
  showToast('Fetching study material PDF...');

  // 1. Load actual uploaded PDF from all available stores (inline -> IndexedDB/Firestore tsm_blobs -> localStorage -> tsm_vault_files)
  let pdfDataUrl = v.pdfDataUrl || '';
  if (!pdfDataUrl) {
    pdfDataUrl = await tsmLoadBlob(vaultId);
  }
  if (!pdfDataUrl) {
    try { pdfDataUrl = localStorage.getItem('tsm_pdf_' + vaultId) || ''; } catch (e) {}
  }
  if (!pdfDataUrl) {
    const fsDb = await ensureFirestoreReady();
    if (fsDb) {
      try {
        const doc = await fsDb.collection('tsm_vault_files').doc(vaultId).get();
        if (doc.exists && doc.data().pdfDataUrl) pdfDataUrl = doc.data().pdfDataUrl;
      } catch (e) {}
    }
  }

  if (!pdfDataUrl) {
    showToast('PDF file not synced to cloud yet. Please ask your instructor to re-upload it in Studio.');
    return;
  }

  let rawBytes = null;
  try {
    rawBytes = dataUrlToUint8Array(pdfDataUrl);
  } catch (e) {
    console.warn('Base64 decode warning:', e);
    await triggerSafeDownloadFromDataUrl(pdfDataUrl, safeFileName);
    showToast('Downloaded study material PDF');
    return;
  }

  // 2. Try merging cover page + student watermark on every uploaded page; if PDF cannot be rewritten, download the real uploaded PDF directly
  try {
    showToast('Applying student watermark to study material...');
    const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
    const srcDoc = await PDFDocument.load(rawBytes, { ignoreEncryption: true });
    const pageIndices = srcDoc.getPageIndices();
    if (!pageIndices.length) {
      throw new Error('Source PDF has zero readable pages');
    }

    const outDoc = await PDFDocument.create();
    const fontBold = await outDoc.embedFont(StandardFonts.HelveticaBold);
    const fontReg = await outDoc.embedFont(StandardFonts.Helvetica);

    // Official Personalized Cover Page
    const cover = outDoc.addPage([595.28, 841.89]);
    cover.drawRectangle({ x: 36, y: 36, width: 523.28, height: 769.89, borderColor: rgb(0.06, 0.09, 0.16), borderWidth: 1.5 });
    cover.drawRectangle({ x: 36, y: 799.89, width: 523.28, height: 6, color: rgb(0.06, 0.09, 0.16) });
    cover.drawText('B. S. TIKARIYA CULTURAL FOUNDATION', { x: 185, y: 755, size: 10, font: fontBold, color: rgb(0.28, 0.33, 0.41) });
    cover.drawText('CIN: U88900MH2025NPL454435', { x: 225, y: 740, size: 8.5, font: fontReg, color: rgb(0.39, 0.45, 0.55) });
    drawStyledAcademyTitlePdf(cover, 148, 710, 18, fontBold);
    cover.drawText(sanitizePdfText((v.category || 'OFFICIAL STUDY MATERIAL').toUpperCase()), { x: 215, y: 675, size: 9.5, font: fontBold, color: rgb(0.26, 0.22, 0.79) });
    cover.drawText(sanitizePdfText(v.title || 'Study Material'), { x: 64, y: 615, size: 18, font: fontBold, color: rgb(0.06, 0.09, 0.16) });
    cover.drawText(sanitizePdfText(`Course: ${v.targetCourse || v.course || 'All Courses'}`), { x: 64, y: 585, size: 11, font: fontBold, color: rgb(0.26, 0.22, 0.79) });
    cover.drawText(sanitizePdfText(`Issued To Student: ${s.name} (Roll No: ${s.rollNo})`), { x: 64, y: 550, size: 12, font: fontBold, color: rgb(0.06, 0.09, 0.16) });
    cover.drawText(sanitizePdfText(`Grade: ${s.grade} - ${s.course} | Batch: ${s.batch}`), { x: 64, y: 530, size: 10, font: fontReg, color: rgb(0.28, 0.33, 0.41) });
    cover.drawText(sanitizePdfText(`${s.name} (${s.rollNo}) - TIKARIYA'S SCHOOL OF MUSIC`), {
      x: 95, y: 320, size: 15, font: fontBold, color: rgb(0.75, 0.78, 0.82), opacity: 0.32, rotate: degrees(35)
    });

    const copiedPages = await outDoc.copyPages(srcDoc, pageIndices);
    const wmText = sanitizePdfText(`${s.name} (${s.rollNo}) - TIKARIYA'S SCHOOL OF MUSIC`);
    copiedPages.forEach(cp => {
      try {
        const { width, height } = cp.getSize();
        cp.drawText(wmText, {
          x: Math.max(36, width * 0.14),
          y: Math.max(120, height * 0.42),
          size: Math.min(16, Math.max(11, width / 38)),
          font: fontBold,
          color: rgb(0.72, 0.75, 0.80),
          opacity: 0.28,
          rotate: degrees(35)
        });
      } catch (wmErr) {
        console.warn('Watermark draw skipped on page:', wmErr);
      }
      outDoc.addPage(cp);
    });

    const bytes = await outDoc.save();
    triggerBlobDownload(new Blob([bytes], { type: 'application/pdf' }), safeFileName);
    showToast(`Downloaded ${v.title} (${copiedPages.length} pages + cover)`);
  } catch (mergeErr) {
    console.warn('PDF merge fallback to original uploaded PDF:', mergeErr);
    // CRITICAL: Never hand the student only an empty wrapper — download the real uploaded PDF directly!
    triggerBlobDownload(new Blob([rawBytes], { type: 'application/pdf' }), safeFileName);
    showToast(`Downloaded ${v.title}`);
  }
}

function saveStudentSecurityPin(e, stuId) {
  e.preventDefault();
  const s = appState.students.find(x => x.id === stuId);
  if (!s) return;
  const fd = new FormData(e.target);
  const newPin = String(fd.get('newPin') || '').trim();
  const confirmPin = String(fd.get('confirmPin') || '').trim();
  const errEl = document.getElementById('secPinError');

  if (newPin.length < 4) {
    if (errEl) { errEl.textContent = 'PIN must be at least 4 characters.'; errEl.classList.remove('hidden'); }
    return;
  }
  if (newPin === '1234') {
    if (errEl) { errEl.textContent = 'Please choose a new PIN different from 1234.'; errEl.classList.remove('hidden'); }
    return;
  }
  if (newPin !== confirmPin) {
    if (errEl) { errEl.textContent = 'PINs do not match. Please re-enter.'; errEl.classList.remove('hidden'); }
    return;
  }

  s.pin = newPin;
  s.pinChanged = true;
  saveState();
  showToast('Access PIN updated successfully');
  openStudentSecurityPopup(stuId);
}

function saveStudentProfileModal(e, stuId) {
  e.preventDefault();
  const s = appState.students.find(x => x.id === stuId);
  if (!s) return;
  const fd = new FormData(e.target);

  const newPin = String(fd.get('newPin') || '').trim();
  const confirmPin = String(fd.get('confirmPin') || '').trim();
  if (newPin) {
    if (newPin.length < 4) {
      showToast('PIN must be at least 4 characters');
      return;
    }
    if (newPin === '1234') {
      showToast('Please choose a PIN different from 1234');
      return;
    }
    if (newPin !== confirmPin) {
      showToast('New PIN and Confirm PIN do not match');
      return;
    }
    s.pin = newPin;
    s.pinChanged = true;
  }

  s.dob = String(fd.get('dob') || '').trim();
  s.gender = String(fd.get('gender') || '').trim();
  s.email = String(fd.get('email') || '').trim();
  s.schoolOrOccupation = String(fd.get('schoolOrOccupation') || '').trim();
  s.addr = String(fd.get('addr') || '').trim();
  s.phone = String(fd.get('phone') || s.phone || '').trim();
  s.guardian = String(fd.get('guardian') || '').trim();
  s.parentPhone = String(fd.get('parentPhone') || '').trim();
  s.pickupNote = String(fd.get('pickupNote') || '').trim();
  s.musicGoal = String(fd.get('musicGoal') || '').trim();

  saveState();
  closeModal();
  renderCurrentTab();
  showToast('Profile saved successfully');
}

async function uploadStudentPhoto(e, stuId, keepModalOpen = false, previewElId = 'profilePhotoPreview') {
  const input = e.target;
  const file = input && input.files && input.files[0];
  if (!file) return;

  const preview = keepModalOpen ? document.getElementById(previewElId) : null;
  const prevHtml = preview ? preview.innerHTML : '';
  if (preview) {
    preview.innerHTML = '<span class="text-[10px] font-semibold text-indigo-700 text-center px-1">Cropping...</span>';
  }
  showToast('Auto-cropping & resizing ID photo...');

  try {
    const result = await autoCropAndResizeIdPhoto(file, 36000);
    if (!result || !result.dataUrl || !result.dataUrl.startsWith('data:image/')) {
      throw new Error('Invalid processed image');
    }

    const s = appState.students.find(x => x.id === stuId);
    if (!s) return;

    s.photoDataUrl = result.dataUrl;
    saveState();

    // Update live preview immediately without closing modal
    if (preview) {
      preview.innerHTML = `<img src="${safeDataUrl(s.photoDataUrl, 'data:image/')}" class="w-full h-full object-cover" />`;
    }
    // Also refresh underlying ID card / Students grid live
    renderCurrentTab();
    showToast(`ID Photo auto-cropped & saved (${result.kb} KB)`);
  } catch (err) {
    console.error('Photo upload error:', err);
    if (preview) preview.innerHTML = prevHtml || 'PHOTO';
    showToast('Could not process photo. Please try a JPG/PNG image.');
  } finally {
    if (input) input.value = '';
  }
}

function getMetronomeConfig() {
  if (!appState.metronomeConfig || typeof appState.metronomeConfig !== 'object') {
    appState.metronomeConfig = { ...DEFAULT_METRONOME_CONFIG };
  }
  return { ...DEFAULT_METRONOME_CONFIG, ...appState.metronomeConfig };
}

function buildDefaultBeatPattern(beats, beatUnit) {
  const arr = [];
  for (let i = 0; i < beats; i++) {
    if (i === 0) arr.push(3); // Accent (Red)
    else if (beatUnit === 8 && (beats === 6 || beats === 9 || beats === 12) && i % 3 === 0) arr.push(2); // Compound strong
    else if (beatUnit === 8 && (beats === 6 || beats === 9 || beats === 12)) arr.push(1); // Compound weak
    else arr.push(2); // Regular (Green)
  }
  return arr;
}

function getTempoMarking(bpm) {
  if (bpm < 42) return 'Grave';
  if (bpm < 60) return 'Largo';
  if (bpm < 72) return 'Adagio';
  if (bpm < 92) return 'Andante';
  if (bpm < 112) return 'Moderato';
  if (bpm < 132) return 'Allegretto';
  if (bpm < 160) return 'Allegro';
  if (bpm < 184) return 'Vivace';
  if (bpm < 216) return 'Presto';
  return 'Prestissimo';
}

let metronomeState = {
  isPlaying: false,
  bpm: 100,
  beatsPerBar: 4,
  beatUnit: 4,
  subdivision: 1,
  beatPattern: [3, 2, 2, 2],
  volume: 1.35,
  soundMode: '', // '' means adopt admin defaultSoundMode
  soundModeInitialized: false,
  tapTimes: [],
  currentBeat: 0,

  nextNoteTime: 0,

  ripples: [],
  trail: []
};

let metronomeAudioCtx = null;
let metronomeMasterGain = null;
let metronomeCompressor = null;
let metronomeMakeupGain = null;
let metronomeNoiseBuffer = null;
let metronomeDecodedCache = new Map(); // dataUrl -> AudioBuffer
let metronomeScheduledVisuals = [];
let metronomeKeyListenerBound = false;

function ensureMetronomeAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!metronomeAudioCtx) {
    metronomeAudioCtx = new Ctx();
    metronomeMasterGain = metronomeAudioCtx.createGain();
    metronomeCompressor = metronomeAudioCtx.createDynamicsCompressor();
    metronomeCompressor.threshold.setValueAtTime(-10, metronomeAudioCtx.currentTime);
    metronomeCompressor.knee.setValueAtTime(6, metronomeAudioCtx.currentTime);
    metronomeCompressor.ratio.setValueAtTime(14, metronomeAudioCtx.currentTime);
    metronomeCompressor.attack.setValueAtTime(0.001, metronomeAudioCtx.currentTime);
    metronomeCompressor.release.setValueAtTime(0.055, metronomeAudioCtx.currentTime);

    metronomeMakeupGain = metronomeAudioCtx.createGain();
    metronomeMakeupGain.gain.setValueAtTime(1.55, metronomeAudioCtx.currentTime);

    metronomeMasterGain.connect(metronomeCompressor);
    metronomeCompressor.connect(metronomeMakeupGain);
    metronomeMakeupGain.connect(metronomeAudioCtx.destination);

    // Pre-generate crisp white noise buffer for transient click punch
    const sr = metronomeAudioCtx.sampleRate;
    const len = Math.floor(sr * 0.04);
    metronomeNoiseBuffer = metronomeAudioCtx.createBuffer(1, len, sr);
    const ch = metronomeNoiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) {
      ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.0045));
    }
  }
  if (metronomeAudioCtx.state === 'suspended') {
    metronomeAudioCtx.resume().catch(() => {});
  }
  updateMetronomeMasterGain();
  return metronomeAudioCtx;
}

function updateMetronomeMasterGain() {
  if (!metronomeAudioCtx || !metronomeMasterGain) return;
  const cfg = getMetronomeConfig();
  const boost = Number(cfg.loudnessBoost || 1.5);
  const vol = Math.max(0, Math.min(2.0, Number(metronomeState.volume || 0)));
  metronomeMasterGain.gain.setTargetAtTime(vol * boost, metronomeAudioCtx.currentTime, 0.01);
}

function getActiveMetronomeSoundMode() {
  const cfg = getMetronomeConfig();
  if (!metronomeState.soundModeInitialized || !metronomeState.soundMode) {
    metronomeState.soundMode = cfg.defaultSoundMode || 'default';
    metronomeState.soundModeInitialized = true;
  }
  return metronomeState.soundMode;
}

function getEffectiveCustomSoundUrls() {
  const cfg = getMetronomeConfig();
  const isAdmin = currentUser && currentUser.role === 'admin';
  const accentUrl = (!isAdmin && metronomeState.localAccentDataUrl) ? metronomeState.localAccentDataUrl : (cfg.customAccentDataUrl || '');
  const accentName = (!isAdmin && metronomeState.localAccentDataUrl) ? metronomeState.localAccentName : (cfg.customAccentName || '');
  const regularUrl = (!isAdmin && metronomeState.localRegularDataUrl) ? metronomeState.localRegularDataUrl : (cfg.customRegularDataUrl || '');
  const regularName = (!isAdmin && metronomeState.localRegularDataUrl) ? metronomeState.localRegularName : (cfg.customRegularName || '');
  return { accentUrl, accentName, regularUrl, regularName };
}

async function decodeDataUrlToAudioBuffer(dataUrl) {
  if (!dataUrl || !dataUrl.startsWith('data:audio/')) return null;
  if (metronomeDecodedCache.has(dataUrl)) return metronomeDecodedCache.get(dataUrl);
  const ctx = ensureMetronomeAudio();
  if (!ctx) return null;
  try {
    const bytes = dataUrlToUint8Array(dataUrl);
    const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    const decoded = await ctx.decodeAudioData(ab);
    metronomeDecodedCache.set(dataUrl, decoded);
    return decoded;
  } catch (err) {
    console.warn('Custom metronome sound decode failed:', err);
    return null;
  }
}

function syncMetronomeBuffersFromState() {
  const { accentUrl, regularUrl } = getEffectiveCustomSoundUrls();
  if (metronomeAudioCtx) {
    if (accentUrl && !metronomeDecodedCache.has(accentUrl)) decodeDataUrlToAudioBuffer(accentUrl);
    if (regularUrl && !metronomeDecodedCache.has(regularUrl)) decodeDataUrlToAudioBuffer(regularUrl);
  }
}

function encodeTrimmedMonoWavDataUrl(audioBuffer, maxDurationSec = 0.42, targetSr = 22050) {
  const origSr = audioBuffer.sampleRate;
  const numCh = audioBuffer.numberOfChannels;
  const origLen = audioBuffer.length;
  // Mix down to mono
  const mono = new Float32Array(origLen);
  for (let c = 0; c < numCh; c++) {
    const data = audioBuffer.getChannelData(c);
    for (let i = 0; i < origLen; i++) mono[i] += data[i] / numCh;
  }
  // Find first non-silent sample so click triggers with zero latency
  let peak = 0;
  for (let i = 0; i < origLen; i++) {
    const a = Math.abs(mono[i]);
    if (a > peak) peak = a;
  }
  const thresh = Math.max(0.015, peak * 0.04);
  let startIdx = 0;
  for (let i = 0; i < origLen; i++) {
    if (Math.abs(mono[i]) >= thresh) {
      startIdx = Math.max(0, i - Math.floor(origSr * 0.002));
      break;
    }
  }
  const maxOrigSamples = Math.min(origLen - startIdx, Math.floor(origSr * maxDurationSec));
  const ratio = origSr / targetSr;
  const outLen = Math.max(64, Math.floor(maxOrigSamples / ratio));
  const resampled = new Float32Array(outLen);
  let outPeak = 0;
  for (let i = 0; i < outLen; i++) {
    const srcPos = startIdx + i * ratio;
    const i0 = Math.floor(srcPos);
    const i1 = Math.min(origLen - 1, i0 + 1);
    const frac = srcPos - i0;
    const s = mono[i0] * (1 - frac) + mono[i1] * frac;
    resampled[i] = s;
    const a = Math.abs(s);
    if (a > outPeak) outPeak = a;
  }
  // Normalize loudly to 0.96 peak + 12ms smooth fade-out
  const norm = outPeak > 0.001 ? (0.96 / outPeak) : 1;
  const fadeSamples = Math.min(Math.floor(targetSr * 0.014), Math.floor(outLen * 0.25));
  for (let i = 0; i < outLen; i++) {
    let v = resampled[i] * norm;
    if (i > outLen - fadeSamples) {
      v *= (outLen - i) / fadeSamples;
    }
    resampled[i] = Math.max(-1, Math.min(1, v));
  }

  // Write 16-bit PCM WAV header + body
  const dataBytes = outLen * 2;
  const buf = new ArrayBuffer(44 + dataBytes);
  const view = new DataView(buf);
  const writeStr = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataBytes, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, 1, true); // Mono
  view.setUint32(24, targetSr, true);
  view.setUint32(28, targetSr * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, dataBytes, true);

  let offset = 44;
  for (let i = 0; i < outLen; i++) {
    const s = resampled[i];
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    offset += 2;
  }

  const bytes = new Uint8Array(buf);
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return 'data:audio/wav;base64,' + btoa(bin);
}

function playDefaultLoudClick(ctx, time, level, isSub) {
  const gainScale = isSub ? 0.45 : (level === 3 ? 1.15 : level === 2 ? 0.92 : 0.62);
  const startFreq = isSub ? 660 : (level === 3 ? 1880 : level === 2 ? 1180 : 820);
  const endFreq   = isSub ? 440 : (level === 3 ? 1120 : level === 2 ? 720  : 520);
  const dur       = isSub ? 0.028 : (level === 3 ? 0.055 : 0.044);

  // 1. Pitched woodblock/rim body
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = level === 3 ? 'triangle' : 'sine';
  osc.frequency.setValueAtTime(startFreq, time);
  osc.frequency.exponentialRampToValueAtTime(endFreq, time + dur * 0.75);
  g.gain.setValueAtTime(0.001, time);
  g.gain.linearRampToValueAtTime(gainScale, time + 0.0015);
  g.gain.exponentialRampToValueAtTime(0.0008, time + dur);
  osc.connect(g);
  g.connect(metronomeMasterGain);
  osc.start(time);
  osc.stop(time + dur + 0.005);

  // 2. High harmonic edge on Accent Beat 1
  if (!isSub && level === 3) {
    const osc2 = ctx.createOscillator();
    const g2 = ctx.createGain();
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(startFreq * 1.5, time);
    osc2.frequency.exponentialRampToValueAtTime(endFreq * 1.35, time + 0.025);
    g2.gain.setValueAtTime(0.001, time);
    g2.gain.linearRampToValueAtTime(0.32, time + 0.001);
    g2.gain.exponentialRampToValueAtTime(0.0008, time + 0.028);
    osc2.connect(g2);
    g2.connect(metronomeMasterGain);
    osc2.start(time);
    osc2.stop(time + 0.032);
  }

  // 3. Crisp percussive snap transient so it cuts through loud instruments
  if (metronomeNoiseBuffer) {
    const noise = ctx.createBufferSource();
    noise.buffer = metronomeNoiseBuffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(level === 3 ? 3200 : 2200, time);
    filter.Q.setValueAtTime(1.8, time);
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(gainScale * 0.78, time);
    ng.gain.exponentialRampToValueAtTime(0.001, time + 0.018);
    noise.connect(filter);
    filter.connect(ng);
    ng.connect(metronomeMasterGain);
    noise.start(time);
    noise.stop(time + 0.022);
  }
}

function playAdminCustomTone(ctx, time, level, isSub) {
  const cfg = getMetronomeConfig();
  const baseFreq = isSub
    ? Number(cfg.subFreq || 680)
    : (level === 3 ? Number(cfg.accentFreq || 1620) : level === 2 ? Number(cfg.regularFreq || 1020) : Math.max(220, Number(cfg.regularFreq || 1020) * 0.78));
  const decaySec = Math.max(0.015, Math.min(0.22, Number(cfg.decayMs || 42) / 1000)) * (isSub ? 0.65 : 1);
  const snap = Math.max(0, Math.min(1, Number(cfg.clickSnap ?? 0.75)));
  const wave = ['triangle', 'sine', 'square', 'sawtooth'].includes(cfg.waveform) ? cfg.waveform : 'triangle';
  const amp = isSub ? 0.45 : (level === 3 ? 1.15 : level === 2 ? 0.9 : 0.6);

  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = wave;
  osc.frequency.setValueAtTime(baseFreq, time);
  osc.frequency.exponentialRampToValueAtTime(Math.max(120, baseFreq * 0.68), time + decaySec * 0.85);
  g.gain.setValueAtTime(0.001, time);
  g.gain.linearRampToValueAtTime(amp * (wave === 'square' || wave === 'sawtooth' ? 0.68 : 1.0), time + 0.0015);
  g.gain.exponentialRampToValueAtTime(0.0008, time + decaySec);
  osc.connect(g);
  g.connect(metronomeMasterGain);
  osc.start(time);
  osc.stop(time + decaySec + 0.008);

  if (snap > 0.02 && metronomeNoiseBuffer) {
    const noise = ctx.createBufferSource();
    noise.buffer = metronomeNoiseBuffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(Math.min(6000, baseFreq * 1.9), time);
    filter.Q.setValueAtTime(1.6, time);
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(amp * snap * 0.85, time);
    ng.gain.exponentialRampToValueAtTime(0.001, time + 0.018);
    noise.connect(filter);
    filter.connect(ng);
    ng.connect(metronomeMasterGain);
    noise.start(time);
    noise.stop(time + 0.022);
  }
}

function playCustomUploadedSound(ctx, time, level, isSub) {
  const { accentUrl, regularUrl } = getEffectiveCustomSoundUrls();
  const accentBuf = accentUrl ? metronomeDecodedCache.get(accentUrl) : null;
  const regularBuf = regularUrl ? metronomeDecodedCache.get(regularUrl) : null;

  let buf = null;
  let rate = 1.0;
  if (!isSub && level === 3) {
    buf = accentBuf || regularBuf;
    rate = accentBuf ? 1.0 : 1.24;
  } else if (isSub) {
    buf = regularBuf || accentBuf;
    rate = regularBuf ? 0.85 : 0.72;
  } else {
    buf = regularBuf || accentBuf;
    rate = regularBuf ? 1.0 : 0.82;
  }

  if (!buf) {
    // Graceful instant fallback while buffer decodes or if no file uploaded yet
    playDefaultLoudClick(ctx, time, level, isSub);
    return;
  }

  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.playbackRate.setValueAtTime(rate, time);
  const g = ctx.createGain();
  const amp = isSub ? 0.48 : (level === 3 ? 1.2 : level === 2 ? 0.95 : 0.62);
  g.gain.setValueAtTime(amp, time);
  src.connect(g);
  g.connect(metronomeMasterGain);
  src.start(time);
}

function scheduleMetronomeSound(time, beatIdx, subIdx, beatLevel) {
  const ctx = metronomeAudioCtx;
  if (!ctx || !metronomeMasterGain) return;
  const isSub = subIdx > 0;
  if (!isSub && beatLevel === 0) return; // Muted beat
  if (isSub && beatLevel === 0) return;  // Skip sub on muted beat

  const mode = getActiveMetronomeSoundMode();
  if (mode === 'custom_tone') {
    playAdminCustomTone(ctx, time, beatLevel, isSub);
  } else if (mode === 'custom_upload') {
    playCustomUploadedSound(ctx, time, beatLevel, isSub);
  } else {
    playDefaultLoudClick(ctx, time, beatLevel, isSub);
  }
}

function getBeatIntervalSec() {
  // Quarter-note BPM scaled gently if denominator is 8/16? Musicians expect BPM = beats per minute of the selected beat unit!
  return 60.0 / Math.max(30, Math.min(300, Number(metronomeState.bpm || 100)));
}

function metronomeSchedulerTick() {
  if (!metronomeState.isPlaying || !metronomeAudioCtx) return;
  const lookAheadSec = 0.11;
  const sub = Math.max(1, Math.min(4, Number(metronomeState.subdivision || 1)));
  const totalSteps = metronomeState.beatsPerBar * sub;

  while (metronomeState.nextNoteTime < metronomeAudioCtx.currentTime + lookAheadSec) {
    const step = metronomeState.currentStepInBar % totalSteps;
    const beatIdx = Math.floor(step / sub);
    const subIdx = step % sub;
    const beatLevel = metronomeState.beatPattern[beatIdx] ?? (beatIdx === 0 ? 3 : 2);
    const beatDur = getBeatIntervalSec();
    const stepDur = beatDur / sub;

    scheduleMetronomeSound(metronomeState.nextNoteTime, beatIdx, subIdx, beatLevel);

    if (subIdx === 0) {
      metronomeScheduledVisuals.push({
        type: 'beat',
        beatIdx,
        nextBeatIdx: (beatIdx + 1) % metronomeState.beatsPerBar,
        beatLevel,
        time: metronomeState.nextNoteTime,
        nextTime: metronomeState.nextNoteTime + beatDur
      });
    } else {
      metronomeScheduledVisuals.push({
        type: 'sub',
        beatIdx,
        subIdx,
        time: metronomeState.nextNoteTime
      });
    }

    metronomeState.nextNoteTime += stepDur;
    metronomeState.currentStepInBar = (step + 1) % totalSteps;
  }
}

async function startMetronome() {
  const ctx = ensureMetronomeAudio();
  if (!ctx) {
    showToast('Web Audio is not supported in this browser.');
    return;
  }
  // Pre-decode any uploaded custom sounds before starting so first beat uses them immediately
  const { accentUrl, regularUrl } = getEffectiveCustomSoundUrls();
  if (getActiveMetronomeSoundMode() === 'custom_upload') {
    await Promise.all([
      accentUrl ? decodeDataUrlToAudioBuffer(accentUrl) : Promise.resolve(),
      regularUrl ? decodeDataUrlToAudioBuffer(regularUrl) : Promise.resolve()
    ]);
  }

  if (ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (_) {}
  }

  metronomeState.isPlaying = true;
  metronomeState.currentBeat = 0;
  metronomeState.currentStepInBar = 0;
  metronomeState.activeBeatIndex = 0;
  metronomeState.nextBeatIndex = metronomeState.beatsPerBar > 1 ? 1 : 0;
  metronomeState.ripples = [];
  metronomeState.trail = [];
  metronomeScheduledVisuals = [];
  metronomeState.nextNoteTime = ctx.currentTime + 0.05;

  clearInterval(metronomeState.schedulerTimerId);
  metronomeState.schedulerTimerId = setInterval(metronomeSchedulerTick, 25);
  metronomeSchedulerTick();

  updateMetronomePlayButtonUI();
  startMetronomeAnimationLoop();
}

function stopMetronome() {
  metronomeState.isPlaying = false;
  clearInterval(metronomeState.schedulerTimerId);
  metronomeState.schedulerTimerId = null;
  if (metronomeState.rafId) {
    cancelAnimationFrame(metronomeState.rafId);
    metronomeState.rafId = null;
  }
  metronomeScheduledVisuals = [];
  metronomeState.ripples = [];
  metronomeState.trail = [];
  metronomeState.activeBeatIndex = 0;
  metronomeState.nextBeatIndex = metronomeState.beatsPerBar > 1 ? 1 : 0;
  updateMetronomePlayButtonUI();
  drawMetronomeCanvasFrame();
}

function toggleMetronomePlay() {
  if (metronomeState.isPlaying) stopMetronome();
  else startMetronome();
}

function updateMetronomePlayButtonUI() {
  const btn = document.getElementById('metroPlayToggleBtn');
  if (btn) {
    if (metronomeState.isPlaying) {
      btn.className = 'min-h-[54px] px-6 py-3 rounded-xl font-extrabold text-sm sm:text-base tracking-wide flex items-center justify-center gap-2.5 transition active:scale-[0.98] bg-[#DC2626] hover:bg-[#B91C1C] text-white shadow-lg shadow-red-950/60';
      btn.innerHTML = `<svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Stop</span>`;
    } else {
      btn.className = 'min-h-[54px] px-6 py-3 rounded-xl font-extrabold text-sm sm:text-base tracking-wide flex items-center justify-center gap-2.5 transition active:scale-[0.98] bg-[#16A34A] hover:bg-[#15803D] text-white shadow-lg shadow-emerald-950/60';
      btn.innerHTML = `<svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Start</span>`;
    }
  }
  const badge = document.getElementById('metroBeatCounterText');
  if (badge && !metronomeState.isPlaying) {
    badge.textContent = `Ready · ${metronomeState.beatsPerBar}/${metronomeState.beatUnit}`;
  }
}

function startMetronomeAnimationLoop() {
  if (metronomeState.rafId) cancelAnimationFrame(metronomeState.rafId);
  const loop = () => {
    if (!metronomeState.isPlaying) {
      drawMetronomeCanvasFrame();
      return;
    }
    drawMetronomeCanvasFrame();
    metronomeState.rafId = requestAnimationFrame(loop);
  };
  metronomeState.rafId = requestAnimationFrame(loop);
}

function getPadCenterX(idx, count, W) {
  const margin = Math.max(24, Math.min(54, W * 0.08));
  if (count <= 1) return W / 2;
  const usable = W - margin * 2;
  return margin + (usable * idx) / (count - 1);
}

function getBeatColorSet(level) {
  if (level === 3) return { main: '#EF4444', glow: 'rgba(239, 68, 68, 0.55)', dim: '#450A0A', border: '#DC2626', text: '#FCA5A5' }; // Crimson Red Accent
  if (level === 2) return { main: '#22C55E', glow: 'rgba(34, 197, 94, 0.52)', dim: '#052E16', border: '#16A34A', text: '#86EFAC' }; // Emerald Green Regular
  if (level === 1) return { main: '#3B82F6', glow: 'rgba(59, 130, 246, 0.48)', dim: '#172554', border: '#2563EB', text: '#93C5FD' }; // Dark Blue Soft
  return { main: '#475569', glow: 'rgba(71, 85, 105, 0.2)', dim: '#0B1120', border: '#1E293B', text: '#64748B' }; // Muted Black/Slate
}

function drawMetronomeCanvasFrame() {
  const canvas = document.getElementById('metronomeCanvas');
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const targetW = Math.round(rect.width * dpr);
  const targetH = Math.round(rect.height * dpr);
  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW;
    canvas.height = targetH;
  }

  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.scale(dpr, dpr);
  const W = rect.width;
  const H = rect.height;

  // Consume scheduled visuals up to current AudioContext time
  const now = metronomeAudioCtx ? metronomeAudioCtx.currentTime : 0;
  if (metronomeState.isPlaying && metronomeAudioCtx) {
    while (metronomeScheduledVisuals.length && metronomeScheduledVisuals[0].time <= now + 0.008) {
      const ev = metronomeScheduledVisuals.shift();
      if (ev.type === 'beat') {
        metronomeState.activeBeatIndex = ev.beatIdx;
        metronomeState.nextBeatIndex = ev.nextBeatIdx;
        metronomeState.activeBeatLevel = ev.beatLevel;
        metronomeState.lastBeatTime = ev.time;
        metronomeState.nextBeatTime = ev.nextTime;
        const padX = getPadCenterX(ev.beatIdx, metronomeState.beatsPerBar, W);
        if (ev.beatLevel > 0) {
          metronomeState.ripples.push({
            x: padX,
            y: H - 36,
            color: getBeatColorSet(ev.beatLevel).main,
            born: now
          });
        }
        const counterEl = document.getElementById('metroBeatCounterText');
        if (counterEl) {
          counterEl.textContent = `Beat ${ev.beatIdx + 1} of ${metronomeState.beatsPerBar} · ${metronomeState.beatsPerBar}/${metronomeState.beatUnit}`;
        }
        highlightActiveBeatPadDom(ev.beatIdx, ev.beatLevel);
      } else if (ev.type === 'sub') {
        metronomeState.lastSubTime = ev.time;
      }
    }
  }

  // 1. Deep Black + Dark Blue Stage Backdrop
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#04070F');
  bgGrad.addColorStop(0.58, '#0A1328');
  bgGrad.addColorStop(1, '#050810');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle dark blue architectural stage lines
  ctx.strokeStyle = 'rgba(30, 58, 138, 0.22)';
  ctx.lineWidth = 1;
  for (let gy = 36; gy < H - 36; gy += 36) {
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
  }

  // Horizon floor line
  const floorY = H - 36;
  const floorGrad = ctx.createLinearGradient(0, floorY, W, floorY);
  floorGrad.addColorStop(0, 'rgba(30, 58, 138, 0.15)');
  floorGrad.addColorStop(0.5, 'rgba(34, 197, 94, 0.45)');
  floorGrad.addColorStop(1, 'rgba(239, 68, 68, 0.45)');
  ctx.strokeStyle = floorGrad;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(12, floorY);
  ctx.lineTo(W - 12, floorY);
  ctx.stroke();

  // 2. Draw Beat Landing Pads
  const count = metronomeState.beatsPerBar;
  const padW = Math.max(14, Math.min(46, (W - 48) / Math.max(count, 4) - 8));
  const padH = 12;

  for (let i = 0; i < count; i++) {
    const px = getPadCenterX(i, count, W);
    const lvl = metronomeState.beatPattern[i] ?? (i === 0 ? 3 : 2);
    const col = getBeatColorSet(lvl);
    const isHit = metronomeState.isPlaying && metronomeState.activeBeatIndex === i && (now - metronomeState.lastBeatTime) < 0.22;

    if (isHit && lvl > 0) {
      const glowGrad = ctx.createRadialGradient(px, floorY, 2, px, floorY, padW * 1.15);
      glowGrad.addColorStop(0, col.glow);
      glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(px, floorY, padW * 1.15, 0, Math.PI * 2);
      ctx.fill();
    }

    // Pad capsule
    ctx.fillStyle = isHit && lvl > 0 ? col.main : col.dim;
    ctx.strokeStyle = isHit && lvl > 0 ? '#FFFFFF' : col.border;
    ctx.lineWidth = isHit ? 1.8 : 1.2;
    ctx.beginPath();
    ctx.roundRect(px - padW / 2, floorY - padH / 2, padW, padH, 6);
    ctx.fill();
    ctx.stroke();

    // Beat number beneath pad
    ctx.fillStyle = isHit && lvl > 0 ? '#FFFFFF' : col.text;
    ctx.font = `700 ${count > 12 ? 9 : 11}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(String(i + 1), px, floorY + 10);
  }

  // 3. Draw Impact Shockwave Ripples
  metronomeState.ripples = metronomeState.ripples.filter(r => (now - r.born) < 0.42);
  for (const r of metronomeState.ripples) {
    const age = Math.max(0, (now - r.born) / 0.42);
    const rad = 10 + age * 46;
    ctx.save();
    ctx.globalAlpha = (1 - age) * 0.72;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2.5 * (1 - age) + 0.5;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, rad, rad * 0.36, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 4. Compute Bouncing Ball Trajectory
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ballBaseRadius = Math.max(11, Math.min(16, H * 0.082));
  const impactY = floorY - padH / 2 - ballBaseRadius + 2;
  const maxArcH = Math.max(58, H - 92);

  let ballX = getPadCenterX(0, count, W);
  let ballY = impactY - 6;
  let scaleX = 1;
  let scaleY = 1;
  let ballLevel = metronomeState.beatPattern[0] ?? 3;

  if (metronomeState.isPlaying && metronomeState.nextBeatTime > metronomeState.lastBeatTime) {
    const u = Math.max(0, Math.min(1, (now - metronomeState.lastBeatTime) / (metronomeState.nextBeatTime - metronomeState.lastBeatTime)));
    const x0 = getPadCenterX(metronomeState.activeBeatIndex, count, W);
    const x1 = getPadCenterX(metronomeState.nextBeatIndex, count, W);
    const isWrapToOne = metronomeState.nextBeatIndex === 0 && count > 1;
    const arcHeight = isWrapToOne ? maxArcH : maxArcH * 0.84;

    if (reducedMotion) {
      ballX = x0;
      ballY = impactY - 6;
    } else {
      ballX = x0 + (x1 - x0) * u;
      // Parabolic gravity bounce: 0 at u=0 (launch), 1 at u=0.5 (apex), 0 at u=1 (landing)
      const parabola = 4 * u * (1 - u);
      ballY = impactY - parabola * arcHeight;

      // Subtle physical squash & stretch at launch/impact
      if (u < 0.08) {
        const sq = (1 - u / 0.08) * 0.24;
        scaleX = 1 + sq;
        scaleY = 1 - sq;
      } else if (u > 0.92) {
        const sq = ((u - 0.92) / 0.08) * 0.2;
        scaleX = 1 + sq;
        scaleY = 1 - sq;
      } else {
        const stretch = Math.abs(u - 0.5) * 0.16;
        scaleX = 1 - stretch * 0.45;
        scaleY = 1 + stretch;
      }
    }

    // Color transitions smoothly to the upcoming downbeat color near landing
    const activeLvl = metronomeState.beatPattern[metronomeState.activeBeatIndex] ?? 2;
    const nextLvl = metronomeState.beatPattern[metronomeState.nextBeatIndex] ?? 2;
    ballLevel = u > 0.78 ? nextLvl : activeLvl;

    // Record comet trail
    if (!reducedMotion) {
      metronomeState.trail.push({ x: ballX, y: ballY, col: getBeatColorSet(ballLevel).main });
      if (metronomeState.trail.length > 14) metronomeState.trail.shift();
    }
  } else {
    // Idle resting ball poised cleanly above Beat 1
    ballX = getPadCenterX(0, count, W);
    ballY = impactY - 10;
    ballLevel = metronomeState.beatPattern[0] ?? 3;
    metronomeState.trail = [];
  }

  const ballCol = getBeatColorSet(ballLevel === 0 ? 1 : ballLevel);

  // 5. Draw Glowing Comet Trail
  for (let i = 0; i < metronomeState.trail.length; i++) {
    const pt = metronomeState.trail[i];
    const frac = (i + 1) / metronomeState.trail.length;
    ctx.save();
    ctx.globalAlpha = frac * 0.34;
    ctx.fillStyle = pt.col;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, ballBaseRadius * (0.25 + frac * 0.58), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 6. Ground Shadow directly under ball
  const heightNorm = Math.max(0, Math.min(1, (impactY - ballY) / maxArcH));
  ctx.save();
  ctx.globalAlpha = 0.45 * (1 - heightNorm * 0.72);
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.ellipse(ballX, floorY - 2, ballBaseRadius * (1.15 - heightNorm * 0.5), 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 7. Draw the Bouncing Ball with crisp 3D specular highlight + outer halo
  ctx.save();
  ctx.translate(ballX, ballY);
  ctx.scale(scaleX, scaleY);

  // Outer aura
  const aura = ctx.createRadialGradient(0, 0, ballBaseRadius * 0.4, 0, 0, ballBaseRadius * 2.1);
  aura.addColorStop(0, ballCol.glow);
  aura.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = aura;
  ctx.beginPath();
  ctx.arc(0, 0, ballBaseRadius * 2.1, 0, Math.PI * 2);
  ctx.fill();

  // Ball sphere body
  const sphere = ctx.createRadialGradient(-ballBaseRadius * 0.35, -ballBaseRadius * 0.35, 2, 0, 0, ballBaseRadius);
  sphere.addColorStop(0, '#FFFFFF');
  sphere.addColorStop(0.28, ballCol.main);
  sphere.addColorStop(1, ballCol.dim);
  ctx.fillStyle = sphere;
  ctx.beginPath();
  ctx.arc(0, 0, ballBaseRadius, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // Beat number etched inside ball
  const shownBeat = metronomeState.isPlaying ? (metronomeState.activeBeatIndex + 1) : 1;
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `800 ${Math.round(ballBaseRadius * 0.86)}px Inter, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(shownBeat), 0, 1);

  ctx.restore();
  ctx.restore();
}

function highlightActiveBeatPadDom(beatIdx, beatLevel) {
  const pads = document.querySelectorAll('[data-metro-pad]');
  pads.forEach((btn, idx) => {
    if (idx === beatIdx) {

function setMetronomeBpm(val) {
  const clamped = Math.max(30, Math.min(300, Math.round(Number(val) || 100)));
  metronomeState.bpm = clamped;
  const numEl = document.getElementById('metroBpmDisplay');
  if (numEl) numEl.textContent = String(clamped);
  const inputEl = document.getElementById('metroBpmInput');
  if (inputEl && document.activeElement !== inputEl) inputEl.value = String(clamped);
  const sliderEl = document.getElementById('metroBpmSlider');
  if (sliderEl) sliderEl.value = String(clamped);
  const markEl = document.getElementById('metroTempoMarking');
  if (markEl) markEl.textContent = getTempoMarking(clamped);
  const hdrMeta = document.getElementById('metroHeaderMeta');
  if (hdrMeta) hdrMeta.textContent = `${metronomeState.beatsPerBar}/${metronomeState.beatUnit} · ${clamped} BPM · ${getTempoMarking(clamped)}`;
  const recHdrEl = document.getElementById('recHeaderStatusText');
  if (recHdrEl && !isRecordingAudio) recHdrEl.textContent = `Ready · ${metronomeState.beatsPerBar}/${metronomeState.beatUnit} · ${clamped} BPM`;
}

function stepMetronomeBpm(delta) {
  setMetronomeBpm(metronomeState.bpm + delta);
}

function handleMetronomeTapTempo() {
  const now = performance.now();
  const prev = metronomeState.tapTimes[metronomeState.tapTimes.length - 1] || 0;
  if (now - prev > 2400) {
    metronomeState.tapTimes = [];
  }
  metronomeState.tapTimes.push(now);
  if (metronomeState.tapTimes.length > 6) metronomeState.tapTimes.shift();

  // Give instant audible feedback on tap
  const ctx = ensureMetronomeAudio();
  if (ctx) scheduleMetronomeSound(ctx.currentTime + 0.005, 0, 0, 2);

  if (metronomeState.tapTimes.length >= 2) {
    let totalDiff = 0;
    for (let i = 1; i < metronomeState.tapTimes.length; i++) {
      totalDiff += metronomeState.tapTimes[i] - metronomeState.tapTimes[i - 1];
    }
    const avgMs = totalDiff / (metronomeState.tapTimes.length - 1);
    if (avgMs > 0) {
      setMetronomeBpm(Math.round(60000 / avgMs));
    }
  }
}

function setMetronomeVolume(val) {
  const pct = Math.max(0, Math.min(180, Number(val) || 0));
  metronomeState.volume = pct / 100;
  updateMetronomeMasterGain();
  const lbl = document.getElementById('metroVolLabel');
  if (lbl) lbl.textContent = pct === 0 ? 'Muted' : `${Math.round(pct)}%`;
}

function setMetronomeMeter(beats, beatUnit) {
  const b = Math.max(1, Math.min(16, parseInt(beats, 10) || 4));
  const u = [1, 2, 4, 8, 16].includes(parseInt(beatUnit, 10)) ? parseInt(beatUnit, 10) : 4;
  metronomeState.beatsPerBar = b;
  metronomeState.beatUnit = u;
  metronomeState.beatPattern = buildDefaultBeatPattern(b, u);
  metronomeState.currentBeat = 0;
  metronomeState.currentStepInBar = 0;
  metronomeState.activeBeatIndex = 0;
  metronomeState.nextBeatIndex = b > 1 ? 1 : 0;
  refreshMetronomeInteractivePanels();
  drawMetronomeCanvasFrame();
}

function setMetronomeSubdivision(sub) {
  metronomeState.subdivision = Math.max(1, Math.min(4, parseInt(sub, 10) || 1));
  metronomeState.currentStepInBar = 0;
  refreshMetronomeInteractivePanels();
}

function cycleMetronomeBeatLevel(idx) {
  const cur = metronomeState.beatPattern[idx] ?? 2;
  // Cycle: Accent(3/Red) -> Regular(2/Green) -> Soft(1/Blue) -> Mute(0/Black) -> Accent(3/Red)
  const next = cur === 3 ? 2 : cur === 2 ? 1 : cur === 1 ? 0 : 3;
  metronomeState.beatPattern[idx] = next;
  refreshMetronomeInteractivePanels();
  drawMetronomeCanvasFrame();
}

async function setMetronomeSoundMode(mode) {
  if (!['default', 'custom_tone', 'custom_upload'].includes(mode)) return;
  metronomeState.soundMode = mode;
  metronomeState.soundModeInitialized = true;
  if (mode === 'custom_upload') {
    const { accentUrl, regularUrl } = getEffectiveCustomSoundUrls();
    if (!accentUrl && !regularUrl) {
      showToast('Upload a custom click sound below to hear your custom sample (using default until uploaded).');
    } else {
      await Promise.all([
        accentUrl ? decodeDataUrlToAudioBuffer(accentUrl) : Promise.resolve(),
        regularUrl ? decodeDataUrlToAudioBuffer(regularUrl) : Promise.resolve()
      ]);
    }
  }
  refreshMetronomeInteractivePanels();
  testMetronomeBeatSound(3);
}

async function testMetronomeBeatSound(level = 3) {
  const ctx = ensureMetronomeAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (_) {}
  }
  if (getActiveMetronomeSoundMode() === 'custom_upload') {
    const { accentUrl, regularUrl } = getEffectiveCustomSoundUrls();
    await Promise.all([
      accentUrl ? decodeDataUrlToAudioBuffer(accentUrl) : Promise.resolve(),
      regularUrl ? decodeDataUrlToAudioBuffer(regularUrl) : Promise.resolve()
    ]);
  }
  scheduleMetronomeSound(ctx.currentTime + 0.01, 0, 0, level);
}

async function uploadMetronomeCustomSound(e, slot) {
  const input = e.target;
  const file = input && input.files && input.files[0];
  if (!file) return;
  const isAdmin = currentUser && currentUser.role === 'admin';
  showToast('Optimizing custom click sound for zero-latency sync...');
  try {
    const ctx = ensureMetronomeAudio();
    if (!ctx) throw new Error('Web Audio unavailable');
    const arrayBuf = await file.arrayBuffer();
    const decoded = await ctx.decodeAudioData(arrayBuf.slice(0));
    const compactWavUrl = encodeTrimmedMonoWavDataUrl(decoded, 0.42, 22050);

    // Pre-cache decoded compact buffer immediately
    const finalBuf = await decodeDataUrlToAudioBuffer(compactWavUrl);
    if (!finalBuf) throw new Error('Could not decode optimized sound');

    if (isAdmin) {
      if (!appState.metronomeConfig) appState.metronomeConfig = { ...DEFAULT_METRONOME_CONFIG };
      if (slot === 'accent') {
        appState.metronomeConfig.customAccentDataUrl = compactWavUrl;
        appState.metronomeConfig.customAccentName = file.name;
      } else {
        appState.metronomeConfig.customRegularDataUrl = compactWavUrl;
        appState.metronomeConfig.customRegularName = file.name;
      }
      saveState();
      showToast(`Academy custom ${slot === 'accent' ? 'Accent' : 'Beat'} sound saved & synced (${Math.round((compactWavUrl.length * 0.75) / 1024)} KB)`);
    } else {
      if (slot === 'accent') {
        metronomeState.localAccentDataUrl = compactWavUrl;
        metronomeState.localAccentName = file.name + ' (My Device)';
      } else {
        metronomeState.localRegularDataUrl = compactWavUrl;
        metronomeState.localRegularName = file.name + ' (My Device)';
      }
      showToast(`Custom ${slot === 'accent' ? 'Accent' : 'Beat'} sound loaded`);
    }

    metronomeState.soundMode = 'custom_upload';
    metronomeState.soundModeInitialized = true;
    refreshMetronomeInteractivePanels();
    testMetronomeBeatSound(slot === 'accent' ? 3 : 2);
  } catch (err) {
    console.error('Metronome custom upload error:', err);
    showToast('Could not read audio file. Please upload a valid MP3, WAV, OGG, or M4A clip.');
  } finally {
    if (input) input.value = '';
  }
}

function clearMetronomeCustomSound(slot) {
  const isAdmin = currentUser && currentUser.role === 'admin';
  if (isAdmin) {
    if (!appState.metronomeConfig) appState.metronomeConfig = { ...DEFAULT_METRONOME_CONFIG };
    if (slot === 'accent') {
      appState.metronomeConfig.customAccentDataUrl = '';
      appState.metronomeConfig.customAccentName = '';
    } else {
      appState.metronomeConfig.customRegularDataUrl = '';
      appState.metronomeConfig.customRegularName = '';
    }
    saveState();
    showToast(`Cleared academy custom ${slot === 'accent' ? 'Accent' : 'Beat'} sound`);
  } else {
    if (slot === 'accent') {
      metronomeState.localAccentDataUrl = '';
      metronomeState.localAccentName = '';
    } else {
      metronomeState.localRegularDataUrl = '';
      metronomeState.localRegularName = '';
    }
    showToast('Restored academy sound');

}

function applyAdminTonePreset(presetKey) {
  const p = METRONOME_ADMIN_TONE_PRESETS[presetKey];
  if (!p) return;
  if (!appState.metronomeConfig) appState.metronomeConfig = { ...DEFAULT_METRONOME_CONFIG };
  appState.metronomeConfig = {
    ...DEFAULT_METRONOME_CONFIG,
    ...appState.metronomeConfig,
    tonePreset: presetKey,
    waveform: p.waveform,
    accentFreq: p.accentFreq,
    regularFreq: p.regularFreq,
    subFreq: p.subFreq,
    decayMs: p.decayMs,
    clickSnap: p.clickSnap,
    loudnessBoost: p.loudnessBoost
  };
  metronomeState.soundMode = 'custom_tone';
  metronomeState.soundModeInitialized = true;
  updateMetronomeMasterGain();
  refreshMetronomeInteractivePanels();
  testMetronomeBeatSound(3);
}

function updateAdminToneField(field, value) {
  if (!appState.metronomeConfig) appState.metronomeConfig = { ...DEFAULT_METRONOME_CONFIG };
  const numericFields = ['accentFreq', 'regularFreq', 'subFreq', 'decayMs', 'clickSnap', 'loudnessBoost'];
  appState.metronomeConfig[field] = numericFields.includes(field) ? Number(value) : value;
  if (field !== 'defaultSoundMode') {
    appState.metronomeConfig.tonePreset = 'custom';
    metronomeState.soundMode = 'custom_tone';
    metronomeState.soundModeInitialized = true;
  }
  updateMetronomeMasterGain();
  const readout = document.getElementById('metroAdminVal_' + field);
  if (readout) {
    if (field.endsWith('Freq')) readout.textContent = `${Math.round(Number(value))} Hz`;
    else if (field === 'decayMs') readout.textContent = `${Math.round(Number(value))} ms`;
    else if (field === 'clickSnap') readout.textContent = `${Math.round(Number(value) * 100)}%`;
    else if (field === 'loudnessBoost') readout.textContent = `${Math.round(Number(value) * 100)}%`;
  }
}

function saveAdminMetronomeConfig() {
  if (!currentUser || currentUser.role !== 'admin') return;
  if (!appState.metronomeConfig) appState.metronomeConfig = { ...DEFAULT_METRONOME_CONFIG };
  saveState();
  showToast('Customised metronome tone & defaults saved to Academy');
}

function resetAdminMetronomeTone() {
  if (!currentUser || currentUser.role !== 'admin') return;
  const keepUploads = {
    customAccentDataUrl: appState.metronomeConfig?.customAccentDataUrl || '',
    customAccentName: appState.metronomeConfig?.customAccentName || '',
    customRegularDataUrl: appState.metronomeConfig?.customRegularDataUrl || '',
    customRegularName: appState.metronomeConfig?.customRegularName || ''
  };
  appState.metronomeConfig = { ...DEFAULT_METRONOME_CONFIG, ...keepUploads };
  metronomeState.soundMode = 'default';
  metronomeState.soundModeInitialized = true;
  updateMetronomeMasterGain();
  saveState();
  refreshMetronomeInteractivePanels();
  showToast('Metronome tone reset to TSM Default');
}

  let html = `<div class="grid ${colsCls} gap-2">`;
  for (let i = 0; i < count; i++) {
    const lvl = metronomeState.beatPattern[i] ?? (i === 0 ? 3 : 2);
    const label = lvl === 3 ? 'Accent' : lvl === 2 ? 'Beat' : lvl === 1 ? 'Soft' : 'Mute';
    const cls = lvl === 3
      ? 'bg-[#7F1D1D] border-[#EF4444] text-white'

        : lvl === 1

        <span class="text-[10px] font-semibold opacity-90 mt-1 leading-none">${label}</span>
      </button>

  }
  html += `</div>`;
  return html;
}
