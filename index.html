              ${regularUrl ? `<button type="button" onclick="clearMetronomeCustomSound('regular')" class="min-h-[40px] px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 hover:bg-slate-800 text-slate-300 text-xs font-semibold">Clear</button>` : ''}
            </div>
          </div>
        </div>
      </div>

      ${isAdmin ? `
      <!-- ADMIN CUSTOMISED TONE DESIGNER -->
      <div class="pt-4 border-t border-[#1E3A8A]/60 space-y-3.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h4 class="text-xs sm:text-sm font-bold text-white">Admin Customised Tone Studio</h4>
            <p class="text-[11px] text-slate-400">Sculpt the academy metronome tone and publish defaults to every student device</p>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="resetAdminMetronomeTone()" class="min-h-[38px] px-3 py-1.5 rounded-lg bg-[#050810] border border-slate-700 hover:bg-slate-900 text-slate-300 text-xs font-semibold">Reset</button>
            <button type="button" onclick="saveAdminMetronomeConfig()" class="min-h-[38px] px-3.5 py-1.5 rounded-lg bg-[#16A34A] hover:bg-[#15803D] text-white text-xs font-bold transition whitespace-nowrap">Save Tone to Academy</button>
          </div>
        </div>

        <!-- QUICK TONE PRESETS -->
        <div class="flex flex-wrap gap-1.5">
          ${Object.entries(METRONOME_ADMIN_TONE_PRESETS).map(([key, p]) => `
            <button type="button" onclick="applyAdminTonePreset('${key}')"
              class="min-h-[36px] px-3 py-1.5 rounded-lg text-xs font-bold border transition whitespace-nowrap ${
                cfg.tonePreset === key
                  ? 'bg-[#22C55E] border-[#4ADE80] text-[#050810]'
                  : 'bg-[#050810] border-[#1E3A8A] text-slate-200 hover:bg-[#172554]'
              }">
              ${p.label}
            </button>
          `).join('')}
        </div>

        <!-- WAVEFORM + STUDENT DEFAULT MODE -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="block text-[11px] font-semibold text-slate-300">Tone Waveform</label>
            <select onchange="updateAdminToneField('waveform', this.value)" class="w-full min-h-[42px] px-3 py-2 rounded-lg bg-[#050810] border border-[#1E3A8A] text-white text-xs font-bold">
              <option value="triangle" ${cfg.waveform === 'triangle' ? 'selected' : ''}>Triangle (Woody / Crisp)</option>
              <option value="sine" ${cfg.waveform === 'sine' ? 'selected' : ''}>Sine (Pure / Resonant)</option>
              <option value="square" ${cfg.waveform === 'square' ? 'selected' : ''}>Square (Loud Electronic Rim)</option>
              <option value="sawtooth" ${cfg.waveform === 'sawtooth' ? 'selected' : ''}>Sawtooth (Bright Cutting Edge)</option>
            </select>
          </div>
          <div class="space-y-1">
            <label class="block text-[11px] font-semibold text-slate-300">Default Sound for Students</label>
            <select onchange="updateAdminToneField('defaultSoundMode', this.value)" class="w-full min-h-[42px] px-3 py-2 rounded-lg bg-[#050810] border border-[#1E3A8A] text-white text-xs font-bold">
              <option value="default" ${cfg.defaultSoundMode === 'default' ? 'selected' : ''}>Default Loud Sound</option>
              <option value="custom_tone" ${cfg.defaultSoundMode === 'custom_tone' ? 'selected' : ''}>Admin Customised Tone</option>
              <option value="custom_upload" ${cfg.defaultSoundMode === 'custom_upload' ? 'selected' : ''}>Admin Custom Uploaded Sound</option>
            </select>
          </div>
        </div>

        <!-- FREQUENCY, DECAY, SNAP & LOUDNESS SLIDERS -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 text-xs">
          <div class="space-y-1.5">
            <div class="flex justify-between text-[11px]">
              <span class="font-semibold text-[#FCA5A5]">Accent Pitch</span>
              <span id="metroAdminVal_accentFreq" class="font-mono font-bold text-white tabular-nums">${Math.round(cfg.accentFreq)} Hz</span>
            </div>
            <input type="range" min="300" max="3200" step="10" value="${Math.round(cfg.accentFreq)}" oninput="updateAdminToneField('accentFreq', this.value)" class="w-full tsm-metro-range tsm-metro-range-red" />
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between text-[11px]">
              <span class="font-semibold text-[#86EFAC]">Regular Beat Pitch</span>
              <span id="metroAdminVal_regularFreq" class="font-mono font-bold text-white tabular-nums">${Math.round(cfg.regularFreq)} Hz</span>
            </div>
            <input type="range" min="200" max="2400" step="10" value="${Math.round(cfg.regularFreq)}" oninput="updateAdminToneField('regularFreq', this.value)" class="w-full tsm-metro-range" />
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between text-[11px]">
              <span class="font-semibold text-[#93C5FD]">Subdivision Pitch</span>
              <span id="metroAdminVal_subFreq" class="font-mono font-bold text-white tabular-nums">${Math.round(cfg.subFreq)} Hz</span>
            </div>
            <input type="range" min="180" max="1800" step="10" value="${Math.round(cfg.subFreq)}" oninput="updateAdminToneField('subFreq', this.value)" class="w-full tsm-metro-range" />
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between text-[11px]">
              <span class="font-semibold text-slate-300">Click Decay</span>
              <span id="metroAdminVal_decayMs" class="font-mono font-bold text-white tabular-nums">${Math.round(cfg.decayMs)} ms</span>
            </div>
            <input type="range" min="15" max="160" step="1" value="${Math.round(cfg.decayMs)}" oninput="updateAdminToneField('decayMs', this.value)" class="w-full tsm-metro-range" />
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between text-[11px]">
              <span class="font-semibold text-slate-300">Percussive Snap</span>
              <span id="metroAdminVal_clickSnap" class="font-mono font-bold text-white tabular-nums">${Math.round(cfg.clickSnap * 100)}%</span>
            </div>
            <input type="range" min="0" max="1" step="0.05" value="${cfg.clickSnap}" oninput="updateAdminToneField('clickSnap', this.value)" class="w-full tsm-metro-range" />
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between text-[11px]">
              <span class="font-semibold text-[#86EFAC]">Loudness Boost</span>
              <span id="metroAdminVal_loudnessBoost" class="font-mono font-bold text-white tabular-nums">${Math.round(cfg.loudnessBoost * 100)}%</span>
            </div>
            <input type="range" min="1.0" max="2.2" step="0.05" value="${cfg.loudnessBoost}" oninput="updateAdminToneField('loudnessBoost', this.value)" class="w-full tsm-metro-range" />
          </div>
        </div>
      </div>
      ` : ''}
    </div>
  `;
}

function refreshMetronomeInteractivePanels() {
  const isAdmin = currentUser && currentUser.role === 'admin';
  const metersHost = document.getElementById('metroMetersPanelHost');
  if (metersHost) metersHost.innerHTML = buildMetronomeMetersPanelHtml();
  const soundHost = document.getElementById('metroSoundPanelHost');
  if (soundHost) soundHost.innerHTML = buildMetronomeSoundPanelHtml(isAdmin);
  const hdrMeta = document.getElementById('metroHeaderMeta');
  if (hdrMeta) hdrMeta.textContent = `${metronomeState.beatsPerBar}/${metronomeState.beatUnit} · ${metronomeState.bpm} BPM · ${getTempoMarking(metronomeState.bpm)}`;
  const recHdrEl = document.getElementById('recHeaderStatusText');
  if (recHdrEl && !isRecordingAudio) recHdrEl.textContent = `Ready · ${metronomeState.beatsPerBar}/${metronomeState.beatUnit} · ${metronomeState.bpm} BPM`;
}

function bindMetronomeKeyboardOnce() {
  if (metronomeKeyListenerBound) return;
  metronomeKeyListenerBound = true;
  window.addEventListener('keydown', (e) => {
    if (activeTab !== 'audio' && activeTab !== 'student_audio') return;
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      toggleMetronomePlay();
    }
  });
  window.addEventListener('resize', () => {
    if (activeTab === 'audio' || activeTab === 'student_audio') {
      drawMetronomeCanvasFrame();
    }
  });
}

function renderMetronomeTab(el, isAdmin) {
  bindMetronomeKeyboardOnce();
  getActiveMetronomeSoundMode();
  const volPct = Math.round(metronomeState.volume * 100);

  el.innerHTML = `
    <div class="max-w-5xl mx-auto space-y-4">
      <!-- MAIN DARK BLUE & BLACK STUDIO CHASSIS -->
      <div class="rounded-2xl bg-[#050810] border border-[#1E3A8A]/80 shadow-xl overflow-hidden text-white">
        <!-- TSM BRAND HEADER BAR -->
        <div class="px-4 sm:px-6 py-3.5 bg-gradient-to-r from-[#050810] via-[#0F172A] to-[#050810] border-b border-[#1E3A8A]/60 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <!-- TSM LOGO EMBLEM -->
            <svg class="w-10 h-10 shrink-0 rounded-xl shadow-md" viewBox="0 0 64 64" aria-label="TSM Logo">
              <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F172A"/>
              <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="#1E3A8A" stroke-width="2.5"/>
              <text x="11" y="40" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">TS</text>
              <text x="38" y="40" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="22" fill="#EF4444">M</text>
            </svg>
            <div class="min-w-0">
              <div class="text-xs sm:text-sm font-extrabold tracking-wide uppercase truncate text-white">
                TIKARIYA'S SCHOOL OF <span class="text-[#EF4444]">M</span>USIC
              </div>
              <div class="text-[11px] text-slate-400 truncate">
                Studio Metronome · <span id="metroHeaderMeta" class="text-[#86EFAC] font-semibold tabular-nums">${metronomeState.beatsPerBar}/${metronomeState.beatUnit} · ${metronomeState.bpm} BPM · ${getTempoMarking(metronomeState.bpm)}</span>
              </div>
            </div>
          </div>
          <div id="metroBeatCounterText" class="text-xs font-mono font-bold text-slate-300 tabular-nums whitespace-nowrap">
            ${metronomeState.isPlaying ? `Beat ${metronomeState.activeBeatIndex + 1} of ${metronomeState.beatsPerBar} · ${metronomeState.beatsPerBar}/${metronomeState.beatUnit}` : `Ready · ${metronomeState.beatsPerBar}/${metronomeState.beatUnit}`}
          </div>
        </div>

        <!-- BOUNCING BALL STAGE -->
        <div class="p-3 sm:p-5 bg-[#04070F] border-b border-[#1E3A8A]/50">
          <div class="relative w-full h-[190px] sm:h-[230px] rounded-xl overflow-hidden border border-[#1E3A8A]/70 bg-[#04070F]">
            <canvas id="metronomeCanvas" class="w-full h-full block"></canvas>
          </div>
        </div>

        <!-- PRIMARY TEMPO & TRANSPORT DECK -->
        <div class="p-4 sm:p-6 bg-[#0B1224] space-y-5">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
            <!-- BIG BPM READOUT & STEPPER -->
            <div class="lg:col-span-7 space-y-3.5">
              <div class="flex flex-wrap items-end justify-between gap-3">
                <div class="flex items-baseline gap-2.5">
                  <span id="metroBpmDisplay" class="text-5xl sm:text-6xl font-extrabold font-mono tabular-nums tracking-tight text-white leading-none">${metronomeState.bpm}</span>
                  <div>
                    <div class="text-xs font-bold text-[#22C55E] uppercase tracking-wider">BPM</div>
                    <div id="metroTempoMarking" class="text-xs font-semibold text-slate-300">${getTempoMarking(metronomeState.bpm)}</div>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <label for="metroBpmInput" class="text-[11px] font-semibold text-slate-400">Exact (30–300)</label>
                  <input id="metroBpmInput" type="number" min="30" max="300" value="${metronomeState.bpm}"
                    onchange="setMetronomeBpm(this.value)"
                    class="w-20 min-h-[40px] px-2.5 py-1.5 rounded-lg bg-[#050810] border border-[#1E3A8A] text-white text-sm font-mono font-bold text-center tabular-nums focus:outline-none focus:border-[#22C55E]" />
                </div>
              </div>

              <!-- TEMPO SLIDER 30 TO 300 -->
              <div class="space-y-1">
                <input id="metroBpmSlider" type="range" min="30" max="300" step="1" value="${metronomeState.bpm}"
                  oninput="setMetronomeBpm(this.value)"
                  class="w-full tsm-metro-range" />
                <div class="flex justify-between text-[10px] font-mono text-slate-400 tabular-nums">
                  <span>30</span>
                  <span>80</span>
                  <span>120</span>
                  <span>180</span>
                  <span>240</span>
                  <span>300</span>
                </div>
              </div>

              <!-- QUICK TEMPO STEPPERS -->
              <div class="grid grid-cols-6 gap-1.5">
                ${[-10, -5, -1, 1, 5, 10].map(d => `
                  <button type="button" onclick="stepMetronomeBpm(${d})"
                    class="min-h-[44px] rounded-xl border text-xs font-extrabold font-mono tabular-nums transition active:scale-95 ${
                      d < 0
                        ? 'bg-[#050810] border-[#1E3A8A] text-[#FCA5A5] hover:bg-[#450A0A]/70 hover:border-[#EF4444]'
                        : 'bg-[#050810] border-[#1E3A8A] text-[#86EFAC] hover:bg-[#052E16]/70 hover:border-[#22C55E]'
                    }">
                    ${d > 0 ? '+' + d : d}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- START/STOP, TAP TEMPO & LOUD VOLUME -->
            <div class="lg:col-span-5 space-y-3.5">
              <div class="grid grid-cols-2 gap-2.5">
                <button id="metroPlayToggleBtn" type="button" onclick="toggleMetronomePlay()"
                  class="min-h-[54px] px-6 py-3 rounded-xl font-extrabold text-sm sm:text-base tracking-wide flex items-center justify-center gap-2.5 transition active:scale-[0.98] ${
                    metronomeState.isPlaying
                      ? 'bg-[#DC2626] hover:bg-[#B91C1C] text-white shadow-lg shadow-red-950/60'
                      : 'bg-[#16A34A] hover:bg-[#15803D] text-white shadow-lg shadow-emerald-950/60'
                  }">
                  ${metronomeState.isPlaying
                    ? `<svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Stop</span>`
                    : `<svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Start</span>`}
                </button>
                <button type="button" onclick="handleMetronomeTapTempo()"
                  class="min-h-[54px] px-4 py-3 rounded-xl bg-[#172554] hover:bg-[#1E3A8A] active:scale-[0.97] border border-[#3B82F6]/60 text-white text-sm font-extrabold transition">
                  Tap Tempo
                </button>
              </div>

              <!-- LOUDNESS / VOLUME CONTROL -->
              <div class="p-3 rounded-xl bg-[#050810] border border-[#1E3A8A]/70 space-y-1.5">
                <div class="flex items-center justify-between text-xs">
                  <span class="font-bold text-slate-200">Loudness Output</span>
                  <span id="metroVolLabel" class="font-mono font-bold text-[#22C55E] tabular-nums">${volPct === 0 ? 'Muted' : volPct + '%'}</span>
                </div>
                <input type="range" min="0" max="180" step="5" value="${volPct}" oninput="setMetronomeVolume(this.value)" class="w-full tsm-metro-range" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TIME SIGNATURE & BEAT PATTERN PANEL -->
      <div id="metroMetersPanelHost" class="rounded-2xl bg-[#0B1224] border border-[#1E3A8A]/70 p-4 sm:p-5 text-white shadow-md">
        ${buildMetronomeMetersPanelHtml()}
      </div>

      <!-- SOUND ENGINE, CUSTOM UPLOAD & ADMIN TONE DESIGNER PANEL -->
      <div id="metroSoundPanelHost" class="rounded-2xl bg-[#0B1224] border border-[#1E3A8A]/70 p-4 sm:p-5 text-white shadow-md">
        ${buildMetronomeSoundPanelHtml(isAdmin)}
      </div>
    </div>
  `;

  requestAnimationFrame(() => {
    drawMetronomeCanvasFrame();
    if (metronomeState.isPlaying) startMetronomeAnimationLoop();
  });
}

// ==========================================
// 18. MODAL HELPERS & BOOTSTRAP
// ==========================================
function showModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBackdrop').classList.remove('hidden');
}

function closeModal() {
  stopQrCamera();
  stopPhotoCamera();
  document.getElementById('modalBackdrop').classList.add('hidden');
}

initPwaIconsAndManifest();
checkPublicQrVerify();
if (currentUser && !window.location.search.includes('verify=') && !window.location.search.includes('cert=')) {
  enterApp();
}
initFirebaseAuto();
</script>
